name: Tests

on:
  push:
    branches: [master, main, staging]
  pull_request:
    branches: [master, main, staging]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run test suite
        env:
          DB_PATH: /tmp/test_sihaa.db
          ADMIN_PASSWORD: TestAdmin1!
        run: python -m pytest -v --tb=short --cov=server --cov-report=term-missing
