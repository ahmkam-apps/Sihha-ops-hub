<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volunteer Portal — Sihha</title>
<link rel="manifest" href="/manifest-volunteer.json">
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sihha Volunteer">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/base.css">
<style>
  :root {
    --black: #111111; --white: #ffffff; --off-white: #f6f6f6;
    --gray-1: #f0f0f0; --gray-2: #e0e0e0; --gray-3: #c0c0c0;
    --gray-4: #888; --gray-5: #555;
    --font: 'AreaNormal', Helvetica, Arial, sans-serif;
    --font-head: 'AreaExtrabold', Helvetica, Arial, sans-serif;
    --green: #1a7a3c; --red: #c00;
  }
  body { font-family: var(--font); background: var(--off-white); color: var(--black); min-height: 100vh; }

  /* ── Header ── */
  .header {
    background: var(--black); color: var(--white);
    padding: 14px 20px; display: flex; justify-content: space-between; align-items: center;
  }
  .header-logo { font-family: var(--font-head); font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
  .header-right { font-size: 13px; color: var(--gray-3); display: flex; align-items: center; gap: 12px; }
  #vol-name-display { color: var(--white); font-weight: 600; }
  .btn-logout {
    background: none; border: 1px solid var(--gray-3); color: var(--gray-3);
    padding: 5px 12px; font-size: 12px; cursor: pointer; font-family: var(--font);
  }
  .btn-logout:hover { border-color: var(--white); color: var(--white); }

  /* ── Tab bar ── */
  .tab-bar {
    display: flex; border-bottom: 2px solid var(--gray-2);
    position: sticky; top: 0; background: var(--off-white); z-index: 50;
  }
  .tab {
    flex: 1; text-align: center;
    padding: 14px 12px; font-size: 12px; font-weight: 700; cursor: pointer;
    border-bottom: 3px solid transparent; margin-bottom: -2px; color: var(--gray-4);
    text-transform: uppercase; letter-spacing: 0.06em; transition: color 0.15s;
  }
  .tab.active { color: var(--black); border-bottom-color: var(--black); }
  .tab:hover:not(.active) { color: var(--black); }

  /* ── Container ── */
  .container { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }

  /* ── Buttons ── */
  .btn {
    display: block; width: 100%; background: var(--black); color: var(--white);
    border: none; padding: 14px 20px; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: var(--font); letter-spacing: 0.02em; text-align: center;
  }
  .btn:hover { background: #333; }
  .btn-green { background: var(--green); }
  .btn-green:hover { background: #145e2d; }
  .btn-outline {
    display: block; width: 100%; background: transparent; color: var(--black);
    border: 1.5px solid var(--black); padding: 13px 20px; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: var(--font); letter-spacing: 0.02em; text-align: center;
  }
  .btn-outline:hover { background: var(--gray-1); }
  .btn-sm {
    display: inline-block; width: auto; padding: 7px 16px;
    font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .btn-cancel { background: var(--gray-1); color: var(--black); border: 1px solid var(--gray-2); width: 100%; padding: 14px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: var(--font); }
  .btn-cancel:hover { background: var(--gray-2); }
  .btn-disabled { background: var(--gray-3); cursor: not-allowed; }
  .error { color: var(--red); font-size: 13px; margin-top: 10px; display: none; }

  /* ── Section divider ── */
  .section-divider {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--gray-4); margin: 0 0 12px; padding-bottom: 8px;
    border-bottom: 2px solid var(--gray-2); display: flex; align-items: center;
    justify-content: space-between;
  }
  .section-divider + * { margin-top: 0; }

  /* ── Work Cards ── */
  .work-card {
    background: var(--white); border: 1px solid var(--gray-2);
    margin-bottom: 16px; overflow: hidden;
  }
  .work-card-header {
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--gray-2);
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .work-card-role {
    font-family: var(--font-head); font-size: 20px; font-weight: 800;
    letter-spacing: -0.02em; line-height: 1;
  }
  .work-card-status {
    font-size: 12px; font-weight: 700; padding: 4px 10px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .status-confirmed { background: #e6f4ea; color: var(--green); }
  .status-done { background: var(--gray-1); color: var(--gray-4); }
  .work-card-body { padding: 14px 20px; }
  .work-card-family {
    font-family: monospace; font-size: 18px; font-weight: 700;
    letter-spacing: 0.04em; margin-bottom: 3px;
  }
  .work-card-meta { font-size: 12px; color: var(--gray-4); margin-bottom: 12px; }
  .work-card-items {
    background: var(--off-white); border: 1px solid var(--gray-2);
    padding: 10px 14px; margin-bottom: 12px; font-size: 13px; line-height: 1.7;
  }
  .work-card-items-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--gray-4); margin-bottom: 5px;
  }
  .work-card-address {
    background: #fffbeb; border: 1px solid #fcd34d;
    padding: 10px 14px; margin-bottom: 12px; font-size: 13px; font-weight: 600;
  }
  .work-card-address-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: #92400e; margin-bottom: 4px;
  }
  .work-card-footer { padding: 0 20px 20px; }
  .receipt-submitted-note {
    font-size: 12px; color: var(--green); font-weight: 600;
    margin-top: 8px; text-align: center;
  }

  /* ── Sign-up family rows ── */
  .signup-card {
    background: var(--white); border: 1px solid var(--gray-2);
    margin-bottom: 8px; padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px;
  }
  .signup-card-left {}
  .signup-family-code { font-family: monospace; font-size: 15px; font-weight: 700; }
  .signup-family-meta { font-size: 12px; color: var(--gray-4); margin-top: 2px; }
  .signup-btns { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .slot-btn {
    padding: 7px 16px; font-size: 12px; font-weight: 700;
    cursor: pointer; font-family: var(--font); border: none; letter-spacing: 0.02em;
  }
  .slot-btn-open { background: var(--black); color: var(--white); }
  .slot-btn-open:hover { background: #333; }
  .slot-btn-mine { color: var(--white); border: none; }
  .slot-btn-taken { background: var(--gray-1); color: var(--gray-4); border: 1px solid var(--gray-2); font-size: 11px; padding: 6px 10px; cursor: default; }

  /* ── Cycle accordion for upcoming ── */
  .cycle-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; cursor: pointer; background: var(--gray-1);
    border: 1px solid var(--gray-2); margin-bottom: -1px;
  }
  .cycle-header-title { font-size: 14px; font-weight: 700; }
  .cycle-header-meta { font-size: 12px; color: var(--gray-4); margin-top: 2px; }
  .cycle-toggle { font-size: 20px; color: var(--gray-4); line-height: 1; font-weight: 300; }
  .cycle-families-wrap { border: 1px solid var(--gray-2); border-top: none; margin-bottom: 16px; display: none; }

  /* ── Stat pills (History) ── */
  .stat-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 24px; }
  .stat-pill {
    background: var(--white); border: 1px solid var(--gray-2);
    padding: 14px 16px; flex: 1; min-width: 90px; text-align: center;
  }
  .stat-pill-num { font-family: var(--font-head); font-size: 28px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; }
  .stat-pill-lbl { font-size: 10px; color: var(--gray-4); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px; }

  /* ── History rows ── */
  .history-row {
    background: var(--white); border: 1px solid var(--gray-2);
    padding: 12px 16px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .history-row-left { font-size: 13px; }
  .history-row-meta { font-size: 12px; color: var(--gray-4); margin-top: 2px; }

  /* ── Badges ── */
  .badge {
    display: inline-block; padding: 3px 10px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .badge-shopping { background: #cff4fc; color: #055160; }
  .badge-delivery { background: #f8d7da; color: #842029; }
  .badge-stock    { background: #e2e3e5; color: #383d41; }
  .badge-complete { background: #e2e3e5; color: #383d41; }

  /* ── Order status indicator ── */
  .order-chip {
    font-size: 11px; font-weight: 700; padding: 3px 8px; white-space: nowrap;
  }
  .order-chip-yes { background: #e6f4ea; color: var(--green); }
  .order-chip-no  { background: #fff8e1; color: #b45309; }

  /* ── Misc ── */
  .empty { text-align: center; color: var(--gray-4); font-size: 14px; padding: 48px 20px; line-height: 1.6; }
  .empty-cta { margin-top: 14px; display: inline-block; font-size: 13px; font-weight: 700; color: var(--black); text-decoration: underline; cursor: pointer; }
  .spinner { display: block; font-size: 13px; color: var(--gray-4); padding: 32px 0; text-align: center; }
  .section-gap { margin-top: 32px; }

  /* ── Receipt modal ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200;
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    background: var(--white); width: 100%; max-width: 540px; padding: 28px 24px 40px;
    border-radius: 8px 8px 0 0; animation: slideUp 0.22s ease;
  }
  @keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 18px; }
  .field-group { margin-bottom: 14px; }
  .field-group label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase;
                       letter-spacing: 0.06em; margin-bottom: 6px; color: var(--gray-5); }
  .field-group input, .field-group select {
    width: 100%; border: 1px solid var(--gray-2); padding: 11px 13px;
    font-family: var(--font); font-size: 15px; background: var(--white);
    outline: none; -webkit-appearance: none;
  }
  .field-group input:focus, .field-group select:focus { border-color: var(--black); }
  .file-upload-area {
    border: 2px dashed var(--gray-2); padding: 24px 16px; text-align: center;
    cursor: pointer; font-size: 13px; color: var(--gray-4); transition: border-color 0.15s;
  }
  .file-upload-area:hover { border-color: var(--black); color: var(--black); }
  .file-preview { max-width: 100%; max-height: 160px; margin-top: 10px; border: 1px solid var(--gray-2); }
  .btn-row { display: flex; gap: 10px; margin-top: 18px; }
  .btn-row > * { flex: 1; }

  @media (max-width: 480px) {
    .container { padding: 16px 12px 48px; }
    .work-card-role { font-size: 17px; }
    .work-card-family { font-size: 16px; }
  }

  /* ── Login screen ── */
  .login-wrap {
    max-width: 380px; margin: 60px auto; background: var(--white);
    border: 1px solid var(--gray-2); padding: 32px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">Sihha · Volunteer</div>
  <div class="header-right">
    <span id="vol-name-display"></span>
    <button class="btn-logout" id="logout-btn" style="display:none" onclick="logout()">Log out</button>
  </div>
</div>

<!-- LOGIN SCREEN (redirect only) -->
<div id="login-screen" style="display:none"></div>

<!-- MAIN APP -->
<div id="app-screen" style="display:none">

  <!-- 3-TAB BAR -->
  <div class="tab-bar">
    <div class="tab active" id="tab-work"    onclick="switchTab('work')">My Work</div>
    <div class="tab"        id="tab-signup"  onclick="switchTab('signup')">Sign Up</div>
    <div class="tab"        id="tab-history" onclick="switchTab('history')">History</div>
  </div>

  <!-- MY WORK PANE -->
  <div id="pane-work" class="container">
    <div id="my-work-content"><div class="spinner">Loading…</div></div>
  </div>

  <!-- SIGN UP PANE -->
  <div id="pane-signup" class="container" style="display:none">
    <div class="section-divider"><span id="active-section-label">Active</span></div>
    <div id="slots-content"><div class="spinner">Loading…</div></div>
    <div class="section-gap" id="upcoming-section-header" style="display:none">
      <div class="section-divider"><span>Upcoming</span></div>
    </div>
    <div id="upcoming-content"></div>
  </div>

  <!-- HISTORY PANE -->
  <div id="pane-history" class="container" style="display:none">
    <div id="history-content"><div class="spinner">Loading…</div></div>
  </div>

</div>

<!-- RECEIPT MODAL -->
<div class="modal-overlay" id="receipt-modal">
  <div class="modal-sheet">
    <div class="modal-title">Submit Receipt</div>
    <div class="field-group">
      <label>Store Name</label>
      <input type="text" id="r-store" placeholder="e.g. Sam's Club, Wegmans">
    </div>
    <div class="field-group">
      <label>Purchase Date</label>
      <input type="date" id="r-date">
    </div>
    <div class="field-group">
      <label>Total Amount ($)</label>
      <input type="number" id="r-amount" step="0.01" min="0" placeholder="0.00">
    </div>
    <div class="field-group">
      <label>Receipt Photo</label>
      <div class="file-upload-area" onclick="document.getElementById('r-file').click()">
        <div id="r-upload-label">📷 Tap to upload photo (JPG, PNG, PDF)</div>
        <img id="r-file-preview" class="file-preview" style="display:none">
      </div>
      <input type="file" id="r-file" accept="image/*,.pdf,.heic" style="display:none" onchange="handleFileSelect(this)">
    </div>
    <div id="r-error" style="color:var(--red);font-size:13px;display:none;margin-top:8px"></div>
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeReceiptModal()">Cancel</button>
      <button class="btn btn-green" id="r-submit-btn" onclick="submitReceipt()">Submit</button>
    </div>
  </div>
</div>

<script src="/js/shared.js"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});

let TOKEN = localStorage.getItem('portalToken') || localStorage.getItem('portal_token');
let VOL   = JSON.parse(localStorage.getItem('portalVolunteer') || localStorage.getItem('portal_vol') || 'null');

// ── API ───────────────────────────────────────────────────────────────────────
// shared.js makeApi — body sent whenever !== undefined (legacy portal.html behavior)
const api = makeApi(() => TOKEN, true);
const GET  = p => api('GET', p);
const POST = (p, b) => api('POST', p, b);

// ── Auth ──────────────────────────────────────────────────────────────────────
function logout() {
  stopPolling();
  localStorage.removeItem('portalToken');
  localStorage.removeItem('portalVolunteer');
  localStorage.removeItem('portal_token');
  localStorage.removeItem('portal_vol');
  TOKEN = null; VOL = null;
  window.location.href = '/login';
}

async function showApp() {
  document.getElementById('login-screen').style.display  = 'none';
  document.getElementById('app-screen').style.display    = 'block';
  document.getElementById('vol-name-display').textContent = VOL.name;
  document.getElementById('logout-btn').style.display    = 'inline-block';
  switchTab('work');
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  ['work','signup','history'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
    document.getElementById('pane-' + t).style.display = t === tab ? '' : 'none';
  });
  if (tab === 'work')    { refreshWork(); startPolling(); }
  if (tab === 'signup')  { stopPolling(); refreshSignup(); }
  if (tab === 'history') { stopPolling(); loadHistory(); }
}

// ── Polling ───────────────────────────────────────────────────────────────────
let _pollTimer = null;
function startPolling() {
  stopPolling();
  _pollTimer = setInterval(() => {
    if (document.visibilityState !== 'hidden') silentRefreshWork();
  }, 60000);
}
function stopPolling() {
  if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && _pollTimer) silentRefreshWork();
});

async function silentRefreshWork() {
  try {
    const [tasks, receipts] = await Promise.all([
      GET('/portal/my-tasks'),
      GET('/portal/receipts').catch(() => [])
    ]);
    renderMyWork(tasks, receipts);
  } catch(e) {
    if (e.message.includes('expired')) logout();
  }
}

// ── My Work Tab ───────────────────────────────────────────────────────────────
let _receipts = [];

async function refreshWork() {
  document.getElementById('my-work-content').innerHTML = '<div class="spinner">Loading…</div>';
  try {
    const [tasks, receipts] = await Promise.all([
      GET('/portal/my-tasks'),
      GET('/portal/receipts').catch(() => [])
    ]);
    renderMyWork(tasks, receipts);
  } catch(e) {
    if (e.message.includes('expired')) { logout(); return; }
    document.getElementById('my-work-content').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

function renderMyWork(tasks, receipts) {
  receipts  = receipts || [];
  _receipts = receipts;

  const active = tasks.filter(t => !t.was_released);
  if (!active.length) {
    document.getElementById('my-work-content').innerHTML = `
      <div class="empty">
        No assignments yet.<br>
        <span class="empty-cta" onclick="switchTab('signup')">Browse open slots →</span>
      </div>`;
    return;
  }

  // Sort: active first (confirmed, not done), then done
  const sorted = [
    ...active.filter(t => t.status !== 'complete'),
    ...active.filter(t => t.status === 'complete')
  ];

  const html = sorted.map(t => {
    const isDone      = t.status === 'complete';
    const isDelivery  = t.task_type === 'delivery';
    const isShopping  = t.task_type === 'shopping';
    const roleLabel   = t.task_type.charAt(0).toUpperCase() + t.task_type.slice(1);
    const receipt     = receipts.find(r => r.slot_id === t.id);

    const statusChip = isDone
      ? `<span class="work-card-status status-done">✓ Done</span>`
      : `<span class="work-card-status status-confirmed">✓ Confirmed</span>`;

    // Address block — delivery only
    const addressBlock = isDelivery && t.address
      ? `<div class="work-card-address">
           <div class="work-card-address-label">📍 Delivery Address</div>
           ${esc(t.address)}, ${esc(t.city || '')}
         </div>` : '';

    // Shopping list — shopping only
    const itemsBlock = isShopping && t.shopping_items && t.shopping_items.length
      ? `<div class="work-card-items">
           <div class="work-card-items-label">Shopping List</div>
           ${t.shopping_items.map(i => `${esc(i.name)} <strong>×${esc(i.qty)}</strong>`).join('<br>')}
         </div>` : '';

    // Action buttons
    let actionHtml = '';
    if (!isDone) {
      if (isShopping) {
        const btnLabel = receipt ? '✏️  Update Receipt' : '📷  Submit Receipt';
        const btnCls   = receipt ? 'btn-outline' : 'btn btn-green';
        actionHtml = `<button class="${btnCls}" onclick="openReceiptModal('${t.id}')">${btnLabel}</button>`;
        if (receipt) {
          actionHtml += `<div class="receipt-submitted-note">✓ Receipt submitted — pending review</div>`;
        }
      } else if (isDelivery) {
        actionHtml = `<button class="btn-outline" onclick="completeTask('${t.id}')">✓ Mark as Done</button>`;
      }
    }

    const opacity = isDone ? 'opacity:0.6;' : '';

    return `
      <div class="work-card" style="${opacity}">
        <div class="work-card-header">
          <div class="work-card-role">${roleLabel}</div>
          ${statusChip}
        </div>
        <div class="work-card-body">
          <div class="work-card-family">${esc(t.family_code || t.family_name || '—')}</div>
          <div class="work-card-meta">${esc(t.cycle_title)} · ${fmtDate(t.delivery_date_end)}</div>
          ${itemsBlock}
          ${addressBlock}
        </div>
        ${actionHtml ? `<div class="work-card-footer">${actionHtml}</div>` : ''}
      </div>`;
  }).join('');

  document.getElementById('my-work-content').innerHTML = html;
}

// ── Sign Up Tab ───────────────────────────────────────────────────────────────
async function refreshSignup() {
  document.getElementById('slots-content').innerHTML = '<div class="spinner">Loading…</div>';
  try {
    const [cyclesData, tasks] = await Promise.all([
      GET('/portal/cycles').catch(() => []),
      GET('/portal/my-tasks').catch(() => [])
    ]);
    renderAvailable(cyclesData, tasks);
    renderUpcoming(cyclesData);
  } catch(e) {
    if (e.message.includes('expired')) { logout(); return; }
    document.getElementById('slots-content').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

async function renderAvailable(cycles, myTasks) {
  const activeCycles = cycles.filter(c => c.status === 'open' || c.status === 'shopping');
  if (!activeCycles.length) {
    document.getElementById('active-section-label').textContent = 'Active';
    document.getElementById('slots-content').innerHTML =
      '<div class="empty">No active delivery cycles right now.</div>';
    return;
  }
  const label = activeCycles.length === 1
    ? `${fmtDate(activeCycles[0].delivery_date_start)}`
    : 'Active Cycles';
  document.getElementById('active-section-label').textContent = label;

  try {
    const results = await Promise.all(activeCycles.map(c => GET('/portal/families/' + c.id)));
    renderFamilySlots(results);
  } catch(e) {
    if (e.message.includes('expired')) { logout(); return; }
    document.getElementById('slots-content').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

function renderFamilySlots(results) {
  const anyFamilies = results.some(r => r.families && r.families.length > 0);
  if (!anyFamilies) {
    document.getElementById('slots-content').innerHTML =
      '<div class="empty">No families need volunteers right now.</div>';
    return;
  }

  let html = '';
  const multiCycle = results.filter(r => r.families && r.families.length).length > 1;

  results.forEach((data, idx) => {
    if (!data.families || !data.families.length) return;
    const { families, task_types, cycle } = data;

    if (multiCycle) {
      html += `<div style="margin:${idx > 0 ? '20px' : '0'} 0 8px;padding:8px 12px;background:var(--gray-1);border:1px solid var(--gray-2);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;">
        ${esc(cycle.title)} · ${fmtDate(cycle.delivery_date_start)}
      </div>`;
    }
    html += families.map(fam => buildFamilyRow(fam, task_types, cycle)).join('');
  });

  document.getElementById('slots-content').innerHTML = html;
}

function buildFamilyRow(fam, task_types, cycle) {
  const orderConfirmed = ['confirmed','submitted','delivered'].includes(fam.order_status);
  const orderChip = orderConfirmed
    ? `<span class="order-chip order-chip-yes">✓ Order</span>`
    : `<span class="order-chip order-chip-no">⏳ No order</span>`;

  const taskBtns = task_types.map(tt => {
    const mySlotId = fam.my_slots?.[tt.slug];
    const takenBy  = fam.taken_by?.[tt.slug];
    const myStatus = fam.my_status?.[tt.slug];

    if (mySlotId) {
      const bg = 'var(--green)';
      return `<button class="slot-btn slot-btn-mine" style="background:${bg};"
        onclick="cancelSignup('${mySlotId}','${fam.id}')"
        title="Click to cancel">
        ✓ ${esc(tt.label)} ×
      </button>`;
    }
    if (takenBy) {
      return `<span class="slot-btn slot-btn-taken">${esc(tt.label)}: ${esc(takenBy)}</span>`;
    }
    return `<button class="slot-btn slot-btn-open"
      onclick="signUp('${cycle.id}','${fam.id}','${tt.slug}')">
      ${esc(tt.label)}
    </button>`;
  }).join('');

  return `
    <div class="signup-card">
      <div class="signup-card-left">
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="signup-family-code">${esc(fam.family_code || '—')}</span>
          ${orderChip}
        </div>
        <div class="signup-family-meta">Size: ${fam.family_size || '?'}</div>
      </div>
      <div class="signup-btns">${taskBtns}</div>
    </div>`;
}

// ── Upcoming (accordion) ──────────────────────────────────────────────────────
const _upcomingCache = {};

function renderUpcoming(cycles) {
  const upcoming = cycles.filter(c => c.status === 'upcoming');
  const header   = document.getElementById('upcoming-section-header');
  const wrap     = document.getElementById('upcoming-content');

  if (!upcoming.length) { header.style.display = 'none'; wrap.innerHTML = ''; return; }
  header.style.display = '';

  wrap.innerHTML = upcoming.map(c => `
    <div style="margin-bottom:8px;" id="upcoming-row-${c.id}">
      <div class="cycle-header" onclick="toggleUpcoming('${c.id}')">
        <div>
          <div class="cycle-header-title">${esc(c.title)}</div>
          <div class="cycle-header-meta">${fmtDate(c.delivery_date_start)} · ${c.open_slots ?? '—'} open slots</div>
        </div>
        <span class="cycle-toggle" id="upcoming-icon-${c.id}">+</span>
      </div>
      <div class="cycle-families-wrap" id="upcoming-families-${c.id}"></div>
    </div>`
  ).join('');
}

async function toggleUpcoming(cycleId) {
  const familiesEl = document.getElementById('upcoming-families-' + cycleId);
  const iconEl     = document.getElementById('upcoming-icon-' + cycleId);
  const isOpen     = familiesEl.style.display !== 'none' && familiesEl.style.display !== '';

  if (isOpen) {
    familiesEl.style.display = 'none';
    iconEl.textContent = '+';
    return;
  }
  iconEl.textContent = '−';
  familiesEl.style.display = 'block';

  if (_upcomingCache[cycleId]) {
    renderUpcomingFamilies(cycleId, _upcomingCache[cycleId]);
    return;
  }
  familiesEl.innerHTML = '<div class="spinner" style="padding:16px;">Loading…</div>';
  try {
    const data = await GET('/portal/families/' + cycleId);
    _upcomingCache[cycleId] = data;
    renderUpcomingFamilies(cycleId, data);
  } catch(e) {
    familiesEl.innerHTML = `<div class="empty" style="padding:16px;">${esc(e.message)}</div>`;
  }
}

function renderUpcomingFamilies(cycleId, data) {
  const { families, task_types, cycle } = data;
  const el = document.getElementById('upcoming-families-' + cycleId);
  if (!families || !families.length) {
    el.innerHTML = '<div class="empty" style="padding:16px 12px;">No families yet.</div>';
    return;
  }
  el.innerHTML = families.map(fam => {
    const taskBtns = task_types.map(tt => {
      const mySlotId = fam.my_slots?.[tt.slug];
      const takenBy  = fam.taken_by?.[tt.slug];
      const myStatus = fam.my_status?.[tt.slug];
      if (mySlotId) {
        return `<button class="slot-btn slot-btn-mine" style="background:var(--green);"
          onclick="cancelSignup('${mySlotId}','${fam.id}')">✓ ${esc(tt.label)} ×</button>`;
      }
      if (takenBy) {
        return `<span class="slot-btn slot-btn-taken">${esc(tt.label)}: ${esc(takenBy)}</span>`;
      }
      return `<button class="slot-btn slot-btn-open"
        onclick="signUp('${cycle.id}','${fam.id}','${tt.slug}')">${esc(tt.label)}</button>`;
    }).join('');

    return `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--gray-2);flex-wrap:wrap;gap:6px;">
        <div>
          <span style="font-family:monospace;font-size:14px;font-weight:700;">${esc(fam.family_code || '—')}</span>
          <span style="font-size:11px;color:var(--gray-4);margin-left:8px;">Size: ${fam.family_size || '?'}</span>
        </div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;">${taskBtns}</div>
      </div>`;
  }).join('');
}

// ── Signup / Cancel ───────────────────────────────────────────────────────────
async function signUp(cycleId, familyId, taskType) {
  try {
    await POST('/portal/signup', { cycle_id: cycleId, family_id: familyId, task_types: [taskType] });
    // Refresh both sign-up and work tabs
    refreshSignup();
    silentRefreshWork();
  } catch(e) { alert(e.message); }
}

async function cancelSignup(slotId, familyId) {
  if (!confirm('Cancel your sign-up for this task?')) return;
  try {
    await api('DELETE', '/portal/cancel/' + slotId);
    refreshSignup();
    silentRefreshWork();
  } catch(e) { alert(e.message); }
}

// ── Mark Done ─────────────────────────────────────────────────────────────────
async function completeTask(slotId) {
  if (!confirm('Mark this delivery as done?')) return;
  try {
    await POST('/portal/complete/' + slotId, {});
    refreshWork();
  } catch(e) { alert(e.message); }
}

// ── Receipt Modal ─────────────────────────────────────────────────────────────
let _activeSlotId    = null;
let _uploadedFileUrl = null;

function openReceiptModal(slotId) {
  _activeSlotId    = slotId;
  _uploadedFileUrl = null;
  document.getElementById('r-store').value  = '';
  document.getElementById('r-date').value   = new Date().toISOString().slice(0,10);
  document.getElementById('r-amount').value = '';
  document.getElementById('r-file').value   = '';
  document.getElementById('r-file-preview').style.display = 'none';
  document.getElementById('r-upload-label').textContent   = '📷 Tap to upload photo (JPG, PNG, PDF)';
  document.getElementById('r-error').style.display        = 'none';
  document.getElementById('r-submit-btn').disabled        = false;
  document.getElementById('r-submit-btn').textContent     = 'Submit';
  document.getElementById('receipt-modal').classList.add('open');
}

function closeReceiptModal() {
  document.getElementById('receipt-modal').classList.remove('open');
  _activeSlotId = null;
}

function handleFileSelect(input) {
  const file = input.files[0];
  if (!file) return;
  document.getElementById('r-upload-label').textContent = `✓ ${file.name}`;
  if (file.type.startsWith('image/')) {
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.getElementById('r-file-preview');
      img.src = e.target.result;
      img.style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
}

async function submitReceipt() {
  const btn    = document.getElementById('r-submit-btn');
  const errEl  = document.getElementById('r-error');
  const store  = document.getElementById('r-store').value.trim();
  const date   = document.getElementById('r-date').value;
  const amount = parseFloat(document.getElementById('r-amount').value);
  const file   = document.getElementById('r-file').files[0];

  errEl.style.display = 'none';
  if (!store)                       { errEl.textContent = 'Please enter the store name.'; errEl.style.display = 'block'; return; }
  if (!date)                        { errEl.textContent = 'Please enter the purchase date.'; errEl.style.display = 'block'; return; }
  if (isNaN(amount) || amount <= 0) { errEl.textContent = 'Please enter a valid amount.'; errEl.style.display = 'block'; return; }

  btn.disabled = true; btn.textContent = 'Uploading…';

  try {
    let fileUrl = null;
    if (file) {
      const fd = new FormData();
      fd.append('file', file);
      const uploadRes = await fetch('/api/portal/receipts/upload', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + TOKEN },
        body: fd
      });
      const uploadData = await uploadRes.json();
      if (!uploadRes.ok) throw new Error(uploadData.error || 'Upload failed');
      fileUrl = uploadData.file_url;
    }

    btn.textContent = 'Submitting…';
    const res = await POST('/portal/receipts', {
      slot_id:       _activeSlotId,
      store:         store,
      purchase_date: date,
      amount:        amount,
      file_url:      fileUrl
    });

    closeReceiptModal();
    refreshWork();
    alert(res.updated
      ? '✅ Receipt updated. The treasurer has been notified.'
      : '✅ Receipt submitted. The treasurer will review and process your reimbursement.');
  } catch(e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Submit';
  }
}

// ── History Tab ───────────────────────────────────────────────────────────────
async function loadHistory() {
  document.getElementById('history-content').innerHTML = '<div class="spinner">Loading…</div>';
  try {
    const data = await GET('/portal/history');
    const s    = data.stats;

    const statsHtml = `
      <div class="stat-row">
        <div class="stat-pill"><div class="stat-pill-num">${s.completed}</div><div class="stat-pill-lbl">Tasks Done</div></div>
        <div class="stat-pill"><div class="stat-pill-num">${s.shopping}</div><div class="stat-pill-lbl">Shopping</div></div>
        <div class="stat-pill"><div class="stat-pill-num">${s.delivery}</div><div class="stat-pill-lbl">Deliveries</div></div>
        <div class="stat-pill"><div class="stat-pill-num">${s.cycles_served}</div><div class="stat-pill-lbl">Cycles</div></div>
        <div class="stat-pill"><div class="stat-pill-num">${s.families_served}</div><div class="stat-pill-lbl">Families</div></div>
      </div>`;

    if (!data.tasks.length) {
      document.getElementById('history-content').innerHTML =
        statsHtml + '<div class="empty">No completed tasks yet.</div>';
      return;
    }

    const tasksHtml = data.tasks.map(t => `
      <div class="history-row">
        <div class="history-row-left">
          <div><span class="badge badge-${t.task_type}">${esc(t.task_type)}</span> &nbsp;<strong>${esc(t.cycle_title)}</strong></div>
          <div class="history-row-meta">
            Family ${t.family_id.slice(0,8)}… · Size: ${t.family_size || '?'}
            ${t.completed_at ? ' · ' + fmtDate(t.completed_at) : ''}
          </div>
        </div>
        <span class="badge badge-complete">✓ Done</span>
      </div>`).join('');

    document.getElementById('history-content').innerHTML =
      `<div class="section-divider" style="margin-bottom:16px;">Stats</div>${statsHtml}
       <div class="section-divider" style="margin-bottom:16px;">Completed Tasks</div>${tasksHtml}`;
  } catch(e) {
    if (e.message.includes('expired')) { logout(); return; }
    document.getElementById('history-content').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmtDate(d) {
  if (!d) return '';
  return new Date(d + (d.includes('T') ? '' : 'T12:00:00')).toLocaleDateString('en-US',
    { month: 'short', day: 'numeric', year: 'numeric' });
}

// ── Init ──────────────────────────────────────────────────────────────────────
if (TOKEN && VOL) {
  showApp();
} else {
  window.location.href = '/login';
}
</script>
