<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sihha — Donation Progress</title>
<style>
  @font-face {
    font-family: 'AreaNormal';
    src: url('https://static.wixstatic.com/ufonts/2e5170_6263df7a2b874b8c9a621cc0eefc5ab8/woff2/file.woff2') format('woff2');
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: 'AreaNormal', Helvetica, Arial, sans-serif;
    background: transparent;
    color: #111111;
    -webkit-font-smoothing: antialiased;
  }

  #widget {
    padding: 0;
    width: 100%;
  }

  /* ── Labels row ─────────────────────────────────────── */
  .bar-labels {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }

  .bar-raised {
    font-family: 'AreaNormal', Helvetica, Arial, sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #111111;
    letter-spacing: -0.01em;
    line-height: 1;
  }

  .bar-goal {
    font-family: 'AreaNormal', Helvetica, Arial, sans-serif;
    font-size: 20px;
    font-weight: 400;
    color: #111111;
    line-height: 1;
  }

  /* ── Progress bar ───────────────────────────────────── */
  .bar-track {
    width: 100%;
    height: 12px;
    background: rgba(0, 0, 0, 0.12);
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: #111111;
    width: 0%;
    transition: width 1.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* ── Sub-label ──────────────────────────────────────── */
  .bar-sub {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
  }

  .bar-pct {
    font-family: 'AreaNormal', Helvetica, Arial, sans-serif;
    font-size: 13px;
    color: rgba(0, 0, 0, 0.45);
    line-height: 1;
  }

  .bar-surplus {
    font-family: 'AreaNormal', Helvetica, Arial, sans-serif;
    font-size: 13px;
    color: rgba(0, 0, 0, 0.45);
    line-height: 1;
  }

  .bar-goal-met {
    font-family: 'AreaNormal', Helvetica, Arial, sans-serif;
    font-size: 13px;
    color: #1a7a3c;
    margin-top: 8px;
    line-height: 1;
  }

  /* ── Error state ────────────────────────────────────── */
  .bar-error {
    font-family: 'AreaNormal', Helvetica, Arial, sans-serif;
    font-size: 13px;
    color: rgba(0, 0, 0, 0.35);
    text-align: center;
    padding: 8px 0;
  }
</style>
</head>
<body>
<div id="widget"></div>

<script>
const API = '/api/donate-stats';
let lastData = null;

function fmt(n) {
  if (n == null) return '—';
  return '$' + Math.round(n).toLocaleString('en-US');
}

function fmtRaised(n) {
  if (n == null) return '—';
  const rounded = Math.round(n);
  return '$' + rounded.toLocaleString('en-US') + ' raised';
}

function calcBar(d) {
  const monthlyNeed = d.monthly_need || 0;
  const adjTarget   = d.this_month_adjusted_target != null
                        ? d.this_month_adjusted_target
                        : monthlyNeed;
  const surplus     = d.last_month_surplus || 0;
  const collected   = d.month_raised || 0;
  const goalMet     = adjTarget === 0 && monthlyNeed > 0;
  const barGoal     = goalMet ? monthlyNeed : adjTarget;

  let fillPct = 0, pctLabel = '', surplusNote = '';

  if (goalMet) {
    fillPct  = 100;
    pctLabel = "Goal fully covered by last month's surplus";
  } else if (collected >= barGoal && barGoal > 0) {
    fillPct     = 100;
    pctLabel    = 'Goal reached';
    surplusNote = '+' + fmt(collected - barGoal) + ' surplus';
  } else {
    fillPct     = barGoal > 0 ? Math.min(99, Math.round(collected / barGoal * 100)) : 0;
    pctLabel    = fillPct + '% of monthly goal';
    surplusNote = surplus > 0 ? fmt(surplus) + ' carried from last month' : '';
  }

  return { fillPct, pctLabel, surplusNote, goalMet, monthlyNeed, collected };
}

function render(d) {
  lastData = d;
  const b = calcBar(d);

  document.getElementById('widget').innerHTML = `
    <div class="bar-labels">
      <div class="bar-raised">${fmtRaised(b.collected)}</div>
      <div class="bar-goal">${fmt(b.monthlyNeed)}</div>
    </div>
    <div class="bar-track">
      <div class="bar-fill" id="bar-fill" style="width:0%;"></div>
    </div>
    <div class="bar-sub">
      <div class="bar-pct">${b.pctLabel}</div>
      ${b.surplusNote ? `<div class="bar-surplus">${b.surplusNote}</div>` : ''}
    </div>
    ${b.goalMet ? `<div class="bar-goal-met">&#10003; This month&#39;s goal is fully covered</div>` : ''}
  `;

  // Animate bar fill after DOM paint
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const fill = document.getElementById('bar-fill');
      if (fill) fill.style.width = b.fillPct + '%';
    });
  });

  setTimeout(reportHeight, 600);
}

function renderError() {
  document.getElementById('widget').innerHTML =
    '<div class="bar-error">Unable to load donation data</div>';
}

async function load() {
  try {
    const res = await fetch(API);
    if (!res.ok) throw new Error('status ' + res.status);
    render(await res.json());
  } catch(e) {
    console.warn('Sihha widget error:', e);
    if (!lastData) renderError();
  }
}

function reportHeight() {
  window.parent.postMessage(
    { type: 'sihha-widget-height', height: document.documentElement.scrollHeight },
    '*'
  );
}

load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
