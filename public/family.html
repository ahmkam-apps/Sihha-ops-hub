<!DOCTYPE html>
<html lang="en" dir="ltr" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Deliveries — Sihha</title>
<meta name="theme-color" content="#111111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'AreaExtrabold';
    src: url('https://static.wixstatic.com/ufonts/2e5170_b7dd1a41ae7e481ca8d80cdf3858d08b/woff2/file.woff2') format('woff2');
    font-weight: 800; font-style: normal;
  }
  @font-face {
    font-family: 'AreaNormal';
    src: url('https://static.wixstatic.com/ufonts/2e5170_6263df7a2b874b8c9a621cc0eefc5ab8/woff2/file.woff2') format('woff2');
    font-weight: 400; font-style: normal;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #111111; --white: #ffffff;
    --gray-1: #f6f6f6; --gray-2: #e8e8e8; --gray-3: #cccccc;
    --gray-4: #888888; --gray-5: #444444;
    --green: #1a7a3c; --red: #b00;
    --amber-bg: #fff8e6; --amber-border: #f0c040; --amber-text: #7a4a00;
    --font-body: 'AreaNormal', 'Cairo', Helvetica, Arial, sans-serif;
    --font-head: 'AreaExtrabold', 'Cairo', Helvetica, Arial, sans-serif;
    --font-ar: 'Cairo', Arial, sans-serif;
  }

  [lang="ar"] { font-family: var(--font-ar); }
  body {
    font-family: var(--font-body);
    background: var(--gray-1);
    color: var(--black);
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--black);
    color: var(--white);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo {
    font-family: var(--font-head);
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--white);
    text-decoration: none;
  }
  .lang-toggle {
    background: none;
    border: 1px solid rgba(255,255,255,0.35);
    color: var(--white);
    padding: 5px 14px;
    font-size: 13px;
    cursor: pointer;
    font-family: var(--font-body);
    transition: border-color 0.15s;
  }
  .lang-toggle:hover { border-color: var(--white); }

  .container { max-width: 560px; margin: 0 auto; padding: 28px 16px 80px; }

  /* ── Login ── */
  .login-card {
    background: var(--white);
    border: 1px solid var(--gray-2);
    padding: 36px 32px;
    margin-top: 8px;
  }
  .login-card h1 {
    font-family: var(--font-head);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 8px;
  }
  .login-card p { font-size: 14px; color: var(--gray-4); margin-bottom: 28px; }
  .field-label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--gray-5);
    margin-bottom: 7px;
  }
  [lang="ar"] .field-label { text-transform: none; letter-spacing: 0; font-size: 13px; }
  input[type="tel"] {
    width: 100%;
    border: 1px solid var(--gray-2);
    padding: 13px 16px;
    font-family: var(--font-body);
    font-size: 17px;
    background: var(--white);
    outline: none;
    border-radius: 0;
    -webkit-appearance: none;
    transition: border-color 0.15s;
  }
  input[type="tel"]:focus { border-color: var(--black); }
  .btn-primary {
    display: block; width: 100%;
    background: var(--black); color: var(--white);
    border: none; padding: 14px 24px;
    font-family: var(--font-body);
    font-size: 14px; font-weight: 600;
    letter-spacing: 0.04em; cursor: pointer;
    margin-top: 16px; text-transform: uppercase;
    transition: background 0.15s;
  }
  [lang="ar"] .btn-primary { text-transform: none; letter-spacing: 0; font-size: 16px; font-family: var(--font-ar); }
  .btn-primary:hover { background: #333; }
  .btn-primary:disabled { background: var(--gray-3); cursor: not-allowed; }
  .error-msg { font-size: 13px; color: var(--red); margin-top: 12px; display: none; }
  .wa-link { display:inline-block; margin-top:6px; font-size:13px; color:var(--green); text-decoration:none; border-bottom:1px solid currentColor; }

  /* ── Dashboard ── */
  #dashboard { display: none; }
  .greeting {
    font-size: 13px; color: var(--gray-4);
    margin-bottom: 20px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .btn-logout {
    background: none; border: none;
    font-size: 12px; color: var(--gray-4); cursor: pointer;
    text-decoration: underline; font-family: var(--font-body);
  }
  .btn-logout:hover { color: var(--black); }

  /* ── Tabs ── */
  .tab-bar {
    display: flex;
    border-bottom: 2px solid var(--gray-2);
    margin-bottom: 24px;
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    padding: 12px 0;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--gray-4);
    cursor: pointer;
    text-transform: uppercase;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    transition: color 0.15s, border-color 0.15s;
  }
  [lang="ar"] .tab-btn { text-transform: none; letter-spacing: 0; font-size: 14px; font-family: var(--font-ar); }
  .tab-btn.active { color: var(--black); border-bottom-color: var(--black); }
  .tab-btn:hover:not(.active) { color: var(--gray-5); }

  /* ── Cycle card ── */
  .cycle-card {
    background: var(--white);
    border: 1px solid var(--gray-2);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .cycle-card-header {
    padding: 20px 20px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .cycle-card-meta { flex: 1; min-width: 0; }
  .cycle-card-label {
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--gray-4); margin-bottom: 4px;
  }
  [lang="ar"] .cycle-card-label { text-transform: none; letter-spacing: 0; font-size: 12px; }
  .cycle-card-title {
    font-family: var(--font-head);
    font-size: 17px; font-weight: 800;
    letter-spacing: -0.02em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  [lang="ar"] .cycle-card-title { font-family: var(--font-ar); font-weight: 700; letter-spacing: 0; }
  .cycle-card-dates { font-size: 13px; color: var(--gray-5); margin-top: 3px; }

  .status-badge {
    flex-shrink: 0;
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    padding: 4px 10px; white-space: nowrap;
  }
  [lang="ar"] .status-badge { text-transform: none; letter-spacing: 0; font-size: 11px; }
  .badge-open     { background: #e8f5ee; color: #155f30; }
  .badge-upcoming { background: var(--amber-bg); color: var(--amber-text); }
  .badge-shopping { background: #eef3ff; color: #3350aa; }
  .badge-confirmed { background: #e8f5ee; color: #155f30; }
  .badge-cancelled  { background: #fdecea; color: var(--red); }
  .badge-skipped   { background: var(--gray-1); color: var(--gray-4); }

  .cycle-card-body { padding: 0 20px 20px; }

  /* ── Place order form ── */
  .place-order-btn {
    width: 100%;
    background: var(--black); color: var(--white);
    border: none; padding: 13px 20px;
    font-family: var(--font-body);
    font-size: 14px; font-weight: 600;
    letter-spacing: 0.04em; cursor: pointer;
    text-transform: uppercase; margin-top: 4px;
    transition: background 0.15s; display: block;
  }
  [lang="ar"] .place-order-btn { text-transform: none; letter-spacing: 0; font-size: 15px; font-family: var(--font-ar); }
  .place-order-btn:hover { background: #333; }

  .order-form-panel {
    border-top: 1px solid var(--gray-2);
    padding: 16px 0 0;
    margin-top: 4px;
    display: none;
  }
  .order-form-panel.open { display: block; }
  .form-section-title {
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--gray-5); margin-bottom: 12px;
  }
  [lang="ar"] .form-section-title { text-transform: none; letter-spacing: 0; font-size: 13px; }

  .item-category {
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--gray-5);
    margin: 12px 0 4px; padding-bottom: 4px;
    border-bottom: 1px solid var(--gray-2);
  }
  [lang="ar"] .item-category { text-transform: none; letter-spacing: 0; font-size: 13px; }
  .item-row {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 0; border-bottom: 1px solid var(--gray-1);
    cursor: pointer;
  }
  .item-row:last-child { border-bottom: none; }
  .item-check {
    width: 20px; height: 20px;
    border: 2px solid var(--gray-3);
    border-radius: 4px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.12s; background: var(--white);
  }
  .item-row.selected .item-check { background: var(--green); border-color: var(--green); }
  .item-row.selected .item-check::after {
    content: '';
    width: 5px; height: 9px;
    border-right: 2px solid white; border-bottom: 2px solid white;
    transform: rotate(45deg) translate(-1px, -1px); display: block;
  }
  .item-name { flex: 1; font-size: 14px; }
  .item-qty {
    font-size: 12px; color: var(--gray-4);
    white-space: nowrap; background: var(--gray-1);
    padding: 2px 8px; border-radius: 10px;
  }

  /* ── Qty stepper ─────────────────────────────────────────── */
  .item-qty-ctrl {
    display: flex; align-items: center; gap: 6px;
  }
  .qty-btn {
    width: 28px; height: 28px;
    background: var(--gray-1); border: 1px solid var(--gray-2);
    border-radius: 6px; font-size: 16px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--dark); font-weight: 700; flex-shrink: 0;
    transition: background 0.1s;
  }
  .qty-btn:hover { background: var(--gray-2); }
  .qty-val {
    min-width: 24px; text-align: center;
    font-size: 15px; font-weight: 700; color: var(--dark);
  }
  .qty-unit { font-size: 11px; color: var(--gray-4); }

  /* ── Bundle bar ──────────────────────────────────────────── */
  .bundle-bar-wrap {
    margin: 10px 0 14px;
  }
  .bundle-bar-label {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--gray-5); margin-bottom: 6px;
  }
  .bundle-bar-track {
    width: 100%; height: 8px;
    background: var(--gray-2); border-radius: 4px; overflow: hidden;
  }
  .bundle-bar-fill {
    height: 100%; background: var(--green);
    border-radius: 4px; transition: width 0.3s ease;
  }

  .notes-label {
    display: block; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--gray-5); margin: 14px 0 6px;
  }
  [lang="ar"] .notes-label { text-transform: none; letter-spacing: 0; font-size: 13px; }
  textarea.order-notes {
    width: 100%; border: 1px solid var(--gray-2);
    padding: 10px 12px; font-family: var(--font-body);
    font-size: 13px; resize: vertical; outline: none;
    border-radius: 0; transition: border-color 0.15s;
  }
  textarea.order-notes:focus { border-color: var(--black); }

  .form-actions { display: flex; gap: 10px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
  .btn-confirm-order {
    background: var(--green); color: var(--white);
    border: none; padding: 12px 24px;
    font-family: var(--font-body); font-size: 14px; font-weight: 600;
    cursor: pointer; transition: background 0.15s;
  }
  [lang="ar"] .btn-confirm-order { font-family: var(--font-ar); font-size: 15px; }
  .btn-confirm-order:hover { background: #155f30; }
  .btn-confirm-order:disabled { background: var(--gray-3); cursor: not-allowed; }
  .btn-cancel-form {
    background: none; border: 1px solid var(--gray-3);
    color: var(--gray-5); padding: 12px 16px;
    font-family: var(--font-body); font-size: 13px; cursor: pointer;
    transition: border-color 0.15s;
  }
  .btn-cancel-form:hover { border-color: var(--black); color: var(--black); }
  .form-msg { font-size: 13px; display: none; }

  /* ── Confirmed order view ── */
  .confirmed-items {
    background: var(--gray-1);
    border: 1px solid var(--gray-2);
    padding: 12px 14px; margin-bottom: 14px;
  }
  .confirmed-items-label {
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--gray-4); margin-bottom: 8px;
  }
  [lang="ar"] .confirmed-items-label { text-transform: none; letter-spacing: 0; font-size: 12px; }
  .confirmed-item-cat { font-size: 11px; color: var(--gray-4); margin: 6px 0 2px; }
  .confirmed-item-list { font-size: 13px; color: var(--gray-5); display: flex; flex-wrap: wrap; gap: 4px; }
  .confirmed-item-chip {
    background: var(--white); border: 1px solid var(--gray-2);
    padding: 2px 10px; font-size: 12px;
  }

  .order-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .btn-request-change {
    background: var(--black); color: var(--white);
    border: none; padding: 9px 16px;
    font-family: var(--font-body); font-size: 13px; cursor: pointer;
    transition: background 0.15s;
  }
  [lang="ar"] .btn-request-change { font-family: var(--font-ar); font-size: 14px; }
  .btn-request-change:hover { background: #333; }
  .btn-cancel-order {
    background: none; border: none; color: var(--red);
    font-family: var(--font-body); font-size: 13px;
    cursor: pointer; text-decoration: underline; padding: 0;
  }

  /* Pending change request banner */
  .pending-cr-banner {
    background: var(--amber-bg); border: 1px solid var(--amber-border);
    padding: 12px 14px; margin-bottom: 12px;
  }
  .pending-cr-title { font-weight: 700; color: var(--amber-text); font-size: 13px; margin-bottom: 4px; }
  .pending-cr-notes { font-size: 12px; color: #666; margin-bottom: 8px; }
  .btn-retract {
    background: none; border: 1px solid #bbb; color: #666;
    padding: 4px 12px; font-size: 12px; cursor: pointer; font-family: var(--font-body);
    transition: border-color 0.15s;
  }
  .btn-retract:hover { border-color: var(--black); color: var(--black); }

  /* Change request form */
  .cr-form-panel {
    border-top: 1px solid var(--gray-2);
    padding: 14px 0 0; margin-top: 8px;
    display: none;
  }
  .cr-form-panel.open { display: block; }

  /* Event timeline */
  .events-toggle {
    font-size: 12px; color: var(--gray-4);
    background: none; border: none; cursor: pointer;
    font-family: var(--font-body); padding: 4px 0;
    text-decoration: underline;
  }
  .events-toggle:hover { color: var(--black); }
  .events-list {
    margin-top: 8px; display: none;
    border-top: 1px solid var(--gray-1); padding-top: 8px;
  }
  .events-list.open { display: block; }
  .event-row {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 4px 0; font-size: 12px;
    border-bottom: 1px solid var(--gray-1);
  }
  .event-row:last-child { border-bottom: none; }
  .event-label { color: #333; }
  .event-detail { color: #888; font-size: 11px; }
  .event-time { color: #bbb; white-space: nowrap; margin-left: 10px; font-size: 11px; }

  /* ── Change review result banner ── */
  .review-result {
    padding: 14px 16px;
    margin-bottom: 14px;
    border-left: 4px solid;
  }
  .review-result.approved {
    background: #e8f5ee;
    border-left-color: var(--green);
  }
  .review-result.rejected {
    background: var(--amber-bg);
    border-left-color: var(--amber-border);
  }
  .review-result-title {
    font-size: 13px; font-weight: 700; margin-bottom: 6px;
  }
  .review-result.approved .review-result-title { color: #155f30; }
  .review-result.rejected .review-result-title { color: var(--amber-text); }
  .review-result-detail { font-size: 12px; color: var(--gray-5); line-height: 1.7; }
  .review-result-chip {
    display: inline-block;
    padding: 1px 8px; font-size: 11px; margin: 2px 3px 2px 0;
    border-radius: 2px;
  }
  .chip-added   { background: #d4edda; color: #155f30; }
  .chip-removed { background: #fdecea; color: var(--red); text-decoration: line-through; }
  .chip-neutral { background: var(--gray-1); color: var(--gray-5); border: 1px solid var(--gray-2); }

  /* No-order states */
  .coming-soon-note {
    font-size: 13px; color: var(--gray-4); margin-top: 4px; padding: 4px 0 4px;
  }
  .locked-note {
    font-size: 13px; color: var(--gray-4); background: var(--gray-1);
    border: 1px solid var(--gray-2); padding: 10px 14px; margin-top: 4px;
  }

  /* No cycles placeholder */
  .no-cycles {
    background: var(--white); border: 1px solid var(--gray-2);
    padding: 36px 24px; text-align: center;
    color: var(--gray-4); font-size: 14px; line-height: 1.7;
  }

  /* ── History tab ── */
  .history-row {
    background: var(--white); border: 1px solid var(--gray-2);
    padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 1px;
  }
  .history-cycle { font-size: 14px; font-weight: 600; }
  .history-dates { font-size: 12px; color: var(--gray-4); margin-top: 2px; }
  .status-pill {
    font-size: 11px; padding: 3px 10px; font-weight: 600;
    letter-spacing: 0.03em; white-space: nowrap; flex-shrink: 0;
  }
  [lang="ar"] .status-pill { letter-spacing: 0; font-size: 12px; }
  .pill-delivered  { background: #e8f5ee; color: #155f30; }
  .pill-confirmed  { background: #e8f5ee; color: #155f30; }
  .pill-skipped    { background: var(--gray-1); color: var(--gray-4); }
  .pill-cancelled  { background: #fdecea; color: var(--red); }
  .no-history { font-size: 14px; color: var(--gray-4); text-align: center; padding: 32px 0; }
</style>
</head>
<body>

<header>
  <a class="logo" href="https://www.sihha.org">sihha</a>
  <button class="lang-toggle" onclick="toggleLang()" id="lang-btn">عربي</button>
</header>

<!-- ── Login redirect (no UI — handled by /login) ── -->
<div id="login-screen" style="display:none"></div>

<!-- ── Dashboard ── -->
<div id="dashboard">
  <div class="container">

    <div class="greeting">
      <span><span data-en="Welcome," data-ar="مرحباً،">Welcome,</span> <strong id="family-name-display"></strong></span>
      <button class="btn-logout" onclick="doLogout()" data-en="Sign out" data-ar="تسجيل الخروج">Sign out</button>
    </div>

    <div class="tab-bar">
      <button class="tab-btn active" id="tab-btn-deliveries" onclick="switchTab('deliveries')"
        data-en="MY DELIVERIES" data-ar="طلباتي">MY DELIVERIES</button>
      <button class="tab-btn" id="tab-btn-history" onclick="switchTab('history')"
        data-en="HISTORY" data-ar="السجل">HISTORY</button>
    </div>

    <div id="tab-deliveries">
      <div id="cycles-list"></div>
    </div>

    <div id="tab-history" style="display:none">
      <div id="history-list"></div>
    </div>

  </div>
</div>

<script>
// ── Language ───────────────────────────────────────────────────────────────────
let currentLang = 'en';
function toggleLang() {
  currentLang = currentLang === 'en' ? 'ar' : 'en';
  applyLang();
}
function applyLang() {
  const root = document.getElementById('html-root');
  root.lang = currentLang;
  root.dir  = currentLang === 'ar' ? 'rtl' : 'ltr';
  document.getElementById('lang-btn').textContent = currentLang === 'en' ? 'عربي' : 'EN';
  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = el.getAttribute('data-' + currentLang) || el.getAttribute('data-en');
  });
  const phoneInput = document.getElementById('phone-input');
  if (phoneInput) phoneInput.placeholder =
    currentLang === 'ar' ? 'مثال: 5551234567' : 'e.g. 5551234567';
  if (STATE.familyId) renderAll();
}

// ── State ──────────────────────────────────────────────────────────────────────
const STATE = {
  phone:    '',
  family:   null,
  familyId: null,
  bundleSize: null,
  cycles:   [],
  history:  [],
  activeTab: 'deliveries',
};

const BUNDLE_LABELS = {
  en: { S: 'Small bundle', M: 'Medium bundle', L: 'Large bundle' },
  ar: { S: 'طرد صغير',     M: 'طرد متوسط',    L: 'طرد كبير' }
};

const STATUS_LABELS_EN = {
  delivered: 'Delivered', confirmed: 'Confirmed', auto_confirmed: 'Confirmed',
  submitted: 'Confirmed', skipped: 'Skipped', cancelled: 'Cancelled',
  pending_confirmation: 'Pending', open: 'Open',
};

// ── Auth (session-based) ──────────────────────────────────────────────────────

// Admin preview: ?preview_token=<token> injects a short-lived family session
(function checkPreviewToken() {
  const params = new URLSearchParams(window.location.search);
  const pt = params.get('preview_token');
  if (pt) {
    localStorage.setItem('familyToken', pt);
    localStorage.setItem('familyUser', JSON.stringify({ preview: true }));
    // Remove token from URL bar (clean up)
    const clean = window.location.pathname;
    window.history.replaceState({}, '', clean);
  }
})();

let _familyToken = localStorage.getItem('familyToken');
let _familyUser  = JSON.parse(localStorage.getItem('familyUser') || 'null');

function _authHeader() {
  return _familyToken ? {'Authorization': 'Bearer ' + _familyToken} : {};
}

// Restore session from localStorage on page load
(function restoreSession() {
  if (_familyToken && _familyUser) {
    _loadAndShow();
  } else {
    // No session — redirect to login
    window.location.href = '/login';
  }
})();

async function _loadAndShow() {
  try {
    const res  = await fetch('/api/food-order/check', {
      headers: {'Content-Type': 'application/json', ..._authHeader()}
    });
    const data = await res.json();
    if (res.status === 401) {
      localStorage.removeItem('familyToken');
      localStorage.removeItem('familyUser');
      window.location.href = '/login';
      return;
    }
    if (res.status === 403 && data.error === 'account_pending') {
      // Family account exists but not yet approved by admin — show message, don't loop
      document.getElementById('app').style.display = 'none';
      document.getElementById('login-screen') && (document.getElementById('login-screen').style.display = 'none');
      document.body.innerHTML = `
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;background:#f8f8f8">
          <div style="max-width:360px;text-align:center;padding:40px 24px">
            <div style="font-size:40px;margin-bottom:16px">⏳</div>
            <h2 style="margin:0 0 12px;font-size:20px">Application Pending</h2>
            <p style="color:#666;line-height:1.6;margin:0 0 24px">${data.message || 'Your account is pending approval. Please contact SIHAA.'}</p>
            <a href="/login" style="color:#000;font-size:14px;text-decoration:underline">← Back to Login</a>
          </div>
        </div>`;
      return;
    }
    if (!data.registered) {
      window.location.href = '/login';
      return;
    }
    STATE.phone      = data.phone || '';
    STATE.family     = data.family_name;
    STATE.familyId   = data.family_id;
    STATE.bundleSize = data.bundle_size;
    STATE.cycles     = data.cycles  || [];
    STATE.history    = data.history || [];
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display    = 'block';
    renderAll();
  } catch(e) {
    window.location.href = '/login';
  }
}

async function doRequestOtp() {
  // Legacy stub — no longer used
  window.location.href = '/login';
  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  hideLoginError();
  try {
    const res  = await fetch('/api/otp/request', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({phone, type: 'family'})
    });
    const data = await res.json();
    if (!res.ok) {
      showLoginError(data.error || (currentLang === 'ar' ? 'حدث خطأ. حاول مجدداً.' : 'Something went wrong.'),
                     data.coordinator_wa);
      btn.disabled = false;
      return;
    }
    _otpPhone = phone;
    // Show PIN step
    document.getElementById('login-step-phone').style.display = 'none';
    document.getElementById('login-step-pin').style.display   = 'block';
    document.getElementById('pin-input').value = data.code || '';
    document.getElementById('pin-input').focus();
  } catch(e) {
    showLoginError(currentLang === 'ar' ? 'حدث خطأ. حاول مجدداً.' : 'Something went wrong. Please try again.');
    btn.disabled = false;
  }
}

async function doVerifyPin() {
  const code = document.getElementById('pin-input').value.trim().replace(/\D/g, '');
  if (code.length < 6) {
    showLoginError(currentLang === 'ar' ? 'أدخل الرمز المكون من 6 أرقام.' : 'Please enter the 6-digit code.');
    return;
  }
  const btn = document.getElementById('verify-btn');
  btn.disabled = true;
  hideLoginError();
  try {
    const res  = await fetch('/api/otp/verify', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({phone: _otpPhone, code, type: 'family'})
    });
    const data = await res.json();
    if (!res.ok) {
      showLoginError(data.error || (currentLang === 'ar' ? 'رمز غير صحيح أو منتهي.' : 'Invalid or expired code.'));
      btn.disabled = false;
      return;
    }
    // Verified — load family data
    localStorage.setItem('family_phone', _otpPhone);
    await _loadAndShow(_otpPhone);
    resetLoginToPhone();
  } catch(e) {
    showLoginError(currentLang === 'ar' ? 'حدث خطأ. حاول مجدداً.' : 'Something went wrong. Please try again.');
    btn.disabled = false;
  }
}

function resetLoginToPhone() {
  document.getElementById('login-step-phone').style.display = 'block';
  document.getElementById('login-step-pin').style.display   = 'none';
  document.getElementById('login-btn').disabled = false;
  document.getElementById('pin-input').value = '';
  hideLoginError();
}

function showLoginError(msg, waLink) {
  const errEl   = document.getElementById('login-error');
  const errText = document.getElementById('login-error-text');
  const waEl    = document.getElementById('wa-coordinator-link');
  errText.textContent = msg;
  if (waLink) { waEl.href = waLink; waEl.style.display = 'inline'; }
  else         { waEl.style.display = 'none'; }
  errEl.style.display = 'block';
}

function hideLoginError() {
  document.getElementById('login-error').style.display = 'none';
}

function doLogout() {
  STATE.familyId = null; STATE.family = null; STATE.cycles = []; STATE.history = [];
  localStorage.removeItem('familyToken');
  localStorage.removeItem('familyUser');
  localStorage.removeItem('family_phone'); // legacy cleanup
  _familyToken = null; _familyUser = null;
  window.location.href = '/login';
}

function closeFamilyPreview() {
  localStorage.removeItem('familyToken');
  localStorage.removeItem('familyUser');
  window.close(); // close the tab; fallback to admin page
  setTimeout(() => { window.location.href = '/'; }, 300);
}

// ── Deliveries tab ─────────────────────────────────────────────────────────────
function renderDeliveries() {
  const L = currentLang;
  const container = document.getElementById('cycles-list');
  if (!STATE.cycles.length) {
    container.innerHTML = `
      <div class="no-cycles">
        <div style="font-size:22px;margin-bottom:8px;">📦</div>
        <div>${L === 'ar' ? 'لا توجد تسليمات قادمة.' : 'No upcoming deliveries.'}</div>
        <div style="font-size:13px;margin-top:6px;color:var(--gray-4)">${L === 'ar' ? 'تحقق مجدداً قريباً.' : 'Check back soon.'}</div>
      </div>`;
    return;
  }

  // Active orders (confirmed / pending / submitted) — shown first
  const withOrder  = STATE.cycles.filter(c => c.order && !['cancelled','skipped'].includes(c.order.status));
  // Cancelled/skipped in the current window — still browsable but below
  const terminal   = STATE.cycles.filter(c => c.order && ['cancelled','skipped'].includes(c.order.status));
  // Everything without an order
  const noOrder    = STATE.cycles.filter(c => !c.order);

  const sectionLabel = (text) =>
    `<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gray-4);margin:18px 0 8px;">${text}</div>`;

  let html = '';

  if (withOrder.length) {
    html += sectionLabel(L === 'ar' ? 'طلبك الحالي' : 'Your Order');
    html += withOrder.map(c => renderCycleCard(c)).join('');
  }

  if (noOrder.length) {
    html += sectionLabel(L === 'ar' ? 'تسليمات قادمة' : 'Upcoming Deliveries');
    html += noOrder.map(c => renderCycleCard(c)).join('');
  }

  if (terminal.length) {
    html += sectionLabel(L === 'ar' ? 'دورات سابقة' : 'Previous');
    html += terminal.map(c => renderCycleCard(c)).join('');
  }

  container.innerHTML = html;
}

function fmtDate(s) {
  if (!s) return '';
  const [y, m, d] = s.split('-');
  const months = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const monthsAr = ['','يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const mi = parseInt(m);
  return currentLang === 'ar'
    ? `${parseInt(d)} ${monthsAr[mi]} ${y}`
    : `${months[mi]} ${parseInt(d)}, ${y}`;
}

function renderCycleCard(cycle) {
  const L   = currentLang;
  const ord = cycle.order;

  // Status badge
  let badgeClass = 'badge-open', badgeText = '';
  if (ord) {
    const s = ord.status;
    if (['confirmed','auto_confirmed','submitted','pending_confirmation'].includes(s)) {
      badgeClass = 'badge-confirmed'; badgeText = L === 'ar' ? '✓ مؤكد' : '✓ Confirmed';
    } else if (s === 'cancelled') {
      badgeClass = 'badge-cancelled'; badgeText = L === 'ar' ? 'ملغي' : 'Cancelled';
    } else if (s === 'skipped') {
      badgeClass = 'badge-skipped'; badgeText = L === 'ar' ? 'تم التخطي' : 'Skipped';
    } else {
      badgeClass = 'badge-confirmed'; badgeText = s;
    }
  } else if (cycle.status === 'open') {
    badgeClass = 'badge-open'; badgeText = L === 'ar' ? 'مفتوح' : 'Open';
  } else if (cycle.status === 'shopping') {
    badgeClass = 'badge-shopping'; badgeText = L === 'ar' ? 'جارٍ التسوق' : 'Shopping';
  } else {
    badgeClass = 'badge-upcoming'; badgeText = L === 'ar' ? 'قادم' : 'Upcoming';
  }

  const dateStr = `${fmtDate(cycle.delivery_date_start)} – ${fmtDate(cycle.delivery_date_end)}`;

  let bodyHtml = '';

  if (ord) {
    bodyHtml = renderOrderBody(cycle.id, ord);
  } else if (cycle.can_place_order) {
    bodyHtml = renderPlaceOrderBody(cycle);
  } else if (cycle.status === 'shopping') {
    bodyHtml = `<div class="locked-note">${L === 'ar' ? '🛒 التسوق جارٍ الآن — لا يمكن قبول طلبات جديدة.' : '🛒 Shopping is in progress — orders are locked.'}</div>`;
  } else {
    bodyHtml = `<div class="coming-soon-note">${L === 'ar' ? 'سيفتح باب الطلبات قريباً.' : 'Ordering opens closer to the delivery date.'}</div>`;
  }

  return `
    <div class="cycle-card" id="card-${escHtml(cycle.id)}">
      <div class="cycle-card-header">
        <div class="cycle-card-meta">
          <div class="cycle-card-label">${L === 'ar' ? 'تسليم' : 'Delivery'}</div>
          <div class="cycle-card-title">${escHtml(cycle.title)}</div>
          <div class="cycle-card-dates">${escHtml(dateStr)}</div>
        </div>
        <span class="status-badge ${badgeClass}">${escHtml(badgeText)}</span>
      </div>
      <div class="cycle-card-body">${bodyHtml}</div>
    </div>`;
}

// ── Place-order body (open cycle, no order) ────────────────────────────────────
function renderPlaceOrderBody(cycle) {
  const L      = currentLang;
  const cid    = cycle.id;
  const bLbl   = BUNDLE_LABELS[L][STATE.bundleSize] || STATE.bundleSize || 'M';
  const budget = cycle.bundle_budget || 0;

  const itemsHtml = cycle.items_for_selection.map(cat => `
    <div class="item-category">${escHtml(cat.category)}</div>
    ${cat.items.map(item => {
      const isDefault  = item.is_default ? true : false;
      const groupId    = item.group_id   || '';
      const groupMax   = item.group_max  || 1;
      const isFreeText = item.is_free_text ? true : false;
      const selClass   = isDefault ? 'selected' : '';

      if (item.allow_qty) {
        // +/- stepper for adjustable-quantity items
        return `
          <div class="item-row ${selClass}" data-cid="${escHtml(cid)}" data-id="${escHtml(item.id)}"
               data-price="${item.price || 0}" data-allow-qty="1"
               data-group="${escHtml(groupId)}" data-group-max="${groupMax}"
               onclick="toggleItem(this,'${escHtml(cid)}')">
            <div class="item-check"></div>
            <div class="item-name">${escHtml(item.name)}</div>
            <div class="item-qty-ctrl" onclick="event.stopPropagation()">
              <button class="qty-btn" onclick="changeQty('${escHtml(cid)}','${escHtml(item.id)}',-1)">−</button>
              <span class="qty-val" id="qty-${escHtml(cid)}-${escHtml(item.id)}">${item.default_qty || (isDefault ? 1 : 0)}</span>
              <button class="qty-btn" onclick="changeQty('${escHtml(cid)}','${escHtml(item.id)}',1)">+</button>
              <span class="qty-unit">${escHtml(item.unit || '')}</span>
            </div>
          </div>`;
      } else if (isFreeText) {
        // Free-text item: checkbox + text input (visible only when checked)
        return `
          <div class="item-row ${selClass}" data-cid="${escHtml(cid)}" data-id="${escHtml(item.id)}"
               data-price="${item.price || 0}" data-allow-qty="0"
               data-group="${escHtml(groupId)}" data-group-max="${groupMax}"
               data-is-free-text="1" onclick="toggleItem(this,'${escHtml(cid)}')">
            <div class="item-check"></div>
            <div class="item-name">${escHtml(item.name)}</div>
          </div>
          <div class="free-text-wrap" id="ft-wrap-${escHtml(cid)}-${escHtml(item.id)}" style="display:${isDefault ? 'block' : 'none'};padding:4px 0 8px 32px;">
            <input type="text" class="free-text-input" id="ft-${escHtml(cid)}-${escHtml(item.id)}"
              placeholder="${L === 'ar' ? 'اكتب نوع الفاكهة هنا…' : 'Type the fruit you want…'}"
              style="width:100%;border:1px solid var(--gray-2);padding:8px 10px;font-size:14px;font-family:var(--font-body);"
              onclick="event.stopPropagation()">
          </div>`;
      } else {
        // Simple checkbox row
        return `
          <div class="item-row ${selClass}" data-cid="${escHtml(cid)}" data-id="${escHtml(item.id)}"
               data-price="${item.price || 0}" data-allow-qty="0"
               data-group="${escHtml(groupId)}" data-group-max="${groupMax}"
               onclick="toggleItem(this,'${escHtml(cid)}')">
            <div class="item-check"></div>
            <div class="item-name">${escHtml(item.name)}</div>
            <div class="item-qty">${escHtml(item.unit || '')}</div>
          </div>`;
      }
    }).join('')}
  `).join('');

  // Bundle bar (shown only when budget > 0)
  const bundleBarHtml = budget > 0 ? `
    <div class="bundle-bar-wrap" id="bundle-bar-wrap-${escHtml(cid)}">
      <div class="bundle-bar-label">
        <span>${L === 'ar' ? 'طردك' : 'Your bundle'}</span>
        <span class="bundle-bar-limit-msg" id="bundle-limit-msg-${escHtml(cid)}" style="display:none;color:#b00">
          ${L === 'ar' ? 'وصلت إلى حد طردك' : 'You\'ve reached your bundle limit'}
        </span>
      </div>
      <div class="bundle-bar-track">
        <div class="bundle-bar-fill" id="bundle-bar-fill-${escHtml(cid)}" style="width:0%"></div>
      </div>
    </div>` : '';

  return `
    <div style="font-size:13px;color:var(--gray-4);margin-bottom:12px;">
      ${L === 'ar' ? `حجم طردك: <strong>${escHtml(bLbl)}</strong>` : `Bundle: <strong>${escHtml(bLbl)}</strong>`}
    </div>
    <button class="place-order-btn" onclick="toggleOrderForm('${escHtml(cid)}')">
      ${L === 'ar' ? '+ الطلب لهذا التسليم' : '+ Order for this delivery'}
    </button>
    <div class="order-form-panel" id="form-${escHtml(cid)}">
      <div class="form-section-title">${L === 'ar' ? 'اختر ما تحتاجه' : 'Select what you need'}</div>
      ${bundleBarHtml}
      <div id="items-${escHtml(cid)}">${itemsHtml}</div>
      <label class="notes-label" for="notes-${escHtml(cid)}">${L === 'ar' ? 'طلبات خاصة أو ملاحظات (اختياري)' : 'Special requests or notes (optional)'}</label>
      <textarea class="order-notes" id="notes-${escHtml(cid)}" rows="3"
        placeholder="${L === 'ar' ? 'مثال: لا نحتاج أرزاً هذه الدورة، نحتاج حفاضات مقاس 3، حساسية من البيض...' : 'e.g. Please no rice this time, need baby formula, allergic to eggs, prefer whole wheat bread — we\'ll do our best!'}"></textarea>
      <div class="form-actions">
        <button class="btn-confirm-order" onclick="placeOrder('${escHtml(cid)}')" id="place-btn-${escHtml(cid)}">
          ${L === 'ar' ? 'تأكيد الطلب' : 'Confirm Order'}
        </button>
        <button class="btn-cancel-form" onclick="toggleOrderForm('${escHtml(cid)}')">
          ${L === 'ar' ? 'إلغاء' : 'Cancel'}
        </button>
        <span class="form-msg" id="place-msg-${escHtml(cid)}"></span>
      </div>
    </div>`;
}

function toggleOrderForm(cid) {
  const panel = document.getElementById(`form-${cid}`);
  if (panel) {
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) _updateBundleBar(cid);
  }
}

function _getBudget(cid) {
  const cycle = STATE.cycles.find(c => c.id === cid);
  return cycle ? (cycle.bundle_budget || 0) : 0;
}

function _calcTotal(cid) {
  let total = 0;
  document.querySelectorAll(`#items-${cid} .item-row`).forEach(row => {
    if (!row.classList.contains('selected')) return;
    const price = parseFloat(row.dataset.price || 0);
    const allowQty = row.dataset.allowQty === '1';
    const qty = allowQty
      ? parseInt(document.getElementById(`qty-${cid}-${row.dataset.id}`)?.textContent || 1)
      : 1;
    total += price * qty;
  });
  return total;
}

function _updateBundleBar(cid) {
  const budget = _getBudget(cid);
  if (!budget) return;
  const total  = _calcTotal(cid);
  const pct    = Math.min(100, Math.round(total / budget * 100));
  const fill   = document.getElementById(`bundle-bar-fill-${cid}`);
  const msg    = document.getElementById(`bundle-limit-msg-${cid}`);
  if (fill) fill.style.width = pct + '%';
  // Only HIDE the message here — it is shown exclusively when an add is blocked
  if (msg && pct < 100) msg.style.display = 'none';
}

function toggleItem(row, cid) {
  const isSelecting = !row.classList.contains('selected');
  const budget = _getBudget(cid);

  if (isSelecting && budget > 0) {
    // Budget check
    const price = parseFloat(row.dataset.price || 0);
    if (_calcTotal(cid) + price > budget) {
      const msg = document.getElementById(`bundle-limit-msg-${cid}`);
      if (msg) { msg.style.display = 'inline'; setTimeout(() => { if (_calcTotal(cid) < budget) msg.style.display='none'; }, 2500); }
      return;
    }
  }

  // Mutual exclusion: if this item belongs to a group, deselect others in that group
  const groupId = row.dataset.group;
  if (isSelecting && groupId) {
    document.querySelectorAll(`#items-${cid} .item-row[data-group="${groupId}"]`).forEach(other => {
      if (other !== row && other.classList.contains('selected')) {
        other.classList.remove('selected');
        // Hide free-text input for deselected item
        const otherId = other.dataset.id;
        const otherWrap = document.getElementById(`ft-wrap-${cid}-${otherId}`);
        if (otherWrap) otherWrap.style.display = 'none';
      }
    });
  }

  row.classList.toggle('selected');

  // Show/hide free-text input for this item
  if (row.dataset.isFreeText === '1') {
    const wrap = document.getElementById(`ft-wrap-${cid}-${row.dataset.id}`);
    if (wrap) {
      wrap.style.display = row.classList.contains('selected') ? 'block' : 'none';
      if (row.classList.contains('selected')) {
        const inp = document.getElementById(`ft-${cid}-${row.dataset.id}`);
        if (inp) inp.focus();
      }
    }
  }

  _updateBundleBar(cid);
}

function changeQty(cid, itemId, delta) {
  const el     = document.getElementById(`qty-${cid}-${itemId}`);
  if (!el) return;
  const cur    = parseInt(el.textContent) || 0;
  const newQty = Math.max(0, cur + delta);
  const budget = _getBudget(cid);
  const row    = document.querySelector(`#items-${cid} .item-row[data-id="${itemId}"]`);

  // Check budget when increasing
  if (delta > 0 && budget > 0) {
    const price      = parseFloat(row?.dataset.price || 0);
    const currentTotal = _calcTotal(cid);
    const diff       = price * (newQty - cur);
    if (currentTotal + diff > budget) {
      const msg = document.getElementById(`bundle-limit-msg-${cid}`);
      if (msg) { msg.style.display = 'inline'; setTimeout(() => { if (_calcTotal(cid) < budget) msg.style.display='none'; }, 2500); }
      return;
    }
  }

  if (newQty === 0) {
    // Deselect the row when qty hits 0
    el.textContent = 0;
    if (row) row.classList.remove('selected');
  } else {
    el.textContent = newQty;
    if (row) row.classList.add('selected');
  }
  _updateBundleBar(cid);
}

// ── Confirmed order body ───────────────────────────────────────────────────────
function renderOrderBody(cid, ord) {
  const L = currentLang;
  const isTerminal = ['cancelled','skipped'].includes(ord.status);

  // ── Items summary ──
  let itemsHtml = '';
  const cats = ord.selected_categories && ord.selected_categories.length
    ? ord.selected_categories
    : ord.bundle_categories || [];

  if (cats.length && !isTerminal) {
    itemsHtml = `
      <div class="confirmed-items">
        <div class="confirmed-items-label">${L === 'ar' ? 'محتويات طردك' : "What's in your bundle"}</div>
        ${cats.map(cat => `
          <div class="confirmed-item-cat">${escHtml(cat.category)}</div>
          <div class="confirmed-item-list">
            ${cat.items.map(i => `<span class="confirmed-item-chip">${escHtml(i.name)}${i.quantity ? ` · ${escHtml(i.quantity)} ${escHtml(i.unit||'')}` : ''}</span>`).join('')}
          </div>`).join('')}
      </div>`;
  } else if (isTerminal) {
    let msg, msgStyle;
    if (ord.status === 'cancelled') {
      const cancelEvent = (ord.events || []).slice().reverse().find(ev => ev.event_type === 'cancelled');
      const byAdmin = cancelEvent && cancelEvent.actor === 'admin';
      if (byAdmin) {
        msg = L === 'ar'
          ? 'تم إلغاء هذا الطلب من قِبل الفريق. يمكنك تقديم طلب جديد لهذه الدورة.'
          : 'This order was cancelled by our team. You\'re welcome to place a new order for this delivery.';
        msgStyle = 'color:var(--amber-border);background:var(--amber-bg);padding:12px 14px;border-radius:8px;border-left:3px solid var(--amber-border);font-size:13px;';
      } else {
        msg = L === 'ar' ? 'لقد ألغيت هذا الطلب.' : 'You cancelled this order.';
        msgStyle = 'color:var(--gray-4)';
      }
    } else {
      msg = L === 'ar' ? 'تم تخطي هذه الدورة.' : 'You skipped this cycle.';
      msgStyle = 'color:var(--gray-4)';
    }
    itemsHtml = `<div class="locked-note" style="${msgStyle}">${msg}</div>`;
  }

  // ── Change review result banner ──
  // Find the most recent approval or rejection event and surface it prominently.
  const reviewEvents = (ord.events || []).filter(
    ev => ev.event_type === 'change_approved' || ev.event_type === 'change_rejected'
  );
  const lastReview = reviewEvents.length ? reviewEvents[reviewEvents.length - 1] : null;
  let reviewBannerHtml = '';
  if (lastReview && !ord.pending_change_request) {
    const pl = lastReview.payload || {};
    const reviewDate = lastReview.created_at
      ? new Date(lastReview.created_at + (lastReview.created_at.endsWith('Z') ? '' : 'Z'))
          .toLocaleDateString(L === 'ar' ? 'ar-SA' : 'en-US', {month:'short', day:'numeric', year:'numeric'})
      : '';

    if (lastReview.event_type === 'change_approved') {
      const added   = pl.added   || [];
      const removed = pl.removed || [];
      const note    = pl.admin_notes || '';

      let changeDetail = '';
      if (added.length || removed.length) {
        changeDetail += `<div style="margin-top:6px;">`;
        if (removed.length) {
          changeDetail += `<div style="margin-bottom:4px;">${L === 'ar' ? 'أُزيل:' : 'Removed:'} `;
          changeDetail += removed.map(n => `<span class="review-result-chip chip-removed">${escHtml(n)}</span>`).join('');
          changeDetail += '</div>';
        }
        if (added.length) {
          changeDetail += `<div>${L === 'ar' ? 'أُضيف:' : 'Added:'} `;
          changeDetail += added.map(n => `<span class="review-result-chip chip-added">${escHtml(n)}</span>`).join('');
          changeDetail += '</div>';
        }
        changeDetail += '</div>';
      } else if (pl.items_after && pl.items_after.length) {
        // No diff but we have the final list — show it
        changeDetail = `<div style="margin-top:6px;font-size:12px;color:var(--gray-5)">
          ${pl.items_after.map(n => `<span class="review-result-chip chip-neutral">${escHtml(n)}</span>`).join('')}
        </div>`;
      }

      reviewBannerHtml = `
        <div class="review-result approved">
          <div class="review-result-title">✓ ${L === 'ar' ? 'تم قبول طلب التعديل' : 'Your change request was approved'} · ${escHtml(reviewDate)}</div>
          <div class="review-result-detail">
            ${changeDetail}
            ${note ? `<div style="margin-top:6px;font-style:italic;">${L === 'ar' ? 'ملاحظة المنسق:' : 'Coordinator note:'} ${escHtml(note)}</div>` : ''}
          </div>
        </div>`;
    } else {
      // rejected
      const note = pl.admin_notes || '';
      reviewBannerHtml = `
        <div class="review-result rejected">
          <div class="review-result-title">${L === 'ar' ? 'لم يتم قبول طلب التعديل' : 'Change request was not approved'} · ${escHtml(reviewDate)}</div>
          ${note ? `<div class="review-result-detail" style="margin-top:4px;font-style:italic;">${L === 'ar' ? 'ملاحظة المنسق:' : 'Coordinator note:'} ${escHtml(note)}</div>` : ''}
        </div>`;
    }
  }

  // ── Volunteer assignment strip ──
  let volHtml = '';
  if (!isTerminal && ord.volunteers && Object.keys(ord.volunteers).length > 0) {
    const vols = ord.volunteers;
    const slots = [];
    if (vols.shopping) {
      const icon = vols.shopping.confirmed ? '✓' : '⏳';
      const label = L === 'ar' ? 'المتسوق' : 'Shopper';
      const statusNote = vols.shopping.confirmed
        ? (L === 'ar' ? 'مؤكد' : 'confirmed')
        : (L === 'ar' ? 'في الانتظار' : 'pending your order');
      slots.push(`<span style="font-size:12px;color:var(--gray-5)">${icon} <strong>${label}:</strong> ${escHtml(vols.shopping.name)} <span style="color:var(--gray-4)">(${statusNote})</span></span>`);
    }
    if (vols.delivery) {
      const icon = vols.delivery.confirmed ? '✓' : '⏳';
      const label = L === 'ar' ? 'المندوب' : 'Delivery';
      const statusNote = vols.delivery.confirmed
        ? (L === 'ar' ? 'مؤكد' : 'confirmed')
        : (L === 'ar' ? 'في الانتظار' : 'pending your order');
      slots.push(`<span style="font-size:12px;color:var(--gray-5)">${icon} <strong>${label}:</strong> ${escHtml(vols.delivery.name)} <span style="color:var(--gray-4)">(${statusNote})</span></span>`);
    }
    if (slots.length) {
      volHtml = `<div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px;padding:10px 14px;background:#f7f7f7;border-radius:6px;border-left:3px solid var(--gray-2)">${slots.join('')}</div>`;
    }
  }

  // ── Actions ──
  let actionsHtml = '';
  if (!isTerminal) {
    let changeBtn = '', cancelBtn = '';
    if (ord.can_request_change && !ord.pending_change_request) {
      changeBtn = `<button class="btn-request-change" onclick="showCRForm('${escHtml(cid)}')">${L === 'ar' ? 'طلب تعديل' : 'Request Change'}</button>`;
    }
    if (ord.can_cancel) {
      cancelBtn = `<button class="btn-cancel-order" onclick="cancelOrder('${escHtml(cid)}','${escHtml(ord.id)}')">${L === 'ar' ? 'إلغاء الطلب' : 'Cancel this order'}</button>`;
    }
    if (changeBtn || cancelBtn) {
      actionsHtml = `<div class="order-actions">${changeBtn}${cancelBtn}</div>`;
    }
  }

  // ── Pending change request banner ──
  let pendingCRHtml = '';
  if (ord.pending_change_request) {
    const notes = ord.pending_change_request.family_notes
      ? `"${escHtml(ord.pending_change_request.family_notes)}"`
      : (L === 'ar' ? 'لا توجد ملاحظات' : 'No notes added');
    pendingCRHtml = `
      <div class="pending-cr-banner" id="cr-banner-${escHtml(cid)}">
        <div class="pending-cr-title">${L === 'ar' ? '⏳ طلب تعديل قيد المراجعة' : '⏳ Change Request Pending'}</div>
        <div class="pending-cr-notes">${notes}</div>
        <button class="btn-retract" onclick="retractRequest('${escHtml(cid)}','${escHtml(ord.pending_change_request.id)}','${escHtml(ord.id)}')">${L === 'ar' ? 'سحب الطلب' : 'Retract request'}</button>
      </div>`;
  }

  // ── Change request form ──
  const crFormHtml = renderCRForm(cid, ord);

  // ── Event timeline ── auto-expand if there's change history
  const hasChangeHistory = (ord.events || []).some(ev =>
    ['change_requested','change_approved','change_rejected','change_retracted'].includes(ev.event_type)
  );
  const eventsHtml = renderEventsSection(cid, ord.events || [], hasChangeHistory);

  // ── Special requests / family notes ──
  let notesHtml = '';
  if (ord.family_notes && !isTerminal) {
    notesHtml = `
      <div style="margin-bottom:12px;padding:10px 14px;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:6px;font-size:13px;">
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--amber-text);font-weight:700;margin-bottom:4px;">
          ${L === 'ar' ? 'ملاحظاتك' : 'Your notes'}
        </div>
        <div style="color:var(--amber-text);">${escHtml(ord.family_notes)}</div>
      </div>`;
  }

  return itemsHtml + reviewBannerHtml + notesHtml + volHtml + actionsHtml + pendingCRHtml + crFormHtml + eventsHtml;
}

// ── Change request form ────────────────────────────────────────────────────────
function renderCRForm(cid, ord) {
  const L = currentLang;
  if (!ord.can_request_change && !ord.pending_change_request) return '';

  const cats = ord.bundle_categories || [];
  const selectedNames = new Set();
  (ord.selected_categories || []).forEach(c => c.items.forEach(i => selectedNames.add(i.name)));
  const defaultAll = !ord.selected_categories || !ord.selected_categories.length;

  const itemsHtml = cats.map(cat => `
    <div class="item-category">${escHtml(cat.category)}</div>
    ${cat.items.map(item => {
      const checked = defaultAll || selectedNames.has(item.name);
      return `<label style="display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer;border-bottom:1px solid #f5f5f5;">
        <input type="checkbox" data-item-id="${escHtml(item.id)}" ${checked ? 'checked' : ''}
          style="width:16px;height:16px;cursor:pointer;accent-color:#111;">
        <span style="flex:1;font-size:14px;">${escHtml(item.name)}</span>
        <span style="font-size:12px;color:#888;">${escHtml(item.quantity||'')} ${escHtml(item.unit||'')}</span>
      </label>`;
    }).join('')}
  `).join('');

  return `
    <div class="cr-form-panel" id="cr-form-${escHtml(cid)}">
      <div class="form-section-title">${L === 'ar' ? 'طلب تعديل — اختر ما تحتاجه' : 'Request Change — select what you need'}</div>
      <div id="cr-items-${escHtml(cid)}">${itemsHtml}</div>
      <label class="notes-label" for="cr-notes-${escHtml(cid)}">${L === 'ar' ? 'ملاحظات (اختياري)' : 'Notes (optional)'}</label>
      <textarea class="order-notes" id="cr-notes-${escHtml(cid)}" rows="2"
        placeholder="${L === 'ar' ? 'مثال: لا نحتاج بيض هذه الدورة' : 'e.g. We don\'t need eggs this cycle'}"></textarea>
      <div class="form-actions">
        <button class="btn-confirm-order" onclick="submitCR('${escHtml(cid)}','${escHtml(ord.id)}')" id="cr-btn-${escHtml(cid)}">
          ${L === 'ar' ? 'إرسال الطلب' : 'Submit Request'}
        </button>
        <button class="btn-cancel-form" onclick="hideCRForm('${escHtml(cid)}')">
          ${L === 'ar' ? 'إلغاء' : 'Cancel'}
        </button>
        <span class="form-msg" id="cr-msg-${escHtml(cid)}"></span>
      </div>
    </div>`;
}

function showCRForm(cid) {
  const panel = document.getElementById(`cr-form-${cid}`);
  if (panel) panel.classList.add('open');
}
function hideCRForm(cid) {
  const panel = document.getElementById(`cr-form-${cid}`);
  if (panel) panel.classList.remove('open');
}

// ── Events section ─────────────────────────────────────────────────────────────
function renderEventsSection(cid, events, autoExpand) {
  const L = currentLang;
  if (!events.length) return '';
  const filtered = events.filter(ev => !(ev.payload && ev.payload.note && ev.payload.note.includes('backfilled')));
  if (!filtered.length) return '';

  const rowsHtml = filtered.map(ev => {
    const label = EVENT_LABELS[ev.event_type]?.[L === 'ar' ? 'ar' : 'en'] || ev.event_type;
    const ts    = ev.created_at
      ? new Date(ev.created_at + (ev.created_at.endsWith('Z') ? '' : 'Z'))
          .toLocaleDateString(L === 'ar' ? 'ar-SA' : 'en-US', {month:'short', day:'numeric', year:'numeric'})
      : '';
    const pl = ev.payload || {};

    // Build rich per-event detail
    let detailLines = [];

    if (ev.event_type === 'change_requested') {
      if (pl.notes) detailLines.push(`${L === 'ar' ? 'ملاحظة:' : 'Note:'} "${escHtml(pl.notes)}"`);
      if (pl.requested_items?.length) {
        detailLines.push(`${L === 'ar' ? 'العناصر المطلوبة:' : 'Requested:'} ${pl.requested_items.map(n => escHtml(n)).join(', ')}`);
      }
    } else if (ev.event_type === 'change_approved') {
      if (pl.removed?.length) detailLines.push(`${L === 'ar' ? 'أُزيل:' : 'Removed:'} ${pl.removed.map(n => escHtml(n)).join(', ')}`);
      if (pl.added?.length)   detailLines.push(`${L === 'ar' ? 'أُضيف:' : 'Added:'} ${pl.added.map(n => escHtml(n)).join(', ')}`);
      if (!pl.added?.length && !pl.removed?.length && pl.items_after?.length) {
        detailLines.push(`${L === 'ar' ? 'العناصر:' : 'Items:'} ${pl.items_after.map(n => escHtml(n)).join(', ')}`);
      }
      if (pl.admin_notes) detailLines.push(`${L === 'ar' ? 'ملاحظة المنسق:' : 'Note:'} "${escHtml(pl.admin_notes)}"`);
    } else if (ev.event_type === 'change_rejected') {
      if (pl.admin_notes) detailLines.push(`${L === 'ar' ? 'ملاحظة المنسق:' : 'Note:'} "${escHtml(pl.admin_notes)}"`);
    } else if (ev.event_type === 'items_edited') {
      if (pl.removed?.length) detailLines.push(`${L === 'ar' ? 'أُزيل:' : 'Removed:'} ${pl.removed.map(n => escHtml(n)).join(', ')}`);
      if (pl.added?.length)   detailLines.push(`${L === 'ar' ? 'أُضيف:' : 'Added:'} ${pl.added.map(n => escHtml(n)).join(', ')}`);
    } else if (ev.event_type === 'confirmed' && pl.notes) {
      detailLines.push(`${L === 'ar' ? 'ملاحظة:' : 'Note:'} "${escHtml(pl.notes)}"`);
    }

    const detailHtml = detailLines.length
      ? `<div class="event-detail" style="margin-top:2px;">${detailLines.join(' · ')}</div>`
      : '';

    return `<div class="event-row" style="align-items:flex-start;flex-direction:column;gap:1px;padding:6px 0;">
      <div style="display:flex;justify-content:space-between;width:100%;align-items:baseline;">
        <span class="event-label">${escHtml(label)}</span>
        <span class="event-time">${escHtml(ts)}</span>
      </div>
      ${detailHtml}
    </div>`;
  }).join('');

  const expandClass = autoExpand ? ' open' : '';
  const toggleLabel = L === 'ar' ? 'سجل الطلب' : 'Order activity';

  return `
    <div style="margin-top:10px;border-top:1px solid var(--gray-2);padding-top:10px;">
      <button class="events-toggle" onclick="toggleEvents('${escHtml(cid)}')">
        ${escHtml(toggleLabel)} (${filtered.length})
      </button>
      <div class="events-list${expandClass}" id="events-${escHtml(cid)}">${rowsHtml}</div>
    </div>`;
}

function toggleEvents(cid) {
  const el = document.getElementById(`events-${cid}`);
  if (el) el.classList.toggle('open');
}

// ── History tab ────────────────────────────────────────────────────────────────
function renderHistory() {
  const L    = currentLang;
  const list = document.getElementById('history-list');
  const hist = STATE.history || [];

  if (!hist.length) {
    list.innerHTML = `<div class="no-history">${L === 'ar' ? 'لا توجد طلبات سابقة بعد.' : 'No delivery history yet.'}</div>`;
    return;
  }

  const pillClass = s => {
    if (s === 'delivered') return 'pill-delivered';
    if (['confirmed','auto_confirmed','submitted'].includes(s)) return 'pill-confirmed';
    if (s === 'skipped')   return 'pill-skipped';
    if (s === 'cancelled') return 'pill-cancelled';
    return 'pill-confirmed';
  };
  const pillLabel = s => {
    const labels = L === 'ar' ? STATUS_LABELS_AR : STATUS_LABELS_EN;
    return labels[s] || s;
  };

  list.innerHTML = hist.map(row => `
    <div class="history-row">
      <div>
        <div class="history-cycle">${escHtml(row.cycle_title || '')}</div>
        <div class="history-dates">${escHtml(fmtDate(row.delivery_date_start))} – ${escHtml(fmtDate(row.delivery_date_end || ''))}</div>
      </div>
      <span class="status-pill ${pillClass(row.status)}">${escHtml(pillLabel(row.status))}</span>
    </div>`
  ).join('');
}

// ── Place order ────────────────────────────────────────────────────────────────
async function placeOrder(cid) {
  const L    = currentLang;
  const btn  = document.getElementById(`place-btn-${cid}`);
  const msg  = document.getElementById(`place-msg-${cid}`);
  const notes = (document.getElementById(`notes-${cid}`)?.value || '').trim();

  const selectedRows = Array.from(
    document.querySelectorAll(`#items-${cid} .item-row.selected`)
  );
  const selectedIds = selectedRows.map(r => r.dataset.id);

  // Collect quantities for allow_qty items
  const item_quantities = {};
  selectedRows.forEach(r => {
    if (r.dataset.allowQty === '1') {
      const qtyEl = document.getElementById(`qty-${cid}-${r.dataset.id}`);
      item_quantities[r.dataset.id] = parseInt(qtyEl?.textContent || 1);
    }
  });

  // Collect custom values for free-text items
  const item_custom_values = {};
  selectedRows.forEach(r => {
    if (r.dataset.isFreeText === '1') {
      const inp = document.getElementById(`ft-${cid}-${r.dataset.id}`);
      if (inp && inp.value.trim()) {
        item_custom_values[r.dataset.id] = inp.value.trim();
      }
    }
  });

  btn.disabled    = true;
  btn.textContent = L === 'ar' ? 'جارٍ الإرسال…' : 'Placing order…';
  msg.style.display = 'none';

  // Find cycle
  const cycle = STATE.cycles.find(c => c.id === cid);
  if (!cycle) { btn.disabled = false; return; }

  try {
    const res  = await fetch('/api/food-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ..._authHeader() },
      body: JSON.stringify({
        family_id: STATE.familyId,
        cycle_id:  cid,
        selected_items: selectedIds,
        item_quantities,
        item_custom_values,
        notes,
      })
    });
    const data = await res.json();
    if (!res.ok) {
      msg.textContent   = data.error || (L === 'ar' ? 'حدث خطأ.' : 'Something went wrong.');
      msg.style.color   = 'var(--red)';
      msg.style.display = 'inline';
      btn.disabled      = false;
      btn.textContent   = L === 'ar' ? 'تأكيد الطلب' : 'Confirm Order';
      return;
    }
    // Refresh full state
    await refreshState();
  } catch(e) {
    msg.textContent   = L === 'ar' ? 'حدث خطأ. حاول مجدداً.' : 'Something went wrong. Please try again.';
    msg.style.color   = 'var(--red)';
    msg.style.display = 'inline';
    btn.disabled      = false;
    btn.textContent   = L === 'ar' ? 'تأكيد الطلب' : 'Confirm Order';
  }
}

// ── Cancel order ───────────────────────────────────────────────────────────────
async function cancelOrder(cid, requestId) {
  const L = currentLang;
  if (!confirm(L === 'ar'
    ? 'هل تريد إلغاء طلبك؟ لن يتم تسليم أي طرد في هذه الدورة.'
    : 'Cancel your order? You will not receive a bundle this cycle.')) return;
  try {
    const res  = await fetch('/api/food-order/cancel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ..._authHeader() },
      body: JSON.stringify({ family_id: STATE.familyId, request_id: requestId })
    });
    const data = await res.json();
    if (!res.ok) { alert(data.error || 'Something went wrong.'); return; }
    await refreshState();
  } catch(e) {
    alert(L === 'ar' ? 'حدث خطأ. حاول مجدداً.' : 'Something went wrong. Please try again.');
  }
}

// ── Change request ─────────────────────────────────────────────────────────────
async function submitCR(cid, requestId) {
  const L    = currentLang;
  const btn  = document.getElementById(`cr-btn-${cid}`);
  const msg  = document.getElementById(`cr-msg-${cid}`);
  const notes = (document.getElementById(`cr-notes-${cid}`)?.value || '').trim();
  const selectedIds = Array.from(
    document.querySelectorAll(`#cr-items-${cid} input[type=checkbox]:checked`)
  ).map(cb => cb.dataset.itemId);

  btn.disabled      = true;
  btn.textContent   = L === 'ar' ? 'جارٍ الإرسال…' : 'Sending…';
  msg.style.display = 'none';
  try {
    const res  = await fetch('/api/family-request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ..._authHeader() },
      body: JSON.stringify({
        family_id: STATE.familyId,
        request_id: requestId,
        family_notes: notes,
        selected_item_ids: selectedIds,
      })
    });
    const data = await res.json();
    if (!res.ok) {
      msg.textContent   = data.error || (L === 'ar' ? 'حدث خطأ.' : 'Something went wrong.');
      msg.style.color   = 'var(--red)';
      msg.style.display = 'inline';
      btn.disabled      = false;
      btn.textContent   = L === 'ar' ? 'إرسال الطلب' : 'Submit Request';
      return;
    }
    await refreshState();
  } catch(e) {
    msg.textContent   = L === 'ar' ? 'حدث خطأ. حاول مجدداً.' : 'Something went wrong. Please try again.';
    msg.style.color   = 'var(--red)';
    msg.style.display = 'inline';
    btn.disabled      = false;
    btn.textContent   = L === 'ar' ? 'إرسال الطلب' : 'Submit Request';
  }
}

async function retractRequest(cid, crId, requestId) {
  const L = currentLang;
  if (!confirm(L === 'ar' ? 'هل تريد سحب طلب التعديل؟' : 'Retract this change request?')) return;
  try {
    const res  = await fetch(`/api/family-request/${crId}/retract`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ..._authHeader() },
      body: JSON.stringify({ family_id: STATE.familyId })
    });
    const data = await res.json();
    if (!res.ok) { alert(data.error || 'Something went wrong.'); return; }
    await refreshState();
  } catch(e) {
    alert(L === 'ar' ? 'حدث خطأ. حاول مجدداً.' : 'Something went wrong. Please try again.');
  }
}

// ── Refresh ────────────────────────────────────────────────────────────────────
async function refreshState() {
  try {
    const res  = await fetch('/api/food-order/check', {
      headers: {'Content-Type': 'application/json', ..._authHeader()}
    });
    if (res.status === 401) { doLogout(); return; }
    const data = await res.json();
    if (data.registered) {
      STATE.cycles  = data.cycles  || [];
      STATE.history = data.history || [];
      renderAll();
    }
  } catch(e) { /* silent */ }
}

// ── Helpers ────────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
