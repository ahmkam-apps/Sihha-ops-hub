<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sihha — Donation Stats</title>
<style>
  @font-face {
    font-family: 'AreaExtrabold';
    src: url('https://static.wixstatic.com/ufonts/2e5170_b7dd1a41ae7e481ca8d80cdf3858d08b/woff2/file.woff2') format('woff2');
    font-weight: 800;
  }
  @font-face {
    font-family: 'AreaNormal';
    src: url('https://static.wixstatic.com/ufonts/2e5170_6263df7a2b874b8c9a621cc0eefc5ab8/woff2/file.woff2') format('woff2');
    font-weight: 400;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: 'AreaNormal', Helvetica, Arial, sans-serif;
    background: transparent;
    color: #111;
    font-size: 14px;
    line-height: 1.5;
  }

  .widget { max-width: 560px; }

  /* ── Total raised ── */
  .total-block {
    margin-bottom: 28px;
  }
  .total-label {
    font-size: 12px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 4px;
  }
  .total-amount {
    font-family: 'AreaExtrabold', Helvetica, Arial, sans-serif;
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
    color: #111;
  }

  /* ── Progress bar ── */
  .progress-block {
    margin-bottom: 28px;
  }
  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .progress-raised {
    font-family: 'AreaNormal', Helvetica, Arial, sans-serif;
    font-size: 15px;
    color: #111;
  }
  .progress-goal {
    font-size: 14px;
    color: #888;
  }
  .progress-track {
    width: 100%;
    height: 8px;
    background: #e0e0e0;
  }
  .progress-fill {
    height: 100%;
    background: #111;
    transition: width 1s ease;
    max-width: 100%;
  }

  /* ── Two-stat row ── */
  .stat-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: #e8e8e8;
    margin-bottom: 1px;
  }
  .stat-cell {
    background: #f6f6f6;
    padding: 18px 16px;
  }
  .stat-num {
    font-family: 'AreaExtrabold', Helvetica, Arial, sans-serif;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    color: #111;
  }
  .stat-lbl {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #888;
    margin-top: 4px;
  }

  /* ── CTA strip ── */
  .cta-strip {
    background: #111;
    color: #fff;
    padding: 18px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 0;
  }
  .cta-message {
    font-family: 'AreaExtrabold', Helvetica, Arial, sans-serif;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }
  .cta-message span {
    font-size: 22px;
    display: block;
    letter-spacing: -0.03em;
  }
  .cta-btn {
    flex-shrink: 0;
    background: #fff;
    color: #111;
    text-decoration: none;
    font-family: 'AreaNormal', Helvetica, Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px 20px;
    white-space: nowrap;
  }
  .cta-btn:hover { background: #e8e8e8; }
</style>
</head>
<body>
<div class="widget">

  <!-- Total raised all-time -->
  <div class="total-block">
    <div class="total-label">Total raised</div>
    <div class="total-amount" id="total-raised">—</div>
  </div>

  <!-- This month progress -->
  <div class="progress-block">
    <div class="progress-row">
      <span class="progress-raised" id="month-raised">—</span>
      <span class="progress-goal">$1,000 monthly goal</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="prog-fill" style="width:0%"></div>
    </div>
  </div>

  <!-- Donors this month + avg gift -->
  <div class="stat-row">
    <div class="stat-cell">
      <div class="stat-num" id="donors-month">—</div>
      <div class="stat-lbl">Donors this month</div>
    </div>
    <div class="stat-cell">
      <div class="stat-num" id="avg-gift">—</div>
      <div class="stat-lbl">Average gift</div>
    </div>
  </div>

  <!-- X donors needed CTA -->
  <div class="cta-strip">
    <div class="cta-message">
      <span id="donors-needed">—</span>
      more donors needed to hit this month's goal
    </div>
  </div>

</div>

<script>
  const API  = 'https://sihha-ops-hub-production.up.railway.app/api/donate-stats';
  const GOAL = 1000;

  const fmt = n => '$' + parseFloat(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });

  async function load() {
    try {
      const r = await fetch(API);
      const d = await r.json();

      // Total raised all-time
      document.getElementById('total-raised').textContent = fmt(d.total_raised || 0);

      // This month progress
      const monthRaised = d.month_raised || 0;
      const pct = Math.min(100, (monthRaised / GOAL) * 100);
      document.getElementById('month-raised').textContent = fmt(monthRaised) + ' raised this month';
      document.getElementById('prog-fill').style.width = pct + '%';

      // Donors this month + avg gift
      const dm = (d.donations_by_month || []);
      const thisMonth = new Date().toISOString().slice(0, 7);
      const currentMonth = dm.find(m => m.month === thisMonth);
      const donorsThisMonth = currentMonth ? currentMonth.donors : 0;
      document.getElementById('donors-month').textContent = donorsThisMonth;
      document.getElementById('avg-gift').textContent = d.proj_avg_gift ? fmt(d.proj_avg_gift) : '—';

      // Donors needed to hit goal
      const gap = Math.max(0, GOAL - monthRaised);
      const avgGift = d.proj_avg_gift || 0;
      const needed = avgGift > 0 ? Math.ceil(gap / avgGift) : '—';
      const ctaEl = document.getElementById('donors-needed');
      if (gap <= 0) {
        ctaEl.textContent = '🎉 Goal reached!';
        ctaEl.closest('.cta-strip').querySelector('.cta-message').innerHTML =
          '<span>Goal reached!</span>Thank you — keep the momentum going';
      } else {
        ctaEl.textContent = needed;
      }
    } catch(e) {
      console.error('Failed to load donation stats', e);
    }
  }

  load();
</script>
</body>
</html>
