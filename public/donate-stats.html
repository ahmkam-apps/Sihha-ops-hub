<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sihha — Donation Stats</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  @font-face {
    font-family: 'AreaExtrabold';
    src: url('https://static.wixstatic.com/ufonts/2e5170_b7dd1a41ae7e481ca8d80cdf3858d08b/woff2/file.woff2') format('woff2');
    font-weight: 800;
  }
  @font-face {
    font-family: 'AreaNormal';
    src: url('https://static.wixstatic.com/ufonts/2e5170_6263df7a2b874b8c9a621cc0eefc5ab8/woff2/file.woff2') format('woff2');
    font-weight: 400;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: 'AreaNormal', Helvetica, Arial, sans-serif;
    background: transparent;
    color: #111;
    font-size: 14px;
    line-height: 1.5;
  }

  .widget { max-width: 560px; }

  /* ── Total raised ── */
  .total-block { margin-bottom: 28px; }
  .total-label {
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 4px;
  }
  .total-amount {
    font-family: 'AreaExtrabold', Helvetica, Arial, sans-serif;
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
  }

  /* ── Progress bar ── */
  .progress-block { margin-bottom: 28px; }
  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .progress-raised { font-size: 15px; color: #111; }
  .progress-goal   { font-size: 13px; color: #888; }
  .progress-track  { width: 100%; height: 8px; background: #e0e0e0; }
  .progress-fill   { height: 100%; background: #111; transition: width 1s ease; max-width: 100%; }

  /* ── Stat grid ── */
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: #e8e8e8;
    margin-bottom: 24px;
  }
  .stat-cell {
    background: #f6f6f6;
    padding: 16px;
  }
  .stat-cell.dark { background: #111; color: #fff; }
  .stat-num {
    font-family: 'AreaExtrabold', Helvetica, Arial, sans-serif;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .stat-lbl {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #888;
    margin-top: 4px;
  }
  .stat-cell.dark .stat-lbl { color: #aaa; }

  /* ── Chart ── */
  .chart-block { margin-bottom: 0; }
  .chart-label {
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
  }
  .chart-legend {
    display: flex;
    gap: 16px;
    font-size: 11px;
    color: #888;
    margin-bottom: 10px;
  }
  .chart-legend span { display: flex; align-items: center; gap: 6px; }
  .leg-line {
    display: inline-block;
    width: 16px;
    height: 2px;
    background: #111;
  }
  .leg-dash {
    display: inline-block;
    width: 16px;
    height: 0;
    border-top: 2px dashed #999;
  }
  .chart-wrap { position: relative; height: 200px; }
</style>
</head>
<body>
<div class="widget">

  <!-- Total raised -->
  <div class="total-block">
    <div class="total-label">Total raised all-time</div>
    <div class="total-amount" id="total-raised">—</div>
  </div>

  <!-- Monthly progress bar -->
  <div class="progress-block">
    <div class="progress-row">
      <span class="progress-raised" id="month-raised">—</span>
      <span class="progress-goal">$1,000 monthly goal</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="prog-fill" style="width:0%"></div>
    </div>
  </div>

  <!-- Stats: donors / avg gift / gap / donors needed -->
  <div class="stat-grid">
    <div class="stat-cell">
      <div class="stat-num" id="donors-month">—</div>
      <div class="stat-lbl">Donors this month</div>
    </div>
    <div class="stat-cell">
      <div class="stat-num" id="avg-gift">—</div>
      <div class="stat-lbl">Average gift</div>
    </div>
    <div class="stat-cell">
      <div class="stat-num" id="monthly-gap">—</div>
      <div class="stat-lbl">Monthly gap</div>
    </div>
    <div class="stat-cell dark">
      <div class="stat-num" id="donors-needed">—</div>
      <div class="stat-lbl">Donors needed</div>
    </div>
  </div>

  <!-- Projection chart -->
  <div class="chart-block">
    <div class="chart-label">Monthly donations &amp; projection</div>
    <div class="chart-legend">
      <span><i class="leg-line"></i> Actual</span>
      <span><i class="leg-dash"></i> Projected</span>
    </div>
    <div class="chart-wrap">
      <canvas id="don-chart"></canvas>
    </div>
  </div>

</div>

<script>
  const API  = 'https://sihha-ops-hub-production.up.railway.app/api/donate-stats';
  const GOAL = 1000;

  const fmt      = n => '$' + Math.round(n).toLocaleString();
  const fmtShort = n => n >= 1000 ? '$' + (n / 1000).toFixed(1) + 'k' : '$' + Math.round(n);
  const monthLbl = m => new Date(m + '-15').toLocaleString('default', { month: 'short' });

  async function load() {
    try {
      const r = await fetch(API);
      const d = await r.json();

      // Total raised
      document.getElementById('total-raised').textContent = fmt(d.total_raised || 0);

      // Monthly progress
      const monthRaised = d.month_raised || 0;
      const pct = Math.min(100, (monthRaised / GOAL) * 100);
      document.getElementById('month-raised').textContent = fmt(monthRaised) + ' raised this month';
      document.getElementById('prog-fill').style.width = pct + '%';

      // Donors this month
      const dm = d.donations_by_month || [];
      const thisMonth = new Date().toISOString().slice(0, 7);
      const currentMonth = dm.find(m => m.month === thisMonth);
      document.getElementById('donors-month').textContent = currentMonth ? currentMonth.donors : 0;

      // Avg gift
      document.getElementById('avg-gift').textContent = d.proj_avg_gift ? fmt(d.proj_avg_gift) : '—';

      // Monthly gap
      const gap = Math.max(0, GOAL - monthRaised);
      document.getElementById('monthly-gap').textContent = fmt(gap);

      // Donors needed
      const avgGift = d.proj_avg_gift || 0;
      const needed  = avgGift > 0 ? Math.ceil(gap / avgGift) : '—';
      document.getElementById('donors-needed').textContent = gap <= 0 ? '✓ Done' : needed;

      // Chart
      const active = dm.filter(m => m.total > 0);
      if (!active.length) return;

      const lastTotal      = active[active.length - 1].total;
      const monthlyTrend   = d.proj_monthly_trend || 0;
      const histLabels     = active.map(m => monthLbl(m.month));
      const projN          = 3;
      const projLabels     = Array.from({ length: projN }, (_, i) => {
        const base = new Date(active[active.length - 1].month + '-15');
        base.setMonth(base.getMonth() + i + 1);
        return base.toLocaleString('default', { month: 'short' });
      });

      const actualFull = [...active.map(m => m.total), ...Array(projN).fill(null)];
      const projData   = Array(histLabels.length).fill(null);
      projData[histLabels.length - 1] = lastTotal;
      for (let i = 0; i < projN; i++) {
        projData.push(Math.max(0, Math.round(lastTotal + monthlyTrend * (i + 1))));
      }

      const goalPlugin = {
        id: 'goalLine',
        afterDraw({ ctx, chartArea: { left, right, top, bottom }, scales: { y } }) {
          const yPos = y.getPixelForValue(GOAL);
          if (yPos < top || yPos > bottom) return;
          ctx.save();
          ctx.strokeStyle = '#bbb';
          ctx.lineWidth   = 1;
          ctx.setLineDash([5, 4]);
          ctx.beginPath(); ctx.moveTo(left, yPos); ctx.lineTo(right, yPos); ctx.stroke();
          ctx.fillStyle = '#999';
          ctx.font      = '10px Helvetica';
          ctx.textAlign = 'right';
          ctx.fillText('$1k goal', right - 4, yPos - 4);
          ctx.restore();
        }
      };

      new Chart(document.getElementById('don-chart'), {
        type: 'line',
        plugins: [goalPlugin],
        data: {
          labels: [...histLabels, ...projLabels],
          datasets: [
            {
              label: 'Actual',
              data: actualFull,
              borderColor: '#111',
              backgroundColor: 'rgba(17,17,17,0.05)',
              borderWidth: 2,
              pointRadius: 3,
              pointBackgroundColor: '#111',
              tension: 0.3,
              fill: true,
              spanGaps: false,
            },
            {
              label: 'Projected',
              data: projData,
              borderColor: '#999',
              borderWidth: 1.5,
              borderDash: [5, 4],
              pointRadius: 2,
              pointBackgroundColor: '#999',
              tension: 0.3,
              fill: false,
              spanGaps: false,
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#111',
              titleColor: '#fff',
              bodyColor: '#ccc',
              callbacks: { label: ctx => ' ' + ctx.dataset.label + ': ' + fmt(ctx.parsed.y) }
            }
          },
          scales: {
            x: { grid: { color: '#f0f0f0' }, ticks: { font: { size: 11 }, color: '#888' } },
            y: {
              beginAtZero: true,
              grid: { color: '#f0f0f0' },
              ticks: { font: { size: 11 }, color: '#888', callback: v => fmtShort(v) }
            }
          }
        }
      });

    } catch(e) {
      console.error('Failed to load donation stats', e);
    }
  }

  load();
</script>
</body>
</html>
