<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sihha — Community Stats</title>
<style>
  @font-face { font-family:'AreaExtrabold'; src:url('https://static.wixstatic.com/ufonts/2e5170_b7dd1a41ae7e481ca8d80cdf3858d08b/woff2/file.woff2') format('woff2'); }
  @font-face { font-family:'AreaNormal'; src:url('https://static.wixstatic.com/ufonts/2e5170_6263df7a2b874b8c9a621cc0eefc5ab8/woff2/file.woff2') format('woff2'); }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html, body {
    font-family:'AreaNormal',Helvetica,Arial,sans-serif;
    background:#111111;
    color:#ffffff;
    font-size:14px;
    line-height:1.4;
  }
  #widget { padding:16px 16px 14px; width:100%; }
  .stat-box {
    flex-shrink:0;
    background:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .stat-num {
    font-family:'AreaExtrabold',Helvetica,Arial,sans-serif;
    font-weight:800;
    color:#111111;
    line-height:1;
  }
  .stat-label {
    font-family:'AreaExtrabold',Helvetica,Arial,sans-serif;
    font-weight:800;
    color:#ffffff;
    line-height:1.2;
  }
  .divider { border:none; border-top:1px solid rgba(255,255,255,0.08); margin:14px 0; }
  .bar-track { width:100%; background:rgba(255,255,255,0.1); overflow:hidden; }
  .w-footer  { font-size:9px; color:rgba(255,255,255,0.2); text-align:right; margin-top:10px; letter-spacing:0.4px; }
</style>
</head>
<body>
<div id="widget"></div>
<script>
const API = '/api/donate-stats';
let lastData = null, lastMode = null;

function isMobile() { return window.innerWidth < 600; }

function countUp(el, target, duration) {
  const steps = 60, interval = duration / steps, inc = target / steps;
  let cur = 0;
  const timer = setInterval(() => {
    cur = Math.min(cur + inc, target);
    el.textContent = Math.round(cur).toLocaleString('en-US');
    if (cur >= target) clearInterval(timer);
  }, interval);
}

function calcDelivery(d) {
  if (!d.next_delivery_date) return null;
  const nd      = new Date(d.next_delivery_date + 'T00:00:00');
  const fmtDate = nd.toLocaleDateString('en-US', { month:'short', day:'numeric' });
  const days    = d.days_to_delivery;
  const pct     = d.cycle_pct != null ? d.cycle_pct : 0;
  const cs      = new Date(nd); cs.setDate(cs.getDate() - 30);
  const startLbl = cs.toLocaleDateString('en-US', { month:'short', day:'numeric' });
  const daysLbl  = days === 0 ? 'Today' : days < 0 ? 'Delivered' : days === 1 ? '1 day away' : days + ' days away';
  const title    = (d.next_cycle_title || '') + ' · Next Delivery';
  return { fmtDate, daysLbl, pct, startLbl, title };
}

function renderDesktop(d) {
  const del = calcDelivery(d);
  document.getElementById('widget').innerHTML = `
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div style="display:flex;align-items:center;gap:20px;">
        <div class="stat-box" style="width:64px;height:64px;">
          <div class="stat-num" style="font-size:26px;" id="d-lives">—</div>
        </div>
        <div class="stat-label" style="font-size:22px;">Lives Impacted</div>
      </div>
      <div style="display:flex;align-items:center;gap:20px;">
        <div class="stat-box" style="width:64px;height:64px;">
          <div class="stat-num" style="font-size:26px;">${(d.volunteers_active || 0).toLocaleString('en-US')}</div>
        </div>
        <div class="stat-label" style="font-size:22px;">Volunteers Mobilized</div>
      </div>
      ${del ? `
      <hr class="divider">
      <div>
        <div style="display:flex;justify-content:space-between;align-items:flex-start;">
          <div>
            <div style="font-family:'AreaExtrabold',sans-serif;font-size:22px;font-weight:800;color:#fff;">${del.fmtDate}</div>
            <div style="font-size:12px;color:rgba(255,255,255,0.45);margin-top:4px;">${del.title}</div>
          </div>
          <div style="font-size:12px;color:rgba(255,255,255,0.45);padding-top:4px;">${del.daysLbl}</div>
        </div>
        <div class="bar-track" style="height:4px;margin-top:8px;">
          <div style="height:4px;background:#27ae60;width:${del.pct}%;transition:width 1.2s ease;"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:4px;">
          <div style="font-size:10px;color:rgba(255,255,255,0.3);">Cycle started ${del.startLbl}</div>
          <div style="font-size:10px;color:rgba(255,255,255,0.3);">${del.pct}% through</div>
        </div>
      </div>` : ''}
    </div>
    <div class="w-footer">Updated every 5 min · Sihha</div>`;
  if (d.lives_impacted != null)
    countUp(document.getElementById('d-lives'), d.lives_impacted, 1800);
}

function renderMobile(d) {
  const del = calcDelivery(d);
  document.getElementById('widget').innerHTML = `
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div style="display:flex;align-items:center;gap:14px;">
        <div class="stat-box" style="width:52px;height:52px;">
          <div class="stat-num" style="font-size:20px;" id="m-lives">—</div>
        </div>
        <div class="stat-label" style="font-size:18px;">Lives Impacted</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        <div class="stat-box" style="width:52px;height:52px;">
          <div class="stat-num" style="font-size:20px;">${(d.volunteers_active || 0).toLocaleString('en-US')}</div>
        </div>
        <div class="stat-label" style="font-size:18px;">Volunteers Mobilized</div>
      </div>
      ${del ? `
      <hr class="divider">
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-family:'AreaExtrabold',sans-serif;font-size:18px;font-weight:800;color:#fff;">${del.fmtDate}</div>
            <div style="font-size:10px;color:rgba(255,255,255,0.35);margin-top:2px;">Next Delivery</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:12px;color:rgba(255,255,255,0.5);">${del.daysLbl}</div>
            <div style="font-size:10px;color:rgba(255,255,255,0.3);margin-top:2px;">${d.next_cycle_title || ''}</div>
          </div>
        </div>
        <div class="bar-track" style="height:3px;margin-top:8px;">
          <div style="height:3px;background:#27ae60;width:${del.pct}%;transition:width 1.2s ease;"></div>
        </div>
      </div>` : ''}
    </div>
    <div class="w-footer">Updated every 5 min · Sihha</div>`;
  if (d.lives_impacted != null)
    countUp(document.getElementById('m-lives'), d.lives_impacted, 1800);
}

function render(d) {
  lastData = d;
  lastMode = isMobile() ? 'mobile' : 'desktop';
  isMobile() ? renderMobile(d) : renderDesktop(d);
  setTimeout(reportHeight, 900);
}

async function load() {
  try { const res = await fetch(API); render(await res.json()); }
  catch(e) { console.warn('Widget error', e); }
}

function reportHeight() {
  window.parent.postMessage({ type:'sihha-widget-height', height:document.documentElement.scrollHeight }, '*');
}

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const m = isMobile() ? 'mobile' : 'desktop';
    if (m !== lastMode && lastData) render(lastData);
  }, 200);
});

load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
