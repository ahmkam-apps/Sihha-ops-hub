<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIHAA — Impact</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  @font-face {
    font-family: 'AreaExtrabold';
    src: url('https://static.wixstatic.com/ufonts/2e5170_b7dd1a41ae7e481ca8d80cdf3858d08b/woff2/file.woff2') format('woff2');
    font-weight: 800;
  }
  @font-face {
    font-family: 'AreaNormal';
    src: url('https://static.wixstatic.com/ufonts/2e5170_6263df7a2b874b8c9a621cc0eefc5ab8/woff2/file.woff2') format('woff2');
    font-weight: 400;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: 'AreaNormal', Helvetica, Arial, sans-serif;
    background: #fff;
    color: #111;
    font-size: 14px;
    line-height: 1.4;
    min-height: 100vh;
  }

  .widget {
    padding: 28px 32px 24px;
    max-width: 1100px;
    margin: 0 auto;
  }

  /* ── Top stat row ─────────────────────────────────── */
  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr 2fr;
    gap: 2px;
    margin-bottom: 2px;
  }

  .stat-block {
    background: #f7f7f7;
    padding: 20px 22px;
  }

  .stat-label {
    font-size: 10px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: #aaa;
    margin-bottom: 8px;
    font-weight: 700;
  }

  .stat-value {
    font-family: 'AreaExtrabold', Helvetica, Arial, sans-serif;
    font-size: 38px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
    color: #111;
  }

  .stat-sub {
    font-size: 12px;
    color: #aaa;
    margin-top: 6px;
  }

  .countdown-unit {
    font-size: 13px;
    color: #aaa;
    margin-left: 4px;
    font-family: 'AreaNormal', Helvetica, Arial, sans-serif;
    font-weight: 400;
  }

  /* ── Progress bar block ──────────────────────────── */
  .progress-block {
    background: #f7f7f7;
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }

  .progress-collected {
    font-family: 'AreaExtrabold', Helvetica, Arial, sans-serif;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: #111;
  }

  .progress-goal-label {
    font-size: 12px;
    color: #aaa;
  }

  .progress-track {
    width: 100%;
    height: 6px;
    background: #e0e0e0;
    overflow: hidden;
    border-radius: 2px;
    display: flex;
  }

  /* Red = collected toward goal */
  .progress-red {
    height: 6px;
    background: #c0392b;
    border-radius: 2px 0 0 2px;
    transition: width 1.2s cubic-bezier(0.4,0,0.2,1);
    flex-shrink: 0;
  }

  /* Green = surplus beyond goal */
  .progress-green {
    height: 6px;
    background: #27ae60;
    border-radius: 0 2px 2px 0;
    transition: width 1.2s cubic-bezier(0.4,0,0.2,1);
    flex-shrink: 0;
  }

  .progress-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
  }

  .progress-pct {
    font-size: 11px;
    color: #aaa;
  }

  .surplus-note {
    font-size: 11px;
    color: #27ae60;
    font-weight: 700;
  }

  /* Goal-met banner */
  .goal-met-banner {
    background: #f0faf4;
    border: 1px solid #27ae60;
    border-radius: 2px;
    padding: 8px 12px;
    font-size: 12px;
    color: #27ae60;
    font-weight: 700;
    text-align: center;
    margin-top: 10px;
  }

  /* ── Chart row ───────────────────────────────────── */
  .chart-block {
    background: #f7f7f7;
    padding: 18px 22px 14px;
    margin-top: 2px;
  }

  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .chart-title {
    font-size: 10px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: #bbb;
    font-weight: 700;
  }

  .chart-legend {
    display: flex;
    gap: 16px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: #bbb;
  }

  canvas { display: block; }

  /* ── Footer ──────────────────────────────────────── */
  .widget-footer {
    margin-top: 10px;
    font-size: 10px;
    color: #ddd;
    text-align: right;
    letter-spacing: 0.5px;
  }

  /* ── Responsive ──────────────────────────────────── */
  @media (max-width: 680px) {
    .widget { padding: 18px 16px 16px; }
    .stats-row { grid-template-columns: 1fr 1fr; }
    .progress-block { grid-column: 1 / -1; }
    .stat-value { font-size: 30px; }
    .progress-collected { font-size: 22px; }
  }

  @media (max-width: 420px) {
    .stats-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="widget">

  <div class="stats-row">
    <!-- Families -->
    <div class="stat-block">
      <div class="stat-label">Families Served</div>
      <div class="stat-value" id="families-count">—</div>
      <div class="stat-sub" id="lives-sub"></div>
    </div>

    <!-- Countdown -->
    <div class="stat-block">
      <div class="stat-label">Next Delivery</div>
      <div>
        <span class="stat-value" id="days-value">—</span>
        <span class="countdown-unit" id="days-unit"></span>
      </div>
      <div class="stat-sub" id="delivery-date-sub"></div>
    </div>

    <!-- Monthly fundraising progress -->
    <div class="stat-block progress-block">
      <div class="stat-label" id="month-label">This Month</div>
      <div class="progress-top">
        <div class="progress-collected" id="month-collected">—</div>
        <div class="progress-goal-label" id="goal-label">of — goal</div>
      </div>
      <div class="progress-track">
        <div class="progress-red"   id="bar-red"   style="width:0%;"></div>
        <div class="progress-green" id="bar-green" style="width:0%;"></div>
      </div>
      <div class="progress-bottom">
        <div class="progress-pct"  id="progress-pct"></div>
        <div class="surplus-note"  id="surplus-note"></div>
      </div>
      <div class="goal-met-banner" id="goal-met-banner" style="display:none;">
        ✓ This month's goal is fully covered by last month's surplus
      </div>
    </div>
  </div>

  <!-- Trend chart -->
  <div class="chart-block">
    <div class="chart-header">
      <div class="chart-title">Donation Trend &amp; Projection</div>
      <div class="chart-legend">
        <div class="legend-item">
          <div style="width:14px;height:2px;background:#111;"></div>Actual
        </div>
        <div class="legend-item">
          <div style="width:14px;border-top:2px dashed #bbb;"></div>Projected
        </div>
        <div class="legend-item">
          <div style="width:14px;height:2px;background:#c0392b;opacity:0.5;"></div>Goal
        </div>
      </div>
    </div>
    <canvas id="trend-chart" height="90"></canvas>
  </div>

  <div class="widget-footer">Updated every 5 min · SIHAA</div>
</div>

<script>
const API = '/api/donate-stats';
let chart = null;

function fmt(n) {
  if (n == null) return '—';
  return '$' + Math.round(n).toLocaleString('en-US');
}

function mLabel(ym) {
  const [y, m] = ym.split('-');
  return new Date(+y, +m - 1, 1).toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
}

async function load() {
  try {
    const res  = await fetch(API);
    const data = await res.json();
    render(data);
  } catch(e) {
    console.warn('Widget fetch error', e);
  }
}

function render(d) {
  // ── Families ────────────────────────────────────────────────────
  document.getElementById('families-count').textContent = d.families_active ?? '—';
  const lives = d.lives_impacted || d.families_active || 0;
  document.getElementById('lives-sub').textContent = lives ? `${lives} lives impacted` : '';

  // ── Countdown ───────────────────────────────────────────────────
  const daysEl = document.getElementById('days-value');
  const unitEl = document.getElementById('days-unit');
  const dateEl = document.getElementById('delivery-date-sub');

  if (d.days_to_delivery != null) {
    const n = d.days_to_delivery;
    if (n <= 0) {
      daysEl.textContent = 'Today';
      unitEl.textContent = '';
    } else {
      daysEl.textContent = n;
      unitEl.textContent = n === 1 ? 'day' : 'days';
    }
    if (d.next_delivery_date) {
      const nd = new Date(d.next_delivery_date + 'T00:00:00');
      dateEl.textContent = nd.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }
  } else {
    daysEl.textContent = '—';
    unitEl.textContent = '';
    dateEl.textContent = 'No upcoming cycle';
  }

  // ── Progress bar ────────────────────────────────────────────────
  const monthlyNeed = d.monthly_need    || 0;
  const adjTarget   = d.this_month_adjusted_target != null ? d.this_month_adjusted_target : monthlyNeed;
  const surplus     = d.last_month_surplus || 0;
  const collected   = d.month_raised    || 0;
  const families    = d.families_active || 0;
  const cost        = d.cost_per_family || 200;

  const nowLabel = new Date().toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  document.getElementById('month-label').textContent = nowLabel + ' Fundraising';
  document.getElementById('month-collected').textContent = fmt(collected);

  const goalMet = adjTarget === 0 && monthlyNeed > 0;
  const barGoal = goalMet ? monthlyNeed : adjTarget;

  document.getElementById('goal-label').textContent =
    goalMet ? `of ${fmt(monthlyNeed)} goal — covered ✓` : `of ${fmt(barGoal)} goal`;

  if (goalMet) {
    // Surplus covers everything — full red bar + show banner
    document.getElementById('bar-red').style.width   = '100%';
    document.getElementById('bar-green').style.width = '0%';
    document.getElementById('goal-met-banner').style.display = 'block';
    document.getElementById('progress-pct').textContent  = `${families} families × ${fmt(cost)}/mo = ${fmt(monthlyNeed)} needed`;
    document.getElementById('surplus-note').textContent  = '';
  } else if (collected >= barGoal) {
    // Goal met this month — red fills to goal, green shows surplus portion
    const totalBar    = collected;
    const redPct      = Math.round(barGoal / totalBar * 100);
    const greenPct    = 100 - redPct;
    document.getElementById('bar-red').style.width   = redPct + '%';
    document.getElementById('bar-green').style.width = greenPct + '%';
    document.getElementById('goal-met-banner').style.display = 'none';
    document.getElementById('progress-pct').textContent  = `Goal met · ${families} families × ${fmt(cost)}/mo`;
    document.getElementById('surplus-note').textContent  = `+${fmt(collected - barGoal)} surplus this month`;
  } else {
    // Still working toward goal — red only, no green
    const pct = barGoal > 0 ? Math.min(99, Math.round(collected / barGoal * 100)) : 0;
    document.getElementById('bar-red').style.width   = pct + '%';
    document.getElementById('bar-green').style.width = '0%';
    document.getElementById('goal-met-banner').style.display = 'none';
    document.getElementById('progress-pct').textContent  = `${pct}% · ${families} families × ${fmt(cost)}/mo = ${fmt(barGoal)} needed`;
    document.getElementById('surplus-note').textContent  =
      surplus > 0 ? `+${fmt(surplus)} surplus from last month` : '';
  }

  // ── Trend chart ─────────────────────────────────────────────────
  const dm = (d.donations_by_month || []).filter(m => (m.total || 0) > 0);
  const histLabels = dm.map(m => mLabel(m.month));
  const histTotals = dm.map(m => m.total || 0);

  const avgMonthly   = d.proj_avg_monthly   || 0;
  const monthlyTrend = d.proj_monthly_trend || 0;
  const lineLastTotal = histTotals.length ? histTotals[histTotals.length - 1] : 0;
  const projBase     = avgMonthly || lineLastTotal;
  const maxDrop      = projBase * 0.05;
  const trendDamp    = monthlyTrend >= 0 ? monthlyTrend : Math.max(monthlyTrend, -maxDrop);

  const projLabels = [];
  const projVals   = [];
  if (dm.length) {
    const lastDate = new Date(dm[dm.length - 1].month + '-01');
    for (let i = 1; i <= 6; i++) {
      const date = new Date(lastDate.getFullYear(), lastDate.getMonth() + i, 1);
      projLabels.push(date.toLocaleDateString('en-US', { month: 'short', year: '2-digit' }));
      projVals.push(Math.max(0, Math.round(projBase + trendDamp * i)));
    }
  }

  const allLabels  = [...histLabels, ...projLabels];
  const actualData = [...histTotals, ...Array(projLabels.length).fill(null)];
  const projData   = [
    ...Array(histLabels.length - 1).fill(null),
    lineLastTotal,
    ...projVals
  ];

  const goalPlugin = {
    id: 'goalPlugin',
    afterDraw(chart) {
      if (!monthlyNeed) return;
      const { ctx, chartArea: { left, right }, scales: { y } } = chart;
      const yPos = y.getPixelForValue(monthlyNeed);
      ctx.save();
      ctx.beginPath();
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = 'rgba(192,57,43,0.35)';
      ctx.lineWidth = 1.5;
      ctx.moveTo(left, yPos);
      ctx.lineTo(right, yPos);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = 'bold 9px Arial';
      ctx.fillStyle = 'rgba(192,57,43,0.45)';
      ctx.textAlign = 'left';
      ctx.fillText('$' + Math.round(monthlyNeed).toLocaleString() + ' goal', left + 4, yPos - 4);
      ctx.restore();
    }
  };

  if (chart) chart.destroy();
  const canvas = document.getElementById('trend-chart');
  if (canvas) {
    chart = new Chart(canvas.getContext('2d'), {
      type: 'line',
      plugins: [goalPlugin],
      data: {
        labels: allLabels,
        datasets: [
          {
            label: 'Actual',
            data: actualData,
            borderColor: '#111',
            borderWidth: 2,
            backgroundColor: 'rgba(0,0,0,0.03)',
            fill: true,
            tension: 0.35,
            pointBackgroundColor: '#111',
            pointRadius: 3,
            pointHoverRadius: 5,
            spanGaps: false,
          },
          {
            label: 'Projected',
            data: projData,
            borderColor: '#bbb',
            borderWidth: 1.5,
            borderDash: [5, 4],
            backgroundColor: 'transparent',
            fill: false,
            tension: 0.25,
            pointRadius: 2,
            pointBackgroundColor: '#bbb',
            spanGaps: false,
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        animation: { duration: 800 },
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#111',
            borderColor: '#333',
            borderWidth: 1,
            titleColor: '#aaa',
            bodyColor: '#fff',
            callbacks: {
              label: ctx => {
                if (ctx.parsed.y == null) return null;
                return ` ${ctx.dataset.label}: $${Math.round(ctx.parsed.y).toLocaleString()}`;
              }
            }
          }
        },
        scales: {
          x: {
            grid: { color: 'rgba(0,0,0,0.04)' },
            ticks: { color: '#bbb', font: { size: 10 } },
            border: { color: '#e8e8e8' }
          },
          y: {
            grid: { color: 'rgba(0,0,0,0.04)' },
            ticks: {
              color: '#bbb',
              font: { size: 10 },
              callback: v => '$' + Math.round(v).toLocaleString()
            },
            border: { color: '#e8e8e8' },
            beginAtZero: true
          }
        }
      }
    });
  }
}

load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
