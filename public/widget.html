<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIHAA — Donation Progress</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  @font-face {
    font-family: 'AreaExtrabold';
    src: url('https://static.wixstatic.com/ufonts/2e5170_b7dd1a41ae7e481ca8d80cdf3858d08b/woff2/file.woff2') format('woff2');
  }
  @font-face {
    font-family: 'AreaNormal';
    src: url('https://static.wixstatic.com/ufonts/2e5170_6263df7a2b874b8c9a621cc0eefc5ab8/woff2/file.woff2') format('woff2');
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: 'AreaNormal', Helvetica, Arial, sans-serif;
    background: transparent;
    color: inherit;
    font-size: 14px;
    line-height: 1.4;
  }

  .widget {
    padding: 0 4px 8px;
    width: 100%;
  }

  /* ── Header row ───────────────────────────────────── */
  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }

  .chart-title {
    font-family: 'AreaExtrabold', Helvetica, Arial, sans-serif;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.01em;
    color: inherit;
    text-transform: uppercase;
    letter-spacing: 1.4px;
  }

  .chart-legend {
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    opacity: 0.5;
  }

  /* ── Progress bar ─────────────────────────────────── */
  .progress-wrap {
    margin-bottom: 20px;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }

  .progress-collected {
    font-family: 'AreaExtrabold', Helvetica, Arial, sans-serif;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: inherit;
    line-height: 1;
  }

  .progress-right {
    text-align: right;
    font-size: 12px;
    opacity: 0.55;
    line-height: 1.5;
  }

  .progress-track {
    width: 100%;
    height: 6px;
    background: rgba(128,128,128,0.18);
    border-radius: 2px;
    overflow: hidden;
    display: flex;
  }

  .progress-red {
    height: 6px;
    background: #c0392b;
    border-radius: 2px 0 0 2px;
    transition: width 1.2s cubic-bezier(0.4,0,0.2,1);
    flex-shrink: 0;
  }

  .progress-green {
    height: 6px;
    background: #27ae60;
    border-radius: 0 2px 2px 0;
    transition: width 1.2s cubic-bezier(0.4,0,0.2,1);
    flex-shrink: 0;
  }

  .progress-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 6px;
  }

  .progress-pct {
    font-size: 11px;
    opacity: 0.45;
  }

  .surplus-note {
    font-size: 11px;
    color: #27ae60;
    font-weight: 700;
  }

  .goal-met-banner {
    margin-top: 8px;
    font-size: 12px;
    color: #27ae60;
    font-weight: 700;
  }

  /* ── Chart ────────────────────────────────────────── */
  .chart-wrap {
    position: relative;
    width: 100%;
  }

  canvas { display: block; width: 100% !important; }

  /* ── Footer ──────────────────────────────────────── */
  .widget-footer {
    margin-top: 10px;
    font-size: 10px;
    opacity: 0.25;
    text-align: right;
    letter-spacing: 0.5px;
  }

  @media (max-width: 480px) {
    .progress-collected { font-size: 20px; }
    .chart-title { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="widget">

  <!-- Header -->
  <div class="chart-header">
    <div class="chart-title">Donation Progress</div>
    <div class="chart-legend">
      <div class="legend-item">
        <svg width="22" height="10"><line x1="0" y1="5" x2="22" y2="5" stroke="currentColor" stroke-width="3.5"/></svg>
        Actual
      </div>
      <div class="legend-item">
        <svg width="22" height="10"><line x1="0" y1="5" x2="22" y2="5" stroke="currentColor" stroke-width="2.5" stroke-dasharray="5,3"/></svg>
        Projected
      </div>
      <div class="legend-item">
        <svg width="22" height="10"><line x1="0" y1="5" x2="22" y2="5" stroke="#00bcd4" stroke-width="2" stroke-dasharray="4,3"/></svg>
        Monthly Goal
      </div>
    </div>
  </div>

  <!-- Progress bar -->
  <div class="progress-wrap">
    <div class="progress-meta">
      <div class="progress-collected" id="month-collected">—</div>
      <div class="progress-right" id="progress-right">Monthly Goal: —</div>
    </div>
    <div class="progress-track">
      <div class="progress-red"   id="bar-red"   style="width:0%;"></div>
      <div class="progress-green" id="bar-green" style="width:0%;"></div>
    </div>
    <div class="progress-footer">
      <div class="progress-pct"  id="progress-pct"></div>
      <div class="surplus-note"  id="surplus-note"></div>
    </div>
    <div class="goal-met-banner" id="goal-met-banner" style="display:none;">
      ✓ This month's goal is fully covered by last month's surplus
    </div>
  </div>

  <!-- Chart -->
  <div class="chart-wrap">
    <canvas id="trend-chart" height="110"></canvas>
  </div>

  <div class="widget-footer">Updated every 5 min · SIHAA</div>
</div>

<script>
const API = '/api/donate-stats';
let chart = null;

function fmt(n) {
  if (n == null) return '—';
  return '$' + Math.round(n).toLocaleString('en-US');
}

function mLabel(ym) {
  const [y, m] = ym.split('-');
  return new Date(+y, +m - 1, 1).toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
}

async function load() {
  try {
    const res  = await fetch(API);
    const data = await res.json();
    render(data);
  } catch(e) {
    console.warn('Widget fetch error', e);
  }
}

function render(d) {
  const monthlyNeed = d.monthly_need    || 0;
  const adjTarget   = d.this_month_adjusted_target != null ? d.this_month_adjusted_target : monthlyNeed;
  const surplus     = d.last_month_surplus || 0;
  const collected   = d.month_raised    || 0;
  const families    = d.families_active || 0;
  const cost        = d.cost_per_family || 200;

  // ── Progress bar ────────────────────────────────────
  document.getElementById('month-collected').textContent = fmt(collected);
  document.getElementById('progress-right').textContent =
    'Monthly Goal: ' + fmt(monthlyNeed);

  const goalMet = adjTarget === 0 && monthlyNeed > 0;
  const barGoal = goalMet ? monthlyNeed : adjTarget;

  if (goalMet) {
    document.getElementById('bar-red').style.width   = '100%';
    document.getElementById('bar-green').style.width = '0%';
    document.getElementById('goal-met-banner').style.display = 'block';
    document.getElementById('progress-pct').textContent  = '100% · fully covered by last month\'s surplus';
    document.getElementById('surplus-note').textContent  = '';
  } else if (collected >= barGoal && barGoal > 0) {
    const redPct   = Math.round(barGoal / collected * 100);
    const greenPct = 100 - redPct;
    document.getElementById('bar-red').style.width   = redPct + '%';
    document.getElementById('bar-green').style.width = greenPct + '%';
    document.getElementById('goal-met-banner').style.display = 'none';
    document.getElementById('progress-pct').textContent  = '100% · goal reached';
    document.getElementById('surplus-note').textContent  = '+' + fmt(collected - barGoal) + ' surplus this month';
  } else {
    const pct = barGoal > 0 ? Math.min(99, Math.round(collected / barGoal * 100)) : 0;
    document.getElementById('bar-red').style.width   = pct + '%';
    document.getElementById('bar-green').style.width = '0%';
    document.getElementById('goal-met-banner').style.display = 'none';
    document.getElementById('progress-pct').textContent  = pct + '% of Monthly Goal';
    document.getElementById('surplus-note').textContent  =
      surplus > 0 ? '+' + fmt(surplus) + ' surplus from last month' : '';
  }

  // ── Trend chart ─────────────────────────────────────
  const dm = (d.donations_by_month || []).filter(m => (m.total || 0) > 0);
  const histLabels = dm.map(m => mLabel(m.month));
  const histTotals = dm.map(m => m.total || 0);

  const avgMonthly    = d.proj_avg_monthly   || 0;
  const monthlyTrend  = d.proj_monthly_trend || 0;
  const lineLastTotal = histTotals.length ? histTotals[histTotals.length - 1] : 0;
  const projBase      = avgMonthly || lineLastTotal;
  const maxDrop       = projBase * 0.05;
  const trendDamp     = monthlyTrend >= 0 ? monthlyTrend : Math.max(monthlyTrend, -maxDrop);

  const projLabels = [];
  const projVals   = [];
  if (dm.length) {
    const lastDate = new Date(dm[dm.length - 1].month + '-01');
    for (let i = 1; i <= 6; i++) {
      const date = new Date(lastDate.getFullYear(), lastDate.getMonth() + i, 1);
      projLabels.push(date.toLocaleDateString('en-US', { month: 'short', year: '2-digit' }));
      projVals.push(Math.max(0, Math.round(projBase + trendDamp * i)));
    }
  }

  const allLabels  = [...histLabels, ...projLabels];
  const actualData = [...histTotals, ...Array(projLabels.length).fill(null)];
  const projData   = [
    ...Array(histLabels.length - 1).fill(null),
    lineLastTotal,
    ...projVals
  ];

  // Detect text colour from body for theming
  const textColor = getComputedStyle(document.body).color || '#111';

  const goalPlugin = {
    id: 'goalPlugin',
    afterDraw(chart) {
      if (!monthlyNeed) return;
      const { ctx, chartArea: { left, right }, scales: { y } } = chart;
      const yPos = y.getPixelForValue(monthlyNeed);
      ctx.save();
      ctx.beginPath();
      ctx.setLineDash([6, 4]);
      ctx.strokeStyle = '#00bcd4';
      ctx.lineWidth   = 2;
      ctx.globalAlpha = 0.8;
      ctx.moveTo(left, yPos);
      ctx.lineTo(right, yPos);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
      ctx.font        = 'bold 10px Arial';
      ctx.fillStyle   = '#00bcd4';
      ctx.textAlign   = 'left';
      ctx.fillText('Monthly Goal  ' + fmt(monthlyNeed), left + 6, yPos - 5);
      ctx.restore();
    }
  };

  if (chart) chart.destroy();
  const canvas = document.getElementById('trend-chart');
  if (!canvas) return;

  chart = new Chart(canvas.getContext('2d'), {
    type: 'line',
    plugins: [goalPlugin],
    data: {
      labels: allLabels,
      datasets: [
        {
          label: 'Actual',
          data: actualData,
          borderColor: textColor,
          borderWidth: 3.5,
          backgroundColor: 'transparent',
          fill: false,
          tension: 0.35,
          pointBackgroundColor: textColor,
          pointRadius: 4,
          pointHoverRadius: 6,
          spanGaps: false,
        },
        {
          label: 'Projected',
          data: projData,
          borderColor: textColor,
          borderWidth: 2.5,
          borderDash: [6, 4],
          backgroundColor: 'transparent',
          fill: false,
          tension: 0.25,
          pointRadius: 3,
          pointBackgroundColor: textColor,
          spanGaps: false,
          globalAlpha: 0.4,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      animation: { duration: 800 },
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(0,0,0,0.8)',
          borderColor: 'rgba(255,255,255,0.1)',
          borderWidth: 1,
          titleColor: '#aaa',
          bodyColor: '#fff',
          callbacks: {
            label: ctx => {
              if (ctx.parsed.y == null) return null;
              const label = ctx.dataset.label === 'Projected' ? 'Projected' : 'Actual';
              return ` ${label}: ${fmt(ctx.parsed.y)}`;
            },
            afterBody: () => [` Monthly Goal: ${fmt(monthlyNeed)}`]
          }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          border: { display: false },
          ticks: { color: 'rgba(128,128,128,0.6)', font: { size: 10 } }
        },
        y: {
          grid: { display: false },
          border: { display: false },
          beginAtZero: true,
          ticks: {
            color: 'rgba(128,128,128,0.6)',
            font: { size: 10 },
            callback: v => fmt(v)
          }
        }
      }
    }
  });
}

load();
setInterval(load, 5 * 60 * 1000);
</script>
</body>
</html>
