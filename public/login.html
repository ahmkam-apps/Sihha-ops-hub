<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sihha — Sign In</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #111;
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    width: 100%;
    max-width: 400px;
    padding: 40px 36px 36px;
  }
  .logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    color: #fff;
  }
  .tagline {
    font-size: 13px;
    color: #666;
    margin-bottom: 36px;
  }
  .screen { display: none; }
  .screen.active { display: block; }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  input[type=text], input[type=password] {
    width: 100%;
    background: #111;
    border: 1px solid #333;
    color: #fff;
    font-size: 15px;
    padding: 11px 14px;
    outline: none;
    margin-bottom: 18px;
    -webkit-appearance: none;
  }
  input:focus { border-color: #555; }
  input::placeholder { color: #444; }
  button[type=submit], .btn-primary {
    width: 100%;
    background: #fff;
    color: #111;
    border: none;
    font-size: 14px;
    font-weight: 700;
    padding: 13px;
    cursor: pointer;
    letter-spacing: 0.3px;
    margin-top: 4px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error-msg {
    background: #2a0000;
    border: 1px solid #600;
    color: #ff8080;
    font-size: 13px;
    padding: 10px 14px;
    margin-bottom: 18px;
    display: none;
  }
  .error-msg.visible { display: block; }
  .success-msg {
    background: #001a00;
    border: 1px solid #060;
    color: #80ff80;
    font-size: 13px;
    padding: 10px 14px;
    margin-bottom: 18px;
    display: none;
  }
  .success-msg.visible { display: block; }
  .password-hint {
    font-size: 12px;
    color: #555;
    margin-top: -12px;
    margin-bottom: 18px;
    line-height: 1.5;
  }
  .rule { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  .rule .dot { width: 6px; height: 6px; border-radius: 50%; background: #444; flex-shrink: 0; }
  .rule.ok .dot { background: #4caf50; }
  .rule.ok span { color: #aaa; }
  .screen-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .screen-sub {
    font-size: 13px;
    color: #666;
    margin-bottom: 28px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Sihha</div>
  <div class="tagline">Ops Hub — Sign In</div>

  <!-- Screen 1: Login -->
  <div id="screen-login" class="screen active">
    <div id="login-error" class="error-msg"></div>
    <form id="login-form" autocomplete="on">
      <label>Username</label>
      <input type="text" id="username" name="username" placeholder="your.username" autocomplete="username" required>
      <label>Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      <button type="submit" id="login-btn">Sign In</button>
    </form>
  </div>

  <!-- Screen 2: Set Password (first login or forced reset) -->
  <div id="screen-set-password" class="screen">
    <div class="screen-title">Set Your Password</div>
    <div class="screen-sub" id="set-pw-reason">Choose a secure password for your account.</div>
    <div id="set-pw-error" class="error-msg"></div>
    <form id="set-password-form" autocomplete="off">
      <label>New Password</label>
      <input type="password" id="new-password" placeholder="Min 8 chars" autocomplete="new-password" required oninput="checkRules()">
      <div class="password-hint">
        <div class="rule" id="rule-len"><div class="dot"></div><span>At least 8 characters</span></div>
        <div class="rule" id="rule-upper"><div class="dot"></div><span>One uppercase letter</span></div>
        <div class="rule" id="rule-digit"><div class="dot"></div><span>One number</span></div>
        <div class="rule" id="rule-special"><div class="dot"></div><span>One special character (!@#$%^&amp;*)</span></div>
      </div>
      <label>Confirm Password</label>
      <input type="password" id="confirm-password" placeholder="Repeat password" autocomplete="new-password" required>
      <button type="submit" id="set-pw-btn" disabled>Set Password</button>
    </form>
  </div>
</div>

<script>
  const API = '';
  let tempToken = null;

  // ── Login form ───────────────────────────────────────────────────────────────
  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    clearError('login-error');

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password})
      });
      const data = await res.json();

      if (!res.ok) {
        showError('login-error', data.error || 'Sign in failed.');
        btn.disabled = false;
        btn.textContent = 'Sign In';
        return;
      }

      if (data.must_change_password) {
        // Transition to set-password screen
        tempToken = data.temp_token;
        const isExpired = !data.user; // no user means token-expired edge case
        document.getElementById('set-pw-reason').textContent =
          'Your password has expired or this is your first login. Please set a new password.';
        showScreen('screen-set-password');
        return;
      }

      // Successful login — store token and redirect
      storeSession(data);
      window.location.href = data.redirect || '/';

    } catch (err) {
      showError('login-error', 'Network error — please try again.');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });

  // ── Set password form ────────────────────────────────────────────────────────
  document.getElementById('set-password-form').addEventListener('submit', async e => {
    e.preventDefault();
    const newPw = document.getElementById('new-password').value;
    const confirmPw = document.getElementById('confirm-password').value;
    clearError('set-pw-error');

    if (newPw !== confirmPw) {
      showError('set-pw-error', 'Passwords do not match.');
      return;
    }

    const btn = document.getElementById('set-pw-btn');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      const res = await fetch('/api/auth/set-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({temp_token: tempToken, password: newPw})
      });
      const data = await res.json();

      if (!res.ok) {
        showError('set-pw-error', data.error || 'Could not set password.');
        btn.disabled = false;
        btn.textContent = 'Set Password';
        return;
      }

      storeSession(data);
      window.location.href = data.redirect || '/';

    } catch (err) {
      showError('set-pw-error', 'Network error — please try again.');
      btn.disabled = false;
      btn.textContent = 'Set Password';
    }
  });

  // ── Password rules checker ───────────────────────────────────────────────────
  function checkRules() {
    const pw = document.getElementById('new-password').value;
    const rules = {
      'rule-len':     pw.length >= 8,
      'rule-upper':   /[A-Z]/.test(pw),
      'rule-digit':   /\d/.test(pw),
      'rule-special': /[!@#$%^&*()\-_=+\[\]{};':",.<>/?\\|`~]/.test(pw),
    };
    let allOk = true;
    for (const [id, ok] of Object.entries(rules)) {
      document.getElementById(id).classList.toggle('ok', ok);
      if (!ok) allOk = false;
    }
    document.getElementById('set-pw-btn').disabled = !allOk;
  }

  // ── Helpers ──────────────────────────────────────────────────────────────────
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function showError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.classList.add('visible');
  }

  function clearError(id) {
    const el = document.getElementById(id);
    el.textContent = '';
    el.classList.remove('visible');
  }

  function storeSession(data) {
    const role = data.user?.role || '';
    const token = data.token;
    // Store in the right key depending on role so portals pick it up
    if (role === 'volunteer') {
      localStorage.setItem('portalToken', token);
      localStorage.setItem('portalVolunteer', JSON.stringify(data.user));
    } else if (role === 'family') {
      localStorage.setItem('familyToken', token);
      localStorage.setItem('familyUser', JSON.stringify(data.user));
    } else {
      // Admin / treasurer / viewer
      localStorage.setItem('token', token);
      localStorage.setItem('user', JSON.stringify(data.user));
    }
  }

  // If already logged in, redirect immediately
  (function checkExistingSession() {
    const token = localStorage.getItem('token') || localStorage.getItem('portalToken') || localStorage.getItem('familyToken');
    if (!token) return;
    // Quick validation — if token exists, try to go to the right place
    const user = JSON.parse(localStorage.getItem('user') || localStorage.getItem('portalVolunteer') || localStorage.getItem('familyUser') || '{}');
    const role = user.role || '';
    const redirectMap = {volunteer: '/portal', family: '/family'};
    const dest = redirectMap[role] || '/';
    // Soft redirect only if we have a stored role
    if (role) window.location.href = dest;
  })();
</script>
</body>
</html>
