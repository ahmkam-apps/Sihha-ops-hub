        <input type="number" id="cat-order" min="1" value="${cat?.display_order||''}">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="cat-active">
          <option value="1" ${!cat||cat.is_active?'selected':''}>Active</option>
          <option value="0" ${cat&&!cat.is_active?'selected':''}>Hidden</option>
        </select>
      </div>
    </div>
    <div class="alert alert-error" id="cat-err"></div>`,
    `<button class="btn" onclick="saveCategory()">Save</button>
     <button class="btn btn-outline" onclick="closeDrawer()">Cancel</button>`
  );
}

async function saveCategory() {
  const showErr = msg => { const el=document.getElementById('cat-err'); el.textContent=msg; el.style.display='block'; };
  const name = document.getElementById('cat-name').value.trim();
  if (!name) return showErr('Name is required');
  const payload = {
    name,
    display_order: parseInt(document.getElementById('cat-order').value)||0,
    is_active: parseInt(document.getElementById('cat-active').value)
  };
  try {
    if (STATE.editId) await PUT('/food-categories/' + STATE.editId, payload);
    else await POST('/food-categories', payload);
    closeDrawer(); renderCatalog();
  } catch(e) { showErr(e.message); }
}

async function openItemForm(id, defaultCatId) {
  STATE.editId = id || null;
  const item = id ? _catalogItems.find(i => i.id === id) : null;
  const catOptions = _catalogCats.map(c =>
    `<option value="${c.id}" ${(item?.category_id||defaultCatId)===c.id?'selected':''}>${c.name}</option>`
  ).join('');

  // Pre-load existing quantities if editing
  let qtyS = '', qtyM = '', qtyL = '';
  if (id) {
    try {
      const bqs = await GET('/bundle-quantities');
      bqs.forEach(bq => {
        if (bq.food_item_id === id) {
          if (bq.bundle_size === 'S') qtyS = bq.quantity;
          else if (bq.bundle_size === 'M') qtyM = bq.quantity;
          else if (bq.bundle_size === 'L') qtyL = bq.quantity;
        }
      });
    } catch(e) {}
  }

  openDrawer(id ? 'Edit Food Item' : 'Add Food Item', `
    <div class="form-group">
      <label>Category *</label>
      <select id="item-cat">${catOptions}</select>
    </div>
    <div class="form-group">
      <label>Item Name *</label>
      <input type="text" id="item-name" value="${item?.name||''}">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Unit</label>
        <input type="text" id="item-unit" placeholder="e.g. lb, can, bag" value="${item?.unit||''}">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="item-active">
          <option value="1" ${!item||item.is_active?'selected':''}>Active</option>
          <option value="0" ${item&&!item.is_active?'selected':''}>Hidden</option>
        </select>
      </div>
    </div>
    <div class="form-row" style="margin-top:12px;">
      <div class="form-group">
        <label>Price per Unit ($) <span style="font-size:11px;color:var(--gray-4);font-weight:400">— never shown to families</span></label>
        <input type="number" id="item-price" min="0" step="0.01" placeholder="0.00" value="${item?.price != null ? item.price : ''}" style="text-align:center">
      </div>
      <div class="form-group">
        <label>Allow Qty Adjustment</label>
        <select id="item-allow-qty">
          <option value="0" ${!item?.allow_qty?'selected':''}>No (select/deselect only)</option>
          <option value="1" ${item?.allow_qty?'selected':''}>Yes (+/− stepper)</option>
        </select>
      </div>
    </div>
    <div style="margin-top:12px;margin-bottom:4px">
      <label style="font-size:12px;font-weight:600;color:var(--gray-5)">Reference Quantity per Bundle Size</label>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Small</label>
        <input type="number" id="item-qty-s" min="0" step="0.5" placeholder="—" value="${qtyS}" style="text-align:center">
      </div>
      <div class="form-group">
        <label>Medium</label>
        <input type="number" id="item-qty-m" min="0" step="0.5" placeholder="—" value="${qtyM}" style="text-align:center">
      </div>
      <div class="form-group">
        <label>Large</label>
        <input type="number" id="item-qty-l" min="0" step="0.5" placeholder="—" value="${qtyL}" style="text-align:center">
      </div>
    </div>
    <div class="alert alert-error" id="item-err"></div>`,
    `<button class="btn" onclick="saveItem()">Save</button>
     <button class="btn btn-outline" onclick="closeDrawer()">Cancel</button>`
  );
}

async function saveItem() {
  const showErr = msg => { const el=document.getElementById('item-err'); el.textContent=msg; el.style.display='block'; };
  const name = document.getElementById('item-name').value.trim();
  const catId = document.getElementById('item-cat').value;
  if (!name) return showErr('Name is required');
  if (!catId) return showErr('Category is required');
  const payload = {
    name, category_id: catId,
    unit: document.getElementById('item-unit').value.trim() || 'each',
    is_active: parseInt(document.getElementById('item-active').value),
    price: parseFloat(document.getElementById('item-price').value) || 0,
    allow_qty: parseInt(document.getElementById('item-allow-qty').value)
  };
  try {
    let itemId = STATE.editId;
    if (itemId) {
      await PUT('/food-items/' + itemId, payload);
    } else {
      const res = await POST('/food-items', payload);
      itemId = res.id;
    }

    // Save S/M/L quantities (batch PUT expects an array)
    const qtyEntries = [
      { size: 'S', val: document.getElementById('item-qty-s').value },
      { size: 'M', val: document.getElementById('item-qty-m').value },
      { size: 'L', val: document.getElementById('item-qty-l').value },
    ];
    const bqPayload = qtyEntries
      .filter(({ val }) => val !== '' && !isNaN(parseFloat(val)))
      .map(({ size, val }) => ({ food_item_id: itemId, bundle_size: size, quantity: parseFloat(val) }));
    if (bqPayload.length > 0) {
      await PUT('/bundle-quantities', bqPayload).catch(() => {}); // non-fatal
    }

    closeDrawer(); renderCatalog();
  } catch(e) { showErr(e.message); }
}

async function openBundleQuantitiesForm() {
  let bqs, items;
  try {
    [bqs, items] = await Promise.all([GET('/bundle-quantities'), GET('/food-items?active=1')]);
  } catch(e) { alert(e.message); return; }

  const bqMap = {};
  bqs.forEach(bq => { bqMap[bq.food_item_id + '_' + bq.bundle_size] = bq.quantity; });

  const rows = items.map(item => `
    <tr>
      <td style="font-size:12px;padding:8px 10px">
        <strong>${item.name}</strong>
        <span style="color:var(--gray-4);font-size:11px"> (${item.unit})</span>
        <div style="font-size:10px;color:var(--gray-4)">${item.category_name}</div>
      </td>
      ${['S','M','L'].map(size => `
        <td style="padding:6px 8px">
          <input type="text" style="width:80px;border:1px solid var(--gray-3);padding:5px 8px;font-size:12px;font-family:var(--font)"
            id="bq-${item.id}-${size}"
            value="${bqMap[item.id+'_'+size]||''}"
            placeholder="${size}">
        </td>`).join('')}
    </tr>`).join('');

  openDrawer('Bundle Quantities', `
    <p style="font-size:12px;color:var(--gray-4);margin-bottom:16px">
      Set how much of each item is included per bundle size. Use plain numbers or include units (e.g. "5 lb", "2").
    </p>
    <table style="width:100%;border-collapse:collapse">
      <thead>
        <tr style="border-bottom:1px solid var(--gray-2)">
          <th style="text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--gray-4)">Item</th>
          <th style="text-align:left;padding:8px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--gray-4)">Small</th>
          <th style="text-align:left;padding:8px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--gray-4)">Medium</th>
          <th style="text-align:left;padding:8px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--gray-4)">Large</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="alert alert-error" id="bq-err"></div>`,
    `<button class="btn" onclick="saveBundleQuantities(${JSON.stringify(items.map(i=>i.id))})">Save All</button>
     <button class="btn btn-outline" onclick="closeDrawer()">Cancel</button>`
  );
}

async function saveBundleQuantities(itemIds) {
  const showErr = msg => { const el=document.getElementById('bq-err'); el.textContent=msg; el.style.display='block'; };
  const updates = [];
  itemIds.forEach(iid => {
    ['S','M','L'].forEach(size => {
      const val = (document.getElementById(`bq-${iid}-${size}`)?.value||'').trim();
      if (val) updates.push({ food_item_id: iid, bundle_size: size, quantity: val });
    });
  });
  try {
    await fetch('/api/bundle-quantities', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + STATE.token },
      body: JSON.stringify(updates)
    });
    closeDrawer(); renderCatalog();
  } catch(e) { showErr(e.message); }
}

async function openBundleRulesForm() {
  let rules;
  try { rules = await GET('/bundle-size-rules'); } catch(e) { alert(e.message); return; }
  openDrawer('Bundle Size Rules', `
    <p style="font-size:12px;color:var(--gray-4);margin-bottom:16px">
      Set the household size ranges and budgets that determine which bundle a family receives. Families never see bundle sizes, labels, or budgets.
    </p>
    ${rules.map(r => `
      <div style="border:1px solid var(--gray-2);padding:14px;margin-bottom:12px">
        <div style="font-size:12px;font-weight:700;margin-bottom:10px">${r.label} (${r.bundle_size})</div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
          <div class="form-group" style="margin:0">
            <label>Min Household</label>
            <input type="number" min="1" id="br-min-${r.bundle_size}" value="${r.min_household}">
          </div>
          <div class="form-group" style="margin:0">
            <label>Max Household</label>
            <input type="number" min="1" id="br-max-${r.bundle_size}" placeholder="No max" value="${r.max_household||''}">
          </div>
          <div class="form-group" style="margin:0">
            <label>Budget ($) <span style="font-size:10px;color:var(--gray-4)">hidden</span></label>
            <input type="number" min="0" step="0.01" id="br-budget-${r.bundle_size}" placeholder="0.00" value="${r.budget||''}">
          </div>
        </div>
      </div>`).join('')}
    <div class="alert alert-error" id="br-err"></div>`,
    `<button class="btn" onclick="saveBundleRules(${JSON.stringify(rules.map(r=>r.bundle_size))})">Save</button>
     <button class="btn btn-outline" onclick="closeDrawer()">Cancel</button>`
  );
}

async function saveBundleRules(sizes) {
  const showErr = msg => { const el=document.getElementById('br-err'); el.textContent=msg; el.style.display='block'; };
  const updates = sizes.map(size => ({
    bundle_size: size,
    min_household: parseInt(document.getElementById('br-min-' + size)?.value)||1,
    max_household: parseInt(document.getElementById('br-max-' + size)?.value)||null,
    label: size === 'S' ? 'Small' : size === 'M' ? 'Medium' : 'Large',
    budget: parseFloat(document.getElementById('br-budget-' + size)?.value)||0
  }));
  try {
    await fetch('/api/bundle-size-rules', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + STATE.token },
      body: JSON.stringify(updates)
    });
    closeDrawer(); renderCatalog();
  } catch(e) { showErr(e.message); }
}
</script>
</body>
</html>
