<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sihha — Ops Hub</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black:   #111111;
    --white:   #ffffff;
    --gray-1:  #f6f6f6;
    --gray-2:  #e8e8e8;
    --gray-3:  #cccccc;
    --gray-4:  #888888;
    --gray-5:  #444444;
    --sidebar-w: 220px;
    --font: Helvetica, Arial, sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--white);
    color: var(--black);
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── Login ─────────────────────────────────────────────── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--white);
  }
  .login-box {
    width: 360px;
    padding: 48px 40px;
    border: 1.5px solid var(--black);
  }
  .login-logo {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .login-sub {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--gray-4);
    margin-bottom: 36px;
  }
  .login-box label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gray-5);
    margin-bottom: 6px;
  }
  .login-box input {
    width: 100%;
    border: 1.5px solid var(--black);
    padding: 10px 12px;
    font-size: 14px;
    font-family: var(--font);
    outline: none;
    margin-bottom: 20px;
    background: var(--white);
  }
  .login-box input:focus { background: var(--gray-1); }
  .btn-primary {
    width: 100%;
    background: var(--black);
    color: var(--white);
    border: none;
    padding: 12px;
    font-size: 13px;
    font-family: var(--font);
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
  }
  .btn-primary:hover { background: var(--gray-5); }
  .btn-primary:disabled { background: var(--gray-3); cursor: not-allowed; }
  .login-error {
    color: #c00;
    font-size: 12px;
    margin-top: 12px;
    display: none;
  }

  /* ── App Shell ─────────────────────────────────────────── */
  #app { display: none; height: 100vh; }

  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: var(--sidebar-w);
    background: var(--white);
    border-right: 1.5px solid var(--black);
    display: flex;
    flex-direction: column;
    z-index: 100;
  }
  .sidebar-logo {
    padding: 24px 20px 20px;
    border-bottom: 1px solid var(--gray-2);
  }
  .sidebar-logo .wordmark {
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 3px;
  }
  .sidebar-logo .tagline {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--gray-4);
    margin-top: 2px;
  }
  .nav-section {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--gray-4);
    padding: 16px 20px 6px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    font-size: 13px;
    cursor: pointer;
    color: var(--gray-5);
    border-left: 3px solid transparent;
    transition: all 0.1s;
  }
  .nav-item:hover { background: var(--gray-1); color: var(--black); }
  .nav-item.active {
    color: var(--black);
    font-weight: 600;
    border-left-color: var(--black);
    background: var(--gray-1);
  }
  .nav-item .icon { font-size: 14px; width: 18px; text-align: center; }
  .sidebar-footer {
    margin-top: auto;
    padding: 16px 20px;
    border-top: 1px solid var(--gray-2);
    font-size: 12px;
    color: var(--gray-4);
  }
  .sidebar-user { font-weight: 600; color: var(--black); margin-bottom: 2px; }
  .sidebar-role { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .logout-btn {
    margin-top: 10px;
    font-size: 11px;
    color: var(--gray-4);
    cursor: pointer;
    text-decoration: underline;
  }
  .logout-btn:hover { color: var(--black); }

  .main {
    margin-left: var(--sidebar-w);
    min-height: 100vh;
    background: var(--gray-1);
  }
  .topbar {
    background: var(--white);
    border-bottom: 1px solid var(--gray-2);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
  .topbar-actions { display: flex; gap: 10px; align-items: center; }

  .content { padding: 28px 32px; }

  /* ── Buttons ────────────────────────────────────────────── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    font-size: 12px;
    font-family: var(--font);
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    border: 1.5px solid var(--black);
    background: var(--black);
    color: var(--white);
  }
  .btn:hover { background: var(--gray-5); border-color: var(--gray-5); }
  .btn-outline {
    background: var(--white);
    color: var(--black);
  }
  .btn-outline:hover { background: var(--gray-1); }
  .btn-sm { padding: 5px 12px; font-size: 11px; }

  /* ── Stats Cards ────────────────────────────────────────── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--white);
    border: 1.5px solid var(--black);
    padding: 20px;
    cursor: pointer;
  }
  .stat-card:hover { background: var(--gray-1); }
  .stat-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--gray-4);
    margin-bottom: 8px;
  }
  .stat-value {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1;
  }
  .stat-sub {
    font-size: 11px;
    color: var(--gray-4);
    margin-top: 4px;
  }

  /* ── Tables ─────────────────────────────────────────────── */
  .table-card {
    background: var(--white);
    border: 1.5px solid var(--black);
  }
  .table-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--gray-2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .table-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .search-input {
    border: 1.5px solid var(--gray-2);
    padding: 7px 12px;
    font-size: 12px;
    font-family: var(--font);
    outline: none;
    width: 220px;
  }
  .search-input:focus { border-color: var(--black); }
  .filter-tabs { display: flex; gap: 0; }
  .filter-tab {
    padding: 6px 14px;
    font-size: 11px;
    font-family: var(--font);
    cursor: pointer;
    border: 1px solid var(--gray-2);
    background: var(--white);
    margin-right: -1px;
    color: var(--gray-5);
  }
  .filter-tab.active {
    background: var(--black);
    color: var(--white);
    border-color: var(--black);
    z-index: 1;
    position: relative;
  }
  .filter-tab:hover:not(.active) { background: var(--gray-1); }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gray-4);
    padding: 10px 16px;
    border-bottom: 1px solid var(--gray-2);
    font-weight: 600;
    background: var(--gray-1);
  }
  td { padding: 12px 16px; border-bottom: 1px solid var(--gray-2); font-size: 13px; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--gray-1); }
  .empty-row td { text-align: center; color: var(--gray-4); padding: 40px; font-size: 13px; }

  /* ── Status Badges ──────────────────────────────────────── */
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 8px;
  }
  .badge-pending  { background: var(--gray-2); color: var(--gray-5); }
  .badge-active   { background: var(--black);  color: var(--white); }
  .badge-inactive { background: var(--gray-1); color: var(--gray-4); border: 1px solid var(--gray-3); }
  .badge-paused   { background: var(--gray-3); color: var(--gray-5); }
  .badge-approved { background: var(--black);  color: var(--white); }
  .badge-rejected { background: #c00;          color: var(--white); }
  .badge-completed{ background: var(--black);  color: var(--white); }

  /* ── Drawer / Slide-in panel ────────────────────────────── */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 200;
  }
  .overlay.open { display: block; }
  .drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 480px;
    background: var(--white);
    border-left: 1.5px solid var(--black);
    z-index: 201;
    transform: translateX(100%);
    transition: transform 0.2s ease;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--gray-2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .drawer-title { font-size: 15px; font-weight: 700; }
  .drawer-close {
    font-size: 20px;
    cursor: pointer;
    color: var(--gray-4);
    line-height: 1;
    padding: 4px;
  }
  .drawer-close:hover { color: var(--black); }
  .drawer-body {
    padding: 24px;
    overflow-y: auto;
    flex: 1;
  }
  .drawer-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--gray-2);
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }

  /* ── Forms ──────────────────────────────────────────────── */
  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gray-5);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    border: 1.5px solid var(--gray-3);
    padding: 10px 12px;
    font-size: 13px;
    font-family: var(--font);
    outline: none;
    background: var(--white);
    color: var(--black);
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { border-color: var(--black); }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-section {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--gray-4);
    margin-bottom: 14px;
    margin-top: 20px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--gray-2);
  }
  .form-section:first-child { margin-top: 0; }

  /* ── Detail Panel ───────────────────────────────────────── */
  .detail-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    align-items: flex-start;
  }
  .detail-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gray-4);
    width: 130px;
    flex-shrink: 0;
    padding-top: 2px;
    font-weight: 600;
  }
  .detail-value { font-size: 13px; flex: 1; }

  /* ── Alert ───────────────────────────────────────────────── */
  .alert {
    padding: 10px 16px;
    font-size: 12px;
    margin-bottom: 16px;
    display: none;
  }
  .alert-error { background: #fff0f0; border: 1px solid #fcc; color: #c00; }
  .alert-success { background: #f0fff4; border: 1px solid #9f9; color: #060; }

  /* ── Responsive ─────────────────────────────────────────── */
  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .main { margin-left: 0; }
    .drawer { width: 100%; }
  }
</style>
</head>
<body>

<!-- ── Login Screen ────────────────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">sihha</div>
    <div class="login-sub">Operations Hub</div>
    <label>Username</label>
    <input type="text" id="login-user" autocomplete="username" placeholder="username">
    <label>Password</label>
    <input type="password" id="login-pass" autocomplete="current-password" placeholder="••••••••">
    <button class="btn-primary" id="login-btn" onclick="doLogin()">Sign In</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ── App Shell ───────────────────────────────────────────────────────────── -->
<div id="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="wordmark">sihha</div>
      <div class="tagline">Operations Hub</div>
    </div>

    <div class="nav-section">Operations</div>
    <div class="nav-item active" onclick="nav('dashboard')" id="nav-dashboard">
      <span class="icon">◈</span> Dashboard
    </div>
    <div class="nav-item" onclick="nav('families')" id="nav-families">
      <span class="icon">⌂</span> Families
    </div>
    <div class="nav-item" onclick="nav('volunteers')" id="nav-volunteers">
      <span class="icon">◎</span> Volunteers
    </div>
    <div class="nav-item" onclick="nav('assignments')" id="nav-assignments">
      <span class="icon">◷</span> Assignments
    </div>

    <div class="nav-section">Food Program</div>
    <div class="nav-item" onclick="nav('cycles')" id="nav-cycles">
      <span class="icon">↻</span> Cycles
    </div>
    <div class="nav-item" onclick="nav('catalog')" id="nav-catalog">
      <span class="icon">☰</span> Food Catalog
    </div>

    <div class="nav-section">Finance</div>
    <div class="nav-item" onclick="nav('receipts')" id="nav-receipts">
      <span class="icon">▦</span> Receipts
    </div>
    <div class="nav-item" onclick="nav('reimbursements')" id="nav-reimbursements">
      <span class="icon">◫</span> Reimbursements
    </div>

    <div class="nav-section" id="nav-section-admin" style="display:none">Admin</div>
    <div class="nav-item" onclick="nav('users')" id="nav-users" style="display:none">
      <span class="icon">◉</span> Users
    </div>

    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebar-username"></div>
      <div class="sidebar-role" id="sidebar-role"></div>
      <div class="logout-btn" onclick="doLogout()">Sign out</div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <h1 id="page-title">Dashboard</h1>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- ── Drawer ──────────────────────────────────────────────────────────────── -->
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="drawer-title" id="drawer-title">—</div>
    <div class="drawer-close" onclick="closeDrawer()">✕</div>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-footer" id="drawer-footer"></div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let STATE = { token: null, user: null, page: 'dashboard', filter: 'all', editId: null };

// ── API ───────────────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json' }
  };
  if (STATE.token) opts.headers['Authorization'] = 'Bearer ' + STATE.token;
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch('/api' + path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}
const GET  = (p)    => api('GET', p);
const POST = (p, b) => api('POST', p, b);
const PUT  = (p, b) => api('PUT', p, b);

// ── Auth ──────────────────────────────────────────────────────────────────────
async function doLogin() {
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  const err  = document.getElementById('login-error');
  const btn  = document.getElementById('login-btn');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const res = await POST('/auth/login', { username: user, password: pass });
    STATE.token = res.token;
    STATE.user  = res.user;
    localStorage.setItem('sihaa_token', res.token);
    showApp();
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}

async function doLogout() {
  try { await POST('/auth/logout', {}); } catch(e) {}
  STATE.token = null; STATE.user = null;
  localStorage.removeItem('sihaa_token');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

async function checkSession() {
  const token = localStorage.getItem('sihaa_token');
  if (!token) return;
  try {
    STATE.token = token;
    STATE.user  = await GET('/auth/me');
    showApp();
  } catch(e) {
    localStorage.removeItem('sihaa_token');
    STATE.token = null;
  }
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('sidebar-username').textContent = STATE.user.name || STATE.user.username;
  document.getElementById('sidebar-role').textContent = STATE.user.role;
  if (STATE.user.role === 'admin') {
    document.getElementById('nav-section-admin').style.display = '';
    document.getElementById('nav-users').style.display = '';
  }
  nav('dashboard');
}

// Allow Enter key on login
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('login-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
  checkSession();
});

// ── Navigation ────────────────────────────────────────────────────────────────
function nav(page) {
  STATE.page = page; STATE.filter = 'all'; STATE.editId = null;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-' + page);
  if (navEl) navEl.classList.add('active');
  const titles = {
    dashboard: 'Dashboard', families: 'Families', volunteers: 'Volunteers',
    assignments: 'Assignments', receipts: 'Receipts',
    reimbursements: 'Reimbursements', users: 'Users',
    cycles: 'Delivery Cycles', catalog: 'Food Catalog',
    cycle_detail: 'Cycle Detail'
  };
  document.getElementById('page-title').textContent = titles[page] || page;
  closeDrawer();
  const renders = {
    dashboard: renderDashboard, families: renderFamilies,
    volunteers: renderVolunteers, assignments: renderAssignments,
    receipts: renderReceipts, reimbursements: renderReimbursements,
    users: renderUsers, cycles: renderCycles, catalog: renderCatalog
  };
  if (renders[page]) renders[page]();
}

// ── Drawer ────────────────────────────────────────────────────────────────────
function openDrawer(title, bodyHTML, footerHTML) {
  document.getElementById('drawer-title').textContent = title;
  document.getElementById('drawer-body').innerHTML = bodyHTML;
  document.getElementById('drawer-footer').innerHTML = footerHTML || '';
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
  STATE.editId = null;
}

// ── Badge ─────────────────────────────────────────────────────────────────────
function badge(status) {
  return `<span class="badge badge-${status}">${status}</span>`;
}
function fmtDate(s) {
  if (!s) return '—';
  return s.slice(0,10);
}
function fmtMoney(n) {
  if (n === null || n === undefined) return '—';
  return '$' + Number(n).toFixed(2);
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
async function renderDashboard() {
  document.getElementById('topbar-actions').innerHTML = '';
  document.getElementById('content').innerHTML = '<p style="color:var(--gray-4)">Loading…</p>';
  try {
    const s = await GET('/dashboard/stats');
    document.getElementById('content').innerHTML = `
      <div class="stats-grid">
        <div class="stat-card" onclick="nav('families')">
          <div class="stat-label">Families — Total</div>
          <div class="stat-value">${s.families_total}</div>
          <div class="stat-sub">${s.families_active} active · ${s.families_pending} pending</div>
        </div>
        <div class="stat-card" onclick="nav('volunteers')">
          <div class="stat-label">Volunteers — Total</div>
          <div class="stat-value">${s.volunteers_total}</div>
          <div class="stat-sub">${s.volunteers_active} active · ${s.volunteers_pending} pending</div>
        </div>
        <div class="stat-card" onclick="nav('assignments')">
          <div class="stat-label">Open Assignments</div>
          <div class="stat-value">${s.assignments_open}</div>
          <div class="stat-sub">Not yet completed</div>
        </div>
        <div class="stat-card" onclick="nav('receipts')">
          <div class="stat-label">Receipts Pending</div>
          <div class="stat-value">${s.receipts_pending}</div>
          <div class="stat-sub">Awaiting approval</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Spend This Month</div>
          <div class="stat-value">${fmtMoney(s.spend_this_month)}</div>
          <div class="stat-sub">${fmtMoney(s.spend_total)} all time</div>
        </div>
      </div>

    username,

let _cyclesCache = [];

async function renderCycles(filterStatus) {
  filterStatus = filterStatus || STATE.filter || 'all';

    `<button class="btn" onclick="openCycleForm()">+ New Cycle</button>`;

                           shopping:'badge-approved', delivered:'badge-completed' };
    document.getElementById('content').innerHTML = `
      <div style="margin-bottom:16px">
        <div class="filter-tabs">
          ${['all','draft','open','closed','shopping','delivered'].map(s =>

async function advanceCycleStatus(id, current) {
  const next = { draft:'open', open:'closed', closed:'shopping', shopping:'delivered' };
  if (!next[current]) return;
  if (!confirm(`Advance this cycle from "${current}" to "${next[current]}"?`)) return;
  try {
    await PUT('/delivery-cycles/' + id, { status: next[current] });
    renderCycles();
  } catch(e) { alert(e.message); }
}

async function saveCycle() {
  const showErr = msg => { const el = document.getElementById('cy-err'); el.textContent=msg; el.style.display='block'; };
  const title = document.getElementById('cy-title').value.trim();
  const delStart = document.getElementById('cy-del-start').value;
  const delEnd = document.getElementById('cy-del-end').value;
  const openAt = document.getElementById('cy-open').value;
  const closeAt = document.getElementById('cy-close').value;
  if (!title || !delStart || !delEnd || !openAt || !closeAt)
    return showErr('All fields except notes are required');
  const payload = {
    title, delivery_date_start: delStart, delivery_date_end: delEnd,
    request_open_at: openAt, request_close_at: closeAt,
    notes: document.getElementById('cy-notes').value.trim()
  };
  const statusEl = document.getElementById('cy-status');
  if (statusEl) payload.status = statusEl.value;
  try {
    if (STATE.editId) await PUT('/delivery-cycles/' + STATE.editId, payload);
    else await POST('/delivery-cycles', payload);
    closeDrawer(); renderCycles();
  } catch(e) { showErr(e.message); }
}

async function loadBundleQtysIntoTable() {
  try {
    const bqs = await GET('/bundle-quantities');
    // Map bqs by item_id + size
    const map = {};
    bqs.forEach(bq => { map[bq.food_item_id + '_' + bq.bundle_size] = bq.quantity; });

    // Update all table cells for S/M/L
    _catalogItems.forEach(item => {
      const row = document.querySelector(`tr[data-item="${item.id}"]`);
      // Since we used template literals, let's just find cells by traversal
      // Re-render with quantities inline instead
    });

    // Simpler: re-render the quantities directly in cells
    const tds = document.querySelectorAll('td[data-bq]');
    tds.forEach(td => {
      const key = td.getAttribute('data-bq');
      td.textContent = map[key] || '—';
    });
  } catch(e) {}
}

    `<option value="${c.id}" ${(item?.category_id||defaultCatId)===c.id?'selected':''}>${c.name}</option>`
  ).join('');
  openDrawer(id ? 'Edit Food Item' : 'Add Food Item', `
    <div class="form-group">
      <label>Category *</label>
      <select id="item-cat">${catOptions}</select>
    </div>
    <div class="form-group">
      <label>Item Name *</label>
      <input type="text" id="item-name" value="${item?.name||''}">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Unit</label>
        <input type="text" id="item-unit" placeholder="e.g. lb, can, bag" value="${item?.unit||''}">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="item-active">
          <option value="1" ${!item||item.is_active?'selected':''}>Active</option>
          <option value="0" ${item&&!item.is_active?'selected':''}>Hidden</option>
        </select>
      </div>
    </div>
    <p style="font-size:11px;color:var(--gray-4);margin-top:4px">After saving, use "Edit Quantities" to set S/M/L amounts for this item.</p>
    <div class="alert alert-error" id="item-err"></div>`,
    `<button class="btn" onclick="saveItem()">Save</button>
     <button class="btn btn-outline" onclick="closeDrawer()">Cancel</button>`
  );
}

async function saveItem() {
  const showErr = msg => { const el=document.getElementById('item-err'); el.textContent=msg; el.style.display='block'; };
  const name = document.getElementById('item-name').value.trim();
  const catId = document.getElementById('item-cat').value;
  if (!name) return showErr('Name is required');
  if (!catId) return showErr('Category is required');
  const payload = {
    name, category_id: catId,
    unit: document.getElementById('item-unit').value.trim() || 'each',
    is_active: parseInt(document.getElementById('item-active').value)
  };
  try {
    if (STATE.editId) await PUT('/food-items/' + STATE.editId, payload);
    else await POST('/food-items', payload);
    closeDrawer(); renderCatalog();
  } catch(e) { showErr(e.message); }
}

async function openBundleQuantitiesForm() {
  let bqs, items;
  try {
    [bqs, items] = await Promise.all([GET('/bundle-quantities'), GET('/food-items?active=1')]);
  } catch(e) { alert(e.message); return; }

  const bqMap = {};
  bqs.forEach(bq => { bqMap[bq.food_item_id + '_' + bq.bundle_size] = bq.quantity; });

  const rows = items.map(item => `
    <tr>
      <td style="font-size:12px;padding:8px 10px">
        <strong>${item.name}</strong>
        <span style="color:var(--gray-4);font-size:11px"> (${item.unit})</span>
        <div style="font-size:10px;color:var(--gray-4)">${item.category_name}</div>
      </td>
      ${['S','M','L'].map(size => `
        <td style="padding:6px 8px">
          <input type="text" style="width:80px;border:1px solid var(--gray-3);padding:5px 8px;font-size:12px;font-family:var(--font)"
            id="bq-${item.id}-${size}"
            value="${bqMap[item.id+'_'+size]||''}"
            placeholder="${size}">
        </td>`).join('')}
    </tr>`).join('');

  openDrawer('Bundle Quantities', `
    <p style="font-size:12px;color:var(--gray-4);margin-bottom:16px">
      Set how much of each item is included per bundle size. Use plain numbers or include units (e.g. "5 lb", "2").
    </p>
    <table style="width:100%;border-collapse:collapse">
      <thead>
        <tr style="border-bottom:1px solid var(--gray-2)">
          <th style="text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--gray-4)">Item</th>
          <th style="text-align:left;padding:8px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--gray-4)">Small</th>
          <th style="text-align:left;padding:8px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--gray-4)">Medium</th>
          <th style="text-align:left;padding:8px;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--gray-4)">Large</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="alert alert-error" id="bq-err"></div>`,
    `<button class="btn" onclick="saveBundleQuantities(${JSON.stringify(items.map(i=>i.id))})">Save All</button>
     <button class="btn btn-outline" onclick="closeDrawer()">Cancel</button>`
  );
}

async function saveBundleQuantities(itemIds) {
  const showErr = msg => { const el=document.getElementById('bq-err'); el.textContent=msg; el.style.display='block'; };
  const updates = [];
  itemIds.forEach(iid => {
    ['S','M','L'].forEach(size => {
      const val = (document.getElementById(`bq-${iid}-${size}`)?.value||'').trim();
      if (val) updates.push({ food_item_id: iid, bundle_size: size, quantity: val });
    });
  });
  try {
    await fetch('/api/bundle-quantities', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + STATE.token },
      body: JSON.stringify(updates)
    });
    closeDrawer(); renderCatalog();
  } catch(e) { showErr(e.message); }
}

async function openBundleRulesForm() {
  let rules;
  try { rules = await GET('/bundle-size-rules'); } catch(e) { alert(e.message); return; }
  openDrawer('Bundle Size Rules', `
    <p style="font-size:12px;color:var(--gray-4);margin-bottom:16px">
      Set the household size ranges that determine which bundle size a family receives. Families never see these labels.
    </p>
    ${rules.map(r => `
      <div style="border:1px solid var(--gray-2);padding:14px;margin-bottom:12px">
        <div style="font-size:12px;font-weight:700;margin-bottom:10px">${r.label} (${r.bundle_size})</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div class="form-group" style="margin:0">
            <label>Min Household Size</label>
            <input type="number" min="1" id="br-min-${r.bundle_size}" value="${r.min_household}">
          </div>
          <div class="form-group" style="margin:0">
            <label>Max Household Size</label>
            <input type="number" min="1" id="br-max-${r.bundle_size}" placeholder="Leave blank = no max" value="${r.max_household||''}">
          </div>
        </div>
      </div>`).join('')}
    <div class="alert alert-error" id="br-err"></div>`,
    `<button class="btn" onclick="saveBundleRules(${JSON.stringify(rules.map(r=>r.bundle_size))})">Save</button>
     <button class="btn btn-outline" onclick="closeDrawer()">Cancel</button>`
  );
}

async function saveBundleRules(sizes) {
  const showErr = msg => { const el=document.getElementById('br-err'); el.textContent=msg; el.style.display='block'; };
  const updates = sizes.map(size => ({
    bundle_size: size,
    min_household: parseInt(document.getElementById('br-min-' + size)?.value)||1,
    max_household: parseInt(document.getElementById('br-max-' + size)?.value)||null,
    label: size === 'S' ? 'Small' : size === 'M' ? 'Medium' : 'Large'
  }));
  try {
    await fetch('/api/bundle-size-rules', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + STATE.token },
      body: JSON.stringify(updates)
    });
    closeDrawer(); renderCatalog();
  } catch(e) { showErr(e.message); }
}
</script>
</body>
</html>
