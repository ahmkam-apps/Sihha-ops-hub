        ? `<button class="btn btn-sm btn-outline" style="font-size:11px;padding:3px 10px;" onclick="overrideFoodRequest('${o.id}','skipped','${o.cycle_id}','${fid}')">Mark Skipped</button>`
        : o.status === 'skipped'
        ? `<button class="btn btn-sm" style="font-size:11px;padding:3px 10px;background:#1a8754;color:#fff;" onclick="overrideFoodRequest('${o.id}','confirmed','${o.cycle_id}','${fid}')">Mark Confirmed</button>`
        : o.status === 'delivered' ? ''
        : `<button class="btn btn-sm" style="font-size:11px;padding:3px 10px;background:#1a8754;color:#fff;" onclick="overrideFoodRequest('${o.id}','confirmed','${o.cycle_id}','${fid}')">✓ Confirm</button>
           <button class="btn btn-sm btn-outline" style="font-size:11px;padding:3px 10px;margin-left:4px;" onclick="overrideFoodRequest('${o.id}','skipped','${o.cycle_id}','${fid}')">Skip</button>`;
      return `
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--gray-1);">
          <span style="font-size:13px;font-weight:700;min-width:0;flex:1;">${o.cycle_title}</span>
          ${o.delivery_date_start ? `<span style="font-size:12px;color:var(--gray-4);white-space:nowrap;">${fmtDate(o.delivery_date_start)}</span>` : ''}
          <span style="font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;white-space:nowrap;background:${sc.bg};color:${sc.color};">${sc.label}</span>
          <div style="display:flex;gap:4px;flex-wrap:wrap;margin-left:auto;">${btns}
            ${o.status !== 'delivered' ? `
              <button class="btn btn-sm btn-outline" style="font-size:11px;padding:3px 10px;color:#c00;border-color:#c00;" onclick="adminCancelOrder('${fid}','${o.cycle_id}','${r.name}')">✕ Cancel</button>
              <button class="btn btn-sm btn-outline" style="font-size:11px;padding:3px 10px;color:var(--gray-4);border-color:var(--gray-3);" onclick="resetFamilyOrder('${fid}','${r.name}')">↺ Reset</button>` : ''}
          </div>
        </div>`;
    };

    let cycleStrip = '';
    if (activeOrders.length > 0 || unorderedCycle) {
      const header = `<div style="font-size:10px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;color:var(--gray-4);padding-bottom:10px;border-bottom:1px solid var(--gray-2);margin-bottom:2px;">Food Orders</div>`;
      const orderRows = activeOrders.map(renderOrderRow).join('');
      const addRow = unorderedCycle ? `
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;">
          <span style="font-size:13px;font-weight:700;flex:1;">${unorderedCycle.title}</span>
          <span style="font-size:11px;color:var(--gray-4);">No order yet</span>
          <button class="btn btn-sm" style="font-size:11px;padding:3px 12px;background:#1a8754;color:#fff;margin-left:auto;"
            onclick="manualConfirmFamily('${fid}','${r.name}')">＋ Add to Cycle</button>
        </div>` : '';
      cycleStrip = `
        <div style="background:#fff;border-radius:12px;padding:16px 24px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.07);">
          ${header}${orderRows}${addRow}
        </div>`;
    } else if (activeCycle) {
      // No orders placed yet and there's an open cycle
      cycleStrip = `
        <div style="background:#fff;border-radius:12px;padding:16px 24px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.07);">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;color:var(--gray-4);padding-bottom:10px;border-bottom:1px solid var(--gray-2);margin-bottom:2px;">Food Orders</div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;">
            <span style="font-size:13px;font-weight:700;flex:1;">${activeCycle.title}</span>
            <span style="font-size:11px;color:var(--gray-4);">No order yet</span>
            <button class="btn btn-sm" style="font-size:11px;padding:3px 12px;background:#1a8754;color:#fff;margin-left:auto;"
              onclick="manualConfirmFamily('${fid}','${r.name}')">＋ Add to Cycle</button>
          </div>
        </div>`;
    }

    // ── Edit grid ─────────────────────────────────────────────────────────────
    const editGrid = `
      <div style="background:#fff;border-radius:12px;padding:20px 24px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.07);">
        <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;padding-bottom:10px;border-bottom:1px solid var(--gray-2);">
          <span style="font-size:10px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;color:var(--gray-4);">Profile</span>
          <span style="font-size:11px;color:var(--gray-3);">Fields save automatically when you click away</span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 32px;">
          ${row('Name',        inp('name',          r.name))}
          ${row('Phone',       inp('phone',         r.phone,         'tel'))}
          ${row('City',        inp('city',          r.city))}
          ${row('Family Size', inp('family_size',   r.family_size,   'number'))}
          ${row('Children',    inp('children_count',r.children_count,'number'))}
          ${row('Status',      sel('status',      r.status,      ['active','pending','paused','inactive']))}
          ${row('Bundle Size', sel('bundle_size', r.bundle_size, ['S','M','L']))}
          ${row('Frequency',   sel('frequency',   r.frequency,   [
            {value:'weekly',    label:'Weekly'},
            {value:'biweekly',  label:'Bi-weekly'},
            {value:'monthly',   label:'Monthly'},
            {value:'as_needed', label:'As Needed'},
          ]))}
          ${row('Income Range',sel('income_range',r.income_range,[
            {value:'',       label:'—'},
            {value:'<20k',   label:'<$20k'},
            {value:'20-40k', label:'$20k–$40k'},
            {value:'40-60k', label:'$40k–$60k'},
            {value:'>60k',   label:'>$60k'},
          ]))}
          ${row('Address',       inp('address',       r.address),       true)}
          ${row('Dietary Notes', inp('dietary_notes', r.dietary_notes), true)}
          ${row('Notes',
            `<textarea id="fam-f-notes" style="width:100%;border:none;border-bottom:1px solid var(--gray-2);padding:4px 0;font-size:14px;font-family:var(--font-body);background:transparent;outline:none;resize:vertical;min-height:60px;"
               onfocus="this.style.borderBottomColor='var(--black)'"
               onblur="this.style.borderBottomColor='var(--gray-2)'"
               oninput="${markDirty}"
             >${r.notes||''}</textarea>`, true)}
        </div>
      </div>`;

    // ── Delivery history table ─────────────────────────────────────────────────
    const scMap2 = {
      confirmed:            { bg:'#e8f5e9', color:'#1a5e34', label:'Confirmed' },
      auto_confirmed:       { bg:'#e8f5e9', color:'#1a5e34', label:'Auto-confirmed' },
      skipped:              { bg:'#fffbec', color:'#7a6000', label:'Skipped' },
      pending_confirmation: { bg:'#e8f0ff', color:'#3a3a9a', label:'Pending' },
      cancelled:            { bg:'#fdecea', color:'#c00',    label:'Cancelled' },
    };

    const historyRows = orders.map(o => {
      const delivered = !!o.delivered_at;
      const sc = delivered
        ? { bg:'#e8f5e9', color:'#1a5e34', label:'✓ Delivered' }
        : (scMap2[o.status] || { bg:'#f5f5f0', color:'#888', label:o.status });
      const itemList = o.selected_items?.length
        ? o.selected_items.map(i => i.name).join(', ')
        : '—';
      const slotCells = activeTT.map(tt => {
        const assigned = (o.slots||[]).filter(s => s.task_type === tt.slug && s.volunteer_name);
        const selId = `hslot-${tt.slug}-${o.id}`;
        const volOpts = vols.map(v => `<option value="${v.id}">${v.name}</option>`).join('');
        return `<td style="padding:10px;min-width:140px;vertical-align:top;">
          ${assigned.map(s =>
            `<div style="display:flex;align-items:center;gap:4px;margin-bottom:3px;">
               <span style="font-size:12px;font-weight:600;">${s.volunteer_name}</span>
               <button onclick="removeSlot('${s.id}','${fid}',this)"
                 style="border:none;background:none;cursor:pointer;color:var(--gray-3);font-size:16px;line-height:1;padding:0 2px;" title="Remove">×</button>
             </div>`).join('')}
          <select id="${selId}" style="width:100%;font-size:11px;border:1px solid var(--gray-3);padding:3px 5px;background:#fff;border-radius:4px;margin-top:${assigned.length?'4px':'0'};"
            onchange="if(this.value)addSlot('${o.cycle_id}','${fid}','${tt.slug}','${selId}')">
            <option value="">+ Assign volunteer…</option>${volOpts}
          </select>
        </td>`;
      }).join('');

      // Build event log HTML for this order
      const evRows = (o.events||[]).filter(ev => !ev.payload?.note?.includes('backfilled'));
      const fmtEvTs = ts => ts ? new Date(ts+(ts.endsWith('Z')?'':'Z')).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';

      // Find the most recent items_edited event for the inline callout
      const lastEdit = [...evRows].reverse().find(ev => ev.event_type === 'items_edited');
      const lastCancel = evRows.find(ev => ev.event_type === 'cancelled');

      // Inline callout: shown prominently when items were edited or order cancelled by family
      let inlineCallout = '';
      if (lastEdit) {
        const added   = lastEdit.payload?.added?.length   ? `<span style="color:#1a7a3c">+${lastEdit.payload.added.join(', ')}</span>`   : '';
        const removed = lastEdit.payload?.removed?.length ? `<span style="color:#c00">−${lastEdit.payload.removed.join(', ')}</span>` : '';
        const diff    = [added, removed].filter(Boolean).join(' &nbsp;');
        inlineCallout = `
          <div style="margin-top:5px;padding:5px 8px;background:#fff8e1;border:1px solid #ffc107;border-left:3px solid #e0a800;border-radius:3px;font-size:11px;">
            <span style="font-weight:700;color:#7a5200;">✏ Order edited</span>
            <span style="color:#888;margin-left:4px;">${fmtEvTs(lastEdit.created_at)}</span>
            ${diff ? `<div style="margin-top:3px;">${diff}</div>` : ''}
          </div>`;
      } else if (lastCancel) {
        inlineCallout = `
          <div style="margin-top:5px;padding:5px 8px;background:#fdecea;border:1px solid #ef9a9a;border-left:3px solid #c00;border-radius:3px;font-size:11px;">
            <span style="font-weight:700;color:#c00;">✕ Cancelled by family</span>
            <span style="color:#888;margin-left:4px;">${fmtEvTs(lastCancel.created_at)}</span>
          </div>`;
      }

      // Full audit trail in collapsible (all events)
      const evLabels = { confirmed:'✓ Confirmed', items_edited:'✏ Edited',
                         cancelled:'✕ Cancelled', auto_skipped:'— Auto-skipped',
                         admin_override:'⚙ Admin override' };
      const evHtml = evRows.length ? `
        <details style="margin-top:6px;">
          <summary style="font-size:10px;cursor:pointer;color:#aaa;user-select:none;letter-spacing:.4px;">
            FULL LOG (${evRows.length})
          </summary>
          <div style="margin-top:5px;border-left:2px solid #e0e0e0;padding-left:8px;">
            ${evRows.map(ev => {
              const lbl = evLabels[ev.event_type] || ev.event_type;
              const ts  = fmtEvTs(ev.created_at);
              let detail = '';
              if (ev.event_type==='items_edited' && ev.payload) {
                if (ev.payload.added?.length)   detail += ` <span style="color:#1a7a3c">+${ev.payload.added.join(', ')}</span>`;
                if (ev.payload.removed?.length) detail += ` <span style="color:#c00">−${ev.payload.removed.join(', ')}</span>`;
              }
              if (ev.event_type==='admin_override' && ev.payload?.new_status) detail = ` <span style="color:#888">→ ${ev.payload.new_status}</span>`;
              return `<div style="font-size:11px;padding:2px 0;color:#555;">${lbl}${detail||''} <span style="color:#ccc">${ts}</span></div>`;
            }).join('')}
          </div>
        </details>` : '';

      return `<tr style="border-bottom:1px solid var(--gray-1);">
        <td style="padding:10px 10px 10px 0;font-weight:600;white-space:nowrap;">${o.cycle_title}</td>
        <td style="padding:10px;color:var(--gray-5);white-space:nowrap;">${o.delivery_date_start?fmtDateShort(o.delivery_date_start):'—'}</td>
        <td style="padding:10px;min-width:180px;">
          <span style="font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:${sc.bg};color:${sc.color};">${sc.label}</span>
          ${inlineCallout}
          ${evHtml}
        </td>
        <td style="padding:10px;color:var(--gray-5);">${bundleLabel[o.bundle_size]||o.bundle_size||'—'}</td>
        <td style="padding:10px;">
          ${o.selected_items?.length
            ? `<span class="items-badge">
                 ${o.selected_items.length} item${o.selected_items.length===1?'':'s'}
                 <span class="items-tooltip">${o.selected_items.map(i=>i.name).join('<br>')}</span>
               </span>`
            : `<span style="color:var(--gray-3);font-size:13px;">—</span>`}
        </td>
        ${slotCells}
      </tr>`;
    }).join('');

    const historySection = `
      <div style="background:#fff;border-radius:12px;padding:20px 24px;box-shadow:0 1px 3px rgba(0,0,0,.07);">
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;color:var(--gray-4);padding-bottom:10px;border-bottom:1px solid var(--gray-2);">
          Delivery History <span style="font-weight:400;color:var(--gray-3);">(${orders.length})</span>
        </div>
        ${orders.length === 0
          ? '<p style="color:var(--gray-4);font-size:13px;padding:16px 0 0;">No deliveries yet.</p>'
          : `<div style="overflow-x:auto;">
              <table style="width:100%;border-collapse:collapse;font-size:13px;">
                <thead>
                  <tr style="border-bottom:2px solid var(--gray-2);">
                    <th style="text-align:left;padding:8px 10px 8px 0;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--gray-4);font-weight:600;white-space:nowrap;">Cycle</th>
                    <th style="text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--gray-4);font-weight:600;white-space:nowrap;">Date</th>
                    <th style="text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--gray-4);font-weight:600;">Response</th>
                    <th style="text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--gray-4);font-weight:600;">Bundle</th>
                    <th style="text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--gray-4);font-weight:600;">Items</th>
                    ${activeTT.map(tt => `<th style="text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--gray-4);font-weight:600;">${tt.label}</th>`).join('')}
                  </tr>
                </thead>
                <tbody>${historyRows}</tbody>
              </table>
            </div>`
        }
      </div>`;

    document.getElementById('content').innerHTML = summaryStrip + bundleChangeAlert + cycleStrip + editGrid + historySection;
    // Show Save button now that fields are rendered
    const saveBtn = document.getElementById('fam-save-btn');
    if (saveBtn) saveBtn.style.display = 'inline-flex';

  } catch(e) {
    console.error(e);
    document.getElementById('content').innerHTML = `<p style="color:#c00">${e.message}</p>`;
  }
}

function toggleHistRow(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

function switchDrawerTab(tab, context) {
  // Toggle tab active state
  document.querySelectorAll('.drawer-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('dtab-' + tab)?.classList.add('active');
  // Toggle pane visibility
  document.querySelectorAll('.drawer-pane').forEach(p => p.classList.remove('active'));
  document.getElementById('dpane-' + tab)?.classList.add('active');
}

// ── Volunteers ────────────────────────────────────────────────────────────────
async function renderVolunteers(filter, search) {
  filter = filter || STATE.filter || 'all';
  STATE.filter = filter;
  document.getElementById('topbar-actions').innerHTML = `
    <button class="btn btn-outline" onclick="renderTaskTypes()" style="margin-right:8px;">⚙ Task Types</button>
    <button class="btn btn-outline" onclick="renderVolunteerActivityReport()" style="margin-right:8px;">📊 Activity Report</button>
    <button class="btn" onclick="openVolunteerForm()">+ Add Volunteer</button>`;

  let url = '/volunteers';
  const params = [];
  if (filter !== 'all') params.push('status=' + filter);
  if (search) params.push('search=' + encodeURIComponent(search));
  if (params.length) url += '?' + params.join('&');

  document.getElementById('content').innerHTML = '<p style="color:var(--gray-4)">Loading…</p>';
  try {
    const rows = await GET(url);
    document.getElementById('content').innerHTML = `
      <div class="table-card">
        <div class="table-header">
          <span class="table-title">All Volunteers</span>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <input class="search-input" placeholder="Search name, phone, email…"
              id="vol-search" value="${search||''}"
              oninput="renderVolunteers('${filter}', this.value)">
            <div class="filter-tabs">
              ${['all','pending','active','inactive'].map(f =>
                `<div class="filter-tab ${filter===f?'active':''}"
                  onclick="renderVolunteers('${f}', document.getElementById('vol-search').value)"
                  >${f}</div>`
              ).join('')}
            </div>
          </div>
        </div>
        <table>
          <thead><tr>
            <th>Name</th><th>Phone</th><th>Email</th><th>Role</th>
            <th>Status</th><th>Added</th><th></th>
          </tr></thead>
          <tbody>
            ${rows.length ? rows.map(r => `
              <tr id="vrow-${r.id}">
                <td><strong>${r.name}</strong></td>
                <td>${r.phone||'—'}</td>
                <td>${r.email||'—'}</td>
                <td><span style="font-size:11px;text-transform:capitalize">${r.role||'—'}</span></td>
                <td>${badge(r.status)}</td>
                <td style="font-size:11px;color:var(--gray-4)">${fmtDate(r.created_at)}</td>
                <td style="white-space:nowrap">
                  ${r.status==='pending' ? `
                    <button class="btn btn-sm" style="background:#1a8754;color:#fff" onclick="quickStatusVolunteer('${r.id}','active')">✓ Approve</button>
                    <button class="btn btn-sm btn-outline" style="color:#c00;border-color:#c00;margin-left:4px" onclick="quickStatusVolunteer('${r.id}','inactive')">✗</button>
                  ` : `
                    <button class="btn btn-outline btn-sm" onclick="viewVolunteer('${r.id}')">View</button>
                    <button class="btn btn-sm" onclick="openVolunteerForm('${r.id}')" style="margin-left:4px">Edit</button>
                  `}
                </td>
              </tr>`).join('') :
              '<tr class="empty-row"><td colspan="8">No volunteers found</td></tr>'}
          </tbody>
        </table>
      </div>`;
  } catch(e) {
    document.getElementById('content').innerHTML = `<p style="color:#c00">${e.message}</p>`;
  }
}

async function renderVolunteerActivityReport() {
  document.getElementById('page-title').textContent = 'Volunteer Activity Report';
  document.getElementById('topbar-actions').innerHTML =
    `<button class="btn btn-outline" onclick="renderVolunteers()">← Back to Volunteers</button>
     <button class="btn btn-outline" onclick="exportVolunteerActivityCSV()">⬇ Export CSV</button>`;
  document.getElementById('content').innerHTML = '<p style="color:var(--gray-4)">Loading…</p>';
  try {
    const data = await GET('/reports/volunteer-activity');
    window._volActivityData = data;

    const totalTasks    = data.reduce((s, v) => s + (v.total_tasks || 0), 0);
    const totalShopping = data.reduce((s, v) => s + (v.shopping_count || 0), 0);
    const totalDelivery = data.reduce((s, v) => s + (v.delivery_count || 0), 0);
    const activeVols    = data.filter(v => v.total_tasks > 0).length;

    const fmtDate = d => d ? d.slice(0,10) : '—';
    const statusPill = s => {
      const styles = {active:'background:#e8f5e9;color:#1a5e34', pending:'background:#fff8e6;color:#7a6000', inactive:'background:var(--gray-1);color:var(--gray-4)'};
      return `<span style="font-size:11px;font-weight:700;padding:2px 8px;${styles[s]||''}">${s}</span>`;
    };

    document.getElementById('content').innerHTML = `
      <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap">
        <div style="flex:1;min-width:100px;padding:14px 18px;border:1px solid var(--gray-2)">
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--gray-4);margin-bottom:4px">Active Volunteers</div>
          <div style="font-size:28px;font-weight:700">${activeVols}</div>
        </div>
        <div style="flex:1;min-width:100px;padding:14px 18px;border:1px solid var(--gray-2)">
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--gray-4);margin-bottom:4px">Total Tasks Done</div>
          <div style="font-size:28px;font-weight:700">${totalTasks}</div>
        </div>
        <div style="flex:1;min-width:100px;padding:14px 18px;border:1px solid var(--gray-2)">
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--gray-4);margin-bottom:4px">Shopping Runs</div>
          <div style="font-size:28px;font-weight:700">${totalShopping}</div>
        </div>
        <div style="flex:1;min-width:100px;padding:14px 18px;border:1px solid var(--gray-2)">
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--gray-4);margin-bottom:4px">Deliveries</div>
          <div style="font-size:28px;font-weight:700">${totalDelivery}</div>
        </div>
      </div>
      <div class="table-card">
        <div class="table-header">
          <span class="table-title">All Volunteers</span>
          <span style="font-size:12px;color:var(--gray-4)">${data.length} volunteers · sorted by tasks completed</span>
        </div>
        <table>
          <thead><tr>
            <th>Volunteer</th>
            <th>Status</th>
            <th style="text-align:center">Tasks Done</th>
            <th style="text-align:center">Shopping</th>
            <th style="text-align:center">Deliveries</th>
            <th style="text-align:center">Cycles</th>
            <th style="text-align:center">Families Served</th>
            <th>Last Active</th>
          </tr></thead>
          <tbody>
            ${data.length ? data.map(v => `
              <tr style="${!v.total_tasks ? 'color:var(--gray-4)' : ''}">
                <td>
                  <strong style="cursor:pointer;text-decoration:underline" onclick="viewVolunteer('${v.id}')">${v.name}</strong>
                  ${v.phone ? `<br><span style="font-size:11px;color:var(--gray-4)">${v.phone}</span>` : ''}

function exportVolunteerActivityCSV() {
  const data = window._volActivityData;
  if (!data || !data.length) return;
  const headers = ['Name','Phone','Status','Tasks Done','Shopping','Deliveries','Cycles','Families Served','Last Active'];
  const rows = data.map(v => [
    v.name, v.phone||'', v.status,
    v.total_tasks||0, v.shopping_count||0, v.delivery_count||0,
    v.cycles_count||0, v.families_served||0,
    v.last_active ? v.last_active.slice(0,10) : ''
  ]);
  const csv = [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'sihaa-volunteer-activity.csv';
  a.click();
}

async function addTaskType() {
  const inp          = document.getElementById('new-tt-label');
  const fslot        = document.getElementById('new-tt-fslot');
  const label        = inp.value.trim();
  const is_family_slot = fslot?.checked ? 1 : 0;
  if (!label) return;
  try {
    await POST('/task-types', { label, is_family_slot });
    inp.value = ''; if (fslot) fslot.checked = false;
    renderTaskTypes();
  } catch(e) { alert(e.message); }
}

async function saveTaskType(slug) {
  const label        = document.getElementById('tt-label-'  + slug)?.value.trim();
  const order        = parseInt(document.getElementById('tt-order-' + slug)?.value) || 0;
  const is_family_slot = document.getElementById('tt-fslot-' + slug)?.checked ? 1 : 0;
  if (!label) return;
  try {
    await PUT('/task-types/' + slug, { label, display_order: order, is_family_slot });
    renderTaskTypes();
  } catch(e) { alert(e.message); }
}

async function toggleTaskType(slug, newActive) {
  try {
    await PUT('/task-types/' + slug, { is_active: newActive });
    renderTaskTypes();
  } catch(e) { alert(e.message); }
}

async function setVolunteerRole(id, role) {
  try {
    await PUT('/volunteers/' + id, { role });
    // Update button styles in place
    ['shopper','delivery','both'].forEach(v => {
      const btn = document.querySelector(`#role-btns-${id} button:nth-child(${['shopper','delivery','both'].indexOf(v)+1})`);
      if (!btn) return;
      const active = v === role;
      btn.style.background    = active ? 'var(--black)' : 'var(--white)';
      btn.style.color         = active ? 'var(--white)' : 'var(--black)';
      btn.style.borderColor   = active ? 'var(--black)' : 'var(--gray-3)';
    });
    const msg = document.getElementById('role-msg-' + id);
    if (msg) { msg.textContent = '✓ Saved'; setTimeout(() => msg.textContent = '', 2000); }
  } catch(e) {
    alert('Failed to update role: ' + e.message);
  }
}

async function viewVolunteer(id) {

        ${v}

    const detailsHTML = `
      <div class="detail-row"><div class="detail-label">Status</div><div class="detail-value">${badge(r.status)}</div></div>

      ${r.notes?`<div class="detail-row"><div class="detail-label">Notes</div><div class="detail-value">${r.notes}</div></div>`:''}`;

    const s = hist.stats || {};
    const tasks = hist.tasks || [];

    const statsHTML = `
      <div class="hist-stat-grid">
        <div class="hist-stat-cell"><div class="hist-stat-num">${s.completed||0}</div><div class="hist-stat-lbl">Completed</div></div>
        <div class="hist-stat-cell"><div class="hist-stat-num">${s.shopping||0}</div><div class="hist-stat-lbl">Shopping</div></div>

      </div>`;

    const taskRows = tasks.length === 0
      ? '<p style="color:var(--gray-4);font-size:13px">No tasks yet.</p>'
      : tasks.map(t => {
          const isDone = t.status === 'complete';
          return `
            <div class="hist-row">
              <div class="hist-row-head" style="cursor:default">
                <div>
                  <div style="font-size:13px;font-weight:600">${t.cycle_title}</div>
                  <div style="font-size:11px;color:var(--gray-4);margin-top:2px">
                    <span style="text-transform:capitalize">${t.task_type}</span>
                    ${t.claimed_at ? '· Claimed ' + fmtDate(t.claimed_at) : ''}

                </div>

                  <span class="badge badge-${t.task_type}" style="font-size:10px">${t.task_type}</span>

                    : `<span style="font-size:12px;color:var(--gray-4);text-transform:capitalize">${t.status}</span>`}
                </div>

            </div>`;

    openDrawer(r.name,
      `<div class="drawer-tabs">
         <div class="drawer-tab active" id="dtab-details" onclick="switchDrawerTab('details','vol')">Details</div>
         <div class="drawer-tab" id="dtab-history" onclick="switchDrawerTab('history','vol')">Task History (${s.total_tasks||0})</div>
       </div>

      `<button class="btn" onclick="openVolunteerForm('${id}')">Edit</button>
       <button class="btn btn-outline" onclick="closeDrawer()">Close</button>`
    );
  } catch(e) { console.error(e); }
}

  try {
    await PUT('/receipts/' + id, { status: 'approved' });
    if (el) el.innerHTML = '<span style="color:#1a8754;font-size:12px">✓ Approved</span>';
    const row = document.getElementById('rrow-' + id);
    if (row) { const badge = row.querySelector('.badge'); if (badge) badge.outerHTML = '<span class="badge badge-approved">approved</span>'; }
  } catch(e) { alert(e.message); renderReceipts(STATE.filter); }
}

async function rejectReceipt(id) {
  const el = document.getElementById('receipt-actions-' + id);
  if (el) el.innerHTML = '<span style="color:var(--gray-4);font-size:12px">Saving…</span>';
  try {

// ── Donations ─────────────────────────────────────────────────────────────────
async function renderDonations(filter) {
  filter = filter || STATE.filter || 'all';
  STATE.filter = filter;
  document.getElementById('topbar-actions').innerHTML =
    `<button class="btn btn-outline" onclick="syncWixDonations()" id="wix-sync-btn">🔄 Sync Wix</button>
     <button class="btn btn-outline" onclick="exportDonations()" style="margin-left:8px">⬇ Export Excel</button>
     <button class="btn" onclick="openDonationForm()" style="margin-left:8px">+ Log Donation</button>`;
  document.getElementById('content').innerHTML = '<p style="color:var(--gray-4)">Loading…</p>';
  try {
    const rows = await GET('/donations');
    const total = rows.reduce((s, r) => s + (r.amount || 0), 0);

    // ── Monthly summary ───────────────────────────────────────────────────────
    const byMonth = {};
    rows.forEach(r => {
      const m = (r.date || '').slice(0, 7);
      if (!m) return;
      if (!byMonth[m]) byMonth[m] = { total: 0, count: 0, recurring: 0, oneTime: 0 };
      byMonth[m].total    += r.amount || 0;
      byMonth[m].count++;
      if (r.frequency === 'monthly') byMonth[m].recurring += r.amount || 0;
      else                           byMonth[m].oneTime   += r.amount || 0;
    });
    const months = Object.keys(byMonth).sort().reverse();
    const monthLabel = iso => {
      const [y, m] = iso.split('-');
      return new Date(+y, +m - 1, 1).toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
    };
    const monthlyCardsHTML = months.length ? `
      <div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;">
        ${months.map(m => {
          const d = byMonth[m];
          const pillsHTML = [
            d.recurring > 0 ? `<span style="display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#e8f5e9;color:#1a5e34;margin-right:4px;margin-top:4px;">Monthly ${fmtMoney(d.recurring)}</span>` : '',
            d.oneTime   > 0 ? `<span style="display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#e0f2f1;color:#00695c;margin-top:4px;">One-time ${fmtMoney(d.oneTime)}</span>` : ''
          ].filter(Boolean).join('');
          return `
          <div style="min-width:150px;background:#fff;border:1.5px solid #e8e8e8;border-radius:10px;padding:12px 14px;flex-shrink:0;">
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#888;margin-bottom:4px;">${monthLabel(m)}</div>
            <div style="font-size:20px;font-weight:800;color:#1a8754;">${fmtMoney(d.total)}</div>
            <div style="font-size:11px;color:#aaa;margin-top:2px;margin-bottom:2px;">${d.count} donation${d.count !== 1 ? 's' : ''}</div>
            ${pillsHTML}
          </div>`;
        }).join('')}
      </div>` : '';

    document.getElementById('content').innerHTML = monthlyCardsHTML + `
      <div class="table-card">
        <div class="table-header">
          <span class="table-title">All Donations <span style="font-size:13px;font-weight:400;color:var(--gray-4)">${fmtMoney(total)} total</span></span>
        </div>
        <table>
          <thead><tr>
            <th>Donor</th><th>Amount</th><th>Type</th><th>Date</th><th>Campaign</th><th></th>
          </tr></thead>
          <tbody>
            ${rows.length ? rows.map(r => `
              <tr>
                <td>
                  <strong>${r.donor_name||'Anonymous'}</strong>
                  ${r.donor_email ? `<br><span style="font-size:11px;color:var(--gray-4)">${r.donor_email}</span>` : ''}
                </td>
                <td><strong>${fmtMoney(r.amount)}</strong></td>
                <td>
                  <span style="font-size:12px;padding:2px 8px;border-radius:10px;background:${r.frequency==='monthly'?'#e8f5e9':'#fff3e0'};color:${r.frequency==='monthly'?'#1a8754':'#e67e22'}">
                    ${r.frequency||'one-time'}
                  </span>
                </td>
                <td style="white-space:nowrap">${fmtDate(r.date)}</td>
                <td style="font-size:12px;color:var(--gray-4)">${r.notes||r.source||'—'}</td>
                <td style="white-space:nowrap">
                  <button class="btn btn-outline" style="padding:4px 10px;font-size:12px;" onclick='openDonationForm(${JSON.stringify(r)})'>Edit</button>
                  <button class="btn btn-outline" style="padding:4px 10px;font-size:12px;color:#c00;border-color:#c00;margin-left:4px" onclick="deleteDonation('${r.id}','${(r.donor_name||'Anonymous').replace(/'/g,"\\'")}')">Delete</button>
                </td>
              </tr>`).join('') :
              '<tr class="empty-row"><td colspan="6">No donations yet — click Sync Wix to import</td></tr>'}
          </tbody>
        </table>
      </div>`;
  } catch(e) {
    document.getElementById('content').innerHTML = `<p style="color:#c00">${e.message}</p>`;
  }
}

async function syncWixDonations() {
  const btn = document.getElementById('wix-sync-btn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Syncing…'; }
  try {
    const res = await POST('/donations/sync-wix', {});
    renderDonations();
    if (btn) { btn.disabled = false; btn.textContent = '🔄 Sync Wix'; }
    if (res.imported > 0) {
      alert(`✅ Synced ${res.imported} new donation${res.imported>1?'s':''} from Wix.${res.skipped_duplicates>0?' ('+res.skipped_duplicates+' already imported)':''}`);
    } else {
      alert(`✓ Already up to date — no new donations found.`);
    }
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = '🔄 Sync Wix'; }
    if (e.message.includes('WIX_API_KEY')) {
      alert('Wix API key not configured.\n\nTo set it up:\n1. Go to wix.com → Account Settings → API Keys\n2. Create a key with eCommerce read permissions\n3. Add WIX_API_KEY=<your key> in Railway Variables\n4. Redeploy');
    } else {
      alert('Sync failed: ' + e.message);
    }
  }
}

function exportDonations() {
  const token = STATE.token;
  const url = '/api/donations/export';
  const a = document.createElement('a');
  a.href = url;
  a.style.display = 'none';
  // Pass auth token via a temporary fetch → blob download
  fetch(url, { headers: { 'Authorization': 'Bearer ' + token } })
    .then(res => {
      if (!res.ok) throw new Error('Export failed');
      return res.blob();
    })
    .then(blob => {
      const blobUrl = URL.createObjectURL(blob);
      a.href = blobUrl;
      const today = new Date().toISOString().slice(0,10).replace(/-/g,'');
      a.download = `sihaa_donations_${today}.xlsx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(blobUrl);
    })
    .catch(e => alert('Export failed: ' + e.message));
}

async function saveDonation(editId) {
  const amount = parseFloat(document.getElementById('don-amount').value);
  const date   = document.getElementById('don-date').value;
  const err    = document.getElementById('don-err');
  err.style.display = 'none';
  if (isNaN(amount) || amount <= 0) { err.textContent = 'Enter a valid amount.'; err.style.display = 'block'; return; }
  if (!date) { err.textContent = 'Date is required.'; err.style.display = 'block'; return; }
  const payload = {
    donor_name:  document.getElementById('don-name').value.trim() || 'Anonymous',
    donor_email: document.getElementById('don-email').value.trim(),
    amount, date,
    frequency: document.getElementById('don-freq').value,
    type:      document.getElementById('don-type').value,
    source:    document.getElementById('don-source').value.trim(),
    notes:     document.getElementById('don-notes').value.trim()
  };
  try {
    if (editId) {
      await PUT('/donations/' + editId, payload);
    } else {
      await POST('/donations', payload);
    }
    closeDrawer();
    renderDonations();
  } catch(e) { err.textContent = e.message; err.style.display = 'block'; }
}

async function deleteDonation(id, name) {

  try {

}

async function bulkCreateUsers(type) {
  const label = type === 'volunteer' ? 'volunteers' : 'families';
  if (!confirm(`Create login accounts for all active ${label} who don't have one yet?\n\nTemp passwords will be shown once — copy them to share.`)) return;
  try {
    const res = await POST('/users/bulk-create', {type});
    if (!res.created.length && !res.skipped.length) {
      alert(`No active ${label} found to create accounts for.`); return;
    }
    let msg = `Created ${res.created.length} account(s)`;
    if (res.skipped.length) msg += `, skipped ${res.skipped.length} (already have accounts)`;
    msg += '.\n\nCredentials (save these now — passwords won\'t be shown again):\n\n';
    msg += res.created.map(u => `${u.name}\n  Username: ${u.username}\n  Temp PW:  ${u.temp_password}`).join('\n\n');
    alert(msg);
    renderUsers();
  } catch(e) { alert(e.message); }
}

  }).catch(() => {

    openDrawer(r.id ? 'Edit User' : 'Add User',
      `<div class="form-group"><label>Name</label><input type="text" id="u-name" value="${r.name||''}"></div>
       <div class="form-group"><label>Username *</label><input type="text" id="u-username" value="${r.username||''}" ${r.id?'readonly':''}></div>
       <div class="form-group"><label>Password</label><input type="password" id="u-password"></div>
       <div class="form-group"><label>Role</label><select id="u-role">
         ${['admin','treasurer','finance','volunteer','family','viewer'].map(v=>`<option value="${v}" ${r.role===v?'selected':''}>${v}</option>`).join('')}
       </select></div>
       <input type="hidden" id="u-linked-id" value="${r.linked_id||''}">
       <input type="hidden" id="u-linked-type" value="${r.linked_type||''}">
       <div class="form-group"><label>Email</label><input type="email" id="u-email" value="${r.email||''}"></div>
       <div class="alert alert-error" id="user-err" style="display:none"></div>`,
      `<button class="btn" onclick="saveUser()">Save</button><button class="btn btn-outline" onclick="closeDrawer()">Cancel</button>`

}

function toggleLinkedField() {
  const role = document.getElementById('u-role')?.value;
  const el = document.getElementById('linked-field');
  if (el) el.style.display = (role === 'volunteer' || role === 'family') ? 'block' : 'none';
}

function updateLinkedType() {
  const sel = document.getElementById('u-linked-id');
  const opt = sel?.selectedOptions?.[0];
  const typeInput = document.getElementById('u-linked-type');
  if (opt && typeInput) typeInput.value = opt.dataset.type || '';
}

async function saveUser() {
  const showErr = msg => {
    const el = document.getElementById('user-err');
    el.textContent = msg; el.style.display = 'block';
  };
  const username = document.getElementById('u-username').value.trim();
  const password = document.getElementById('u-password').value;
  if (!username) return showErr('Username is required');
  const linkedId   = document.getElementById('u-linked-id')?.value || null;
  const linkedType = document.getElementById('u-linked-type')?.value || null;
  const payload = {
    name:        document.getElementById('u-name').value.trim(),
    username,
    role:        document.getElementById('u-role').value,
    email:       document.getElementById('u-email')?.value.trim() || null,
    linked_id:   linkedId || null,
    linked_type: linkedType || null,
  };
  if (password) payload.password = password;
  if (STATE.editId) payload.active = parseInt(document.getElementById('u-active')?.value || 1);
  try {
    let result;
    if (STATE.editId) {
      await PUT('/users/' + STATE.editId, payload);
    } else {
      result = await POST('/users', payload);
      if (result && result.temp_password) {
        alert(`Account created!\n\nUsername: ${result.username}\nTemp Password: ${result.temp_password}\n\nShare these credentials with the user. They will be prompted to set a new password on first login.`);
      }
    }
    closeDrawer();
    renderUsers();
  } catch(e) { showErr(e.message); }
}

async function renderOrders() {
  document.getElementById('content').innerHTML = '<p style="color:var(--gray-4)">Loading…</p>';

  try {
    const cycles = await GET('/delivery-cycles');
    const defaultCycle = cycles.find(c => c.status === 'shopping')
                      || cycles.find(c => c.status === 'open')
                      || cycles.find(c => c.status === 'upcoming') || cycles[0];
    const defaultCycleId = defaultCycle ? defaultCycle.id : null;

    const cycleOptions = cycles.length
      ? cycles.map(c =>
          `<option value="${c.id}" ${c.id === defaultCycleId ? 'selected' : ''}>${c.title} (${c.status})</option>`
        ).join('')
      : '<option value="">No deliveries yet</option>';

    document.getElementById('topbar-actions').innerHTML =
      `<button class="btn" onclick="window.open('/order','_blank')">⇗ Family Order Form</button>`;

    document.getElementById('content').innerHTML = `
      <div class="table-card">
        <div class="table-header">
          <span class="table-title">Food Orders</span>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
            <select id="orders-cycle-select" class="search-input" style="min-width:240px;"
                    onchange="loadOrdersForCycle(this.value)">
              <option value="">— Select a delivery —</option>
              ${cycleOptions}
            </select>
            <button class="btn" id="gen-slots-btn" onclick="generateSlotsForSelected()" style="display:none;">
              Generate Slots
            </button>
          </div>
        </div>
        <div id="orders-table-wrap">
          <p style="padding:24px;color:var(--gray-4);">Select a delivery above to view orders.</p>
        </div>
      </div>`;

    if (defaultCycleId) loadOrdersForCycle(defaultCycleId);
  } catch(e) {
    document.getElementById('content').innerHTML = `<p style="color:#c00">${e.message}</p>`;
  }
}

async function loadOrdersForCycle(cycleId) {
  const wrap = document.getElementById('orders-table-wrap');
  const genBtn = document.getElementById('gen-slots-btn');
  if (!cycleId) { wrap.innerHTML = ''; if(genBtn) genBtn.style.display='none'; return; }

  wrap.innerHTML = '<p style="padding:16px;color:var(--gray-4);">Loading…</p>';

  const [orders, slots] = await Promise.all([
    GET('/delivery-cycles/' + cycleId + '/orders'),
    GET('/volunteer-slots?cycle_id=' + cycleId)
  ]);

  // Show Generate Slots button when slots haven't been made yet
  if (genBtn) genBtn.style.display = slots.length === 0 && orders.length > 0 ? '' : 'none';

  const slotMap = {};
  slots.forEach(s => {
    if (!slotMap[s.family_id]) slotMap[s.family_id] = {};
    slotMap[s.family_id][s.task_type] = s;
  });

  const statusBadge = s => {
    const map = { submitted:'#2e86c1', assigned:'#1a8754', delivered:'#155724', cancelled:'#c0392b' };
    return `<span class="badge" style="background:${map[s]||'#888'};color:#fff;border:none;">${s}</span>`;
  };

  const slotBadge = slot => {
    if (!slot) return `<span style="color:#bbb;font-size:12px;">no slot</span>`;
    const colors = { open:'#e0a800', claimed:'#1a8754', complete:'#155724', cancelled:'#c0392b' };
    const label = (slot.status === 'claimed' || slot.status === 'complete')
      ? `${slot.claimed_by_name || '?'}`
      : slot.status;
    return `<span class="badge" style="background:${colors[slot.status]||'#888'};color:#fff;border:none;font-size:11px;" title="${slot.status}">${label}</span>`;
  };

  if (orders.length === 0) {
    wrap.innerHTML = `
      <div style="padding:32px;text-align:center;color:var(--gray-4);">
        No orders for this delivery yet.<br>
        <a href="/family" target="_blank" style="color:#1a3a2a;font-weight:600;">Open the family order portal →</a>
      </div>`;
    return;
  }

  const rows = orders.map(o => {
    const shop = slotMap[o.family_id]?.shopping;
    const del  = slotMap[o.family_id]?.delivery;
    return `<tr>
      <td><span style="font-family:monospace;font-weight:700;font-size:13px">${o.family_code||'—'}</span></td>
      <td style="color:var(--gray-4);">${o.family_size || '—'}</td>
      <td><span class="badge">${o.bundle_size}</span></td>
      <td>${statusBadge(o.status)}</td>
      <td>${slotBadge(shop)}</td>
      <td>${slotBadge(del)}</td>
    </tr>`;
  }).join('');

  wrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Family ID</th><th>Size</th><th>Bundle</th>
          <th>Status</th><th>Shopper</th><th>Delivery</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="padding:12px 16px;font-size:12px;color:var(--gray-4);border-top:1px solid var(--gray-2);">
      ${orders.length} order${orders.length !== 1 ? 's' : ''} · ${slots.length} slots generated
    </div>`;
}

async function generateSlotsForSelected() {
  const cycleId = document.getElementById('orders-cycle-select').value;
  if (!cycleId) return;
  try {
    const res = await POST('/delivery-cycles/' + cycleId + '/generate-slots', {});
    alert(`${res.slots_created} slots created (${res.total_requests} orders).`);
    loadOrdersForCycle(cycleId);
  } catch(e) { alert('Error: ' + e.message); }
}

                <td><span class="badge ${statusColors[c.status]||'badge-pending'}">${statusLabels[c.status]||c.status}</span></td>
                <td id="conf-${c.id}" style="font-size:12px;color:var(--gray-4)">—</td>
                <td style="white-space:nowrap" onclick="event.stopPropagation()">
                  <button class="btn btn-outline btn-sm" onclick="openCycleForm('${c.id}')">Edit</button>
                  ${c.status === 'upcoming'  ? `<button class="btn btn-sm" style="margin-left:4px;background:#e67e22;color:#fff" onclick="advanceCycleStatus('${c.id}','upcoming')">→ Accepting Orders</button>` : ''}
                  ${c.status === 'open'      ? `<button class="btn btn-sm" style="margin-left:4px;background:#888;color:#fff" onclick="revertCycleStatus('${c.id}','open')">← Upcoming</button>
                                               <button class="btn btn-sm" style="margin-left:4px;background:#2e86c1;color:#fff" onclick="advanceCycleStatus('${c.id}','open')">→ Shopping</button>` : ''}
                  ${c.status === 'shopping'  ? `<button class="btn btn-sm" style="margin-left:4px;background:#888;color:#fff" onclick="revertCycleStatus('${c.id}','shopping')">← Accepting Orders</button>
                                               <button class="btn btn-sm" style="margin-left:4px;background:#1a8754;color:#fff" onclick="advanceCycleStatus('${c.id}','shopping')">→ Delivered</button>` : ''}
                  ${c.status === 'delivered' ? `<button class="btn btn-sm" style="margin-left:4px;background:#888;color:#fff" onclick="revertCycleStatus('${c.id}','delivered')">← Shopping</button>` : ''}
                </td>
              </tr>`).join('') :
              '<tr class="empty-row"><td colspan="5">No deliveries found</td></tr>'}
          </tbody>
        </table>
      </div>`;
    // Load confirmation counts async
    _cyclesCache.forEach(c => loadConfirmationCount(c.id));
  } catch(e) {
    document.getElementById('content').innerHTML = `<p style="color:#c00">${e.message}</p>`;
  }
}

async function loadConfirmationCount(cycleId) {
  try {
    const orders = await GET('/delivery-cycles/' + cycleId + '/orders');
    const total     = orders.length;
    // 'submitted' treated as confirmed (legacy records pre-fix + any edge cases)
    const confirmed = orders.filter(o => ['confirmed','auto_confirmed','submitted'].includes(o.status)).length;
    const skipped   = orders.filter(o => o.status === 'skipped').length;
    const pending   = orders.filter(o => o.status === 'pending_confirmation').length;
    const el = document.getElementById('conf-' + cycleId);
    if (el) el.innerHTML = total
      ? `<span style="color:#1a8754;font-weight:600">${confirmed}/${total}</span> confirmed${skipped ? ` · ${skipped} skip` : ''}${pending ? ` · ${pending} pending` : ''}`
      : `<span style="color:#aaa">0 enrolled</span>`;
  } catch(e) {}
}

async function advanceCycleStatus(id, current) {
  const next  = { upcoming:'open', open:'shopping', shopping:'delivered' };
  const label = { upcoming:'Accepting Orders', open:'Shopping', shopping:'Delivered' };
  const desc  = {
    upcoming: 'Families will be able to log in to My Order and confirm their bundle.',
    open:     'The order window closes. Volunteers will start shopping.',
    shopping: 'Mark this cycle as fully delivered.'
  };
  if (!next[current]) return;
  if (!confirm(`Move to "${label[next[current]]}"?\n\n${desc[current]}`)) return;
  try {
    await PUT('/delivery-cycles/' + id, { status: next[current] });
    // When advancing to Shopping, prompt to generate volunteer slots immediately
    if (next[current] === 'shopping') {
      try {
        const orders = await GET('/delivery-cycles/' + id + '/orders');
        const confirmed = orders.filter(o => ['confirmed','auto_confirmed','submitted'].includes(o.status)).length;
        if (confirmed > 0 && confirm(`${confirmed} confirmed families.\n\nGenerate shopping and delivery slots for them now?`)) {
          const res = await POST('/delivery-cycles/' + id + '/generate-slots', {});
          alert(`Done — ${res.slots_created} slots created for ${confirmed} families.`);
        }
      } catch(_) {}
    }
    renderDeliveries();
  } catch(e) { alert(e.message); }
}

async function revertCycleStatus(id, current) {
  const prev  = { open:'upcoming', shopping:'open', delivered:'shopping' };
  const label = { open:'Upcoming', shopping:'Accepting Orders', delivered:'Shopping' };
  if (!prev[current]) return;
  if (!confirm(`Revert this cycle back to "${label[prev[current]]}"?\n\nThis will undo the status advance.`)) return;
  try {
    await PUT('/delivery-cycles/' + id, { status: prev[current] });
    renderDeliveries();
  } catch(e) { alert(e.message); }
}

async function saveCycle() {
  const showErr = msg => { const el = document.getElementById('cy-err'); el.textContent=msg; el.style.display='block'; };
  const title    = document.getElementById('cy-title').value.trim();
  const delStart = document.getElementById('cy-del-start').value;
  const delEnd   = document.getElementById('cy-del-end').value;
  if (!title || !delStart || !delEnd) return showErr('Title and delivery dates are required');
  const payload  = { title, delivery_date_start: delStart, delivery_date_end: delEnd,
                     notes: document.getElementById('cy-notes').value.trim() };
  const statusEl = document.getElementById('cy-status');
  if (statusEl) payload.status = statusEl.value;
  try {
    const res = STATE.editId
      ? await PUT('/delivery-cycles/' + STATE.editId, payload)
      : await POST('/delivery-cycles', payload);
    if (!STATE.editId && res.enrolled > 0)
      alert(`✅ Delivery created! ${res.enrolled} families auto-enrolled.`);
    closeDrawer(); renderDeliveries();
  } catch(e) { showErr(e.message); }
}

async function viewCycleDetail(cycleId) {

  document.getElementById('topbar-actions').innerHTML =
    `<button class="btn btn-outline" onclick="renderDeliveries()">← Back</button>

     <button class="btn btn-outline" onclick="viewSlotBoard('${cycleId}')">Slot Board</button>

     <button class="btn btn-outline" onclick="downloadPDF('/reports/cycle-summary/${cycleId}')">⬇ Summary PDF</button>

      GET('/delivery-cycles/' + cycleId + '/orders'),

    const noResponse     = orders.filter(o => o.status === 'pending_confirmation').length;

    const confColor  = confirmed  ? 'color:#1a5e34;background:#e8f5e9' : 'color:var(--gray-4);background:var(--gray-1)';
    const skipColor  = skipped    ? 'color:#7a6000;background:#fffbec' : 'color:var(--gray-4);background:var(--gray-1)';
    const nrColor    = noResponse ? 'color:#721c24;background:#f8d7da' : 'color:var(--gray-4);background:var(--gray-1)';

      if (o.status === 'confirmed')           return `<span style="font-size:11px;font-weight:700;padding:2px 8px;background:#e8f5e9;color:#1a5e34">✓ Confirmed</span>`;
      if (o.status === 'skipped')             return `<span style="font-size:11px;font-weight:700;padding:2px 8px;background:#fffbec;color:#7a6000">✗ Declined</span>`;
      if (o.status === 'pending_confirmation') return `<span style="font-size:11px;font-weight:700;padding:2px 8px;background:#f8d7da;color:#721c24">⏳ No Response</span>`;
      return badge(o.status);
    };

    const overrideBtns = o => {

        <button class="btn btn-sm btn-outline" style="font-size:11px;padding:2px 8px" onclick="overrideFoodRequest('${o.id}','skipped','${cycleId}')">✗ Skip</button>`;

        <button class="btn btn-sm" style="font-size:11px;padding:2px 8px;background:#1a5e34;color:#fff" onclick="overrideFoodRequest('${o.id}','confirmed','${cycleId}')">✓ Confirm</button>`;
      // pending_confirmation — show both
      return `
        <button class="btn btn-sm" style="font-size:11px;padding:2px 8px;background:#1a5e34;color:#fff;margin-right:4px" onclick="overrideFoodRequest('${o.id}','confirmed','${cycleId}')">✓ Confirm</button>
        <button class="btn btn-sm btn-outline" style="font-size:11px;padding:2px 8px" onclick="overrideFoodRequest('${o.id}','skipped','${cycleId}')">✗ Skip</button>`;
    };

    document.getElementById('content').innerHTML = `
      <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap">
        <div style="flex:1;min-width:100px;padding:14px 18px;border:1px solid var(--gray-2)">
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--gray-4);margin-bottom:4px">Confirmed</div>
          <div style="font-size:28px;font-weight:700;${confColor.split(';')[0]}">${confirmed}</div>
        </div>
        <div style="flex:1;min-width:100px;padding:14px 18px;border:1px solid var(--gray-2)">
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--gray-4);margin-bottom:4px">Declined</div>
          <div style="font-size:28px;font-weight:700;${skipColor.split(';')[0]}">${skipped}</div>
        </div>
        <div style="flex:1;min-width:100px;padding:14px 18px;border:1px solid var(--gray-2)">
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--gray-4);margin-bottom:4px">No Response</div>
          <div style="font-size:28px;font-weight:700;${nrColor.split(';')[0]}">${noResponse}</div>
        </div>
        <div style="flex:1;min-width:100px;padding:14px 18px;border:1px solid var(--gray-2)">
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--gray-4);margin-bottom:4px">Total Families</div>
          <div style="font-size:28px;font-weight:700">${total}</div>
        </div>
      </div>
      <div class="table-card">
        <div class="table-header"><span class="table-title">Family Responses</span></div>
        <table>
          <thead><tr>
            <th>Family</th><th>Phone</th><th>Bundle</th><th>Response</th><th>Items</th><th>Override</th>
          </tr></thead>
          <tbody>
            ${orders.length ? orders.map(o => `
              <tr id="frow-${o.id}">
                <td><strong>${o.family_name}</strong></td>
                <td style="font-size:12px">${o.family_phone||'—'}</td>
                <td style="font-size:12px">${{S:'Small',M:'Medium',L:'Large'}[o.bundle_size]||o.bundle_size}</td>
                <td>${confStatusBadge(o)}</td>
                <td style="font-size:11px;color:var(--gray-4);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                  ${o.status==='confirmed' && o.selected_items.length ? o.selected_items.map(i=>i.name).join(', ') : '—'}
                </td>
                <td style="white-space:nowrap">${overrideBtns(o)}</td>
              </tr>`).join('') :
              '<tr class="empty-row"><td colspan="6">No families notified yet — notifications send 7 days before delivery</td></tr>'}
          </tbody>
        </table>
      </div>
      ${(() => {
        // ── Volunteer Coverage ─────────────────────────────────────────────────
        const confirmedOrders = orders.filter(o => o.status === 'confirmed');
        if (!confirmedOrders.length) return '';

        // Build slot lookup: family_id → {shopping: slot, delivery: slot}
        const slotMap = {};
        slots.forEach(s => {
          if (!slotMap[s.family_id]) slotMap[s.family_id] = {};
          // Keep the most relevant slot per task type (prefer claimed/confirmed over open)
          const existing = slotMap[s.family_id][s.task_type];
          const rank = {confirmed:3, claimed:2, complete:2, open:1, cancelled:0};
          if (!existing || (rank[s.status]||0) > (rank[existing.status]||0)) {
            slotMap[s.family_id][s.task_type] = s;
          }
        });

        const slotBadge = slot => {
          if (!slot) return '<span style="font-size:11px;font-weight:700;padding:2px 8px;background:#fdecea;color:#c00">⚠ No slot</span>';
          if (slot.status === 'open')      return '<span style="font-size:11px;font-weight:700;padding:2px 8px;background:#fdecea;color:#c00">⚠ Open</span>';
          if (slot.status === 'claimed')   return `<span style="font-size:11px;font-weight:700;padding:2px 8px;background:#fff8e6;color:#7a6000">⏳ ${slot.claimed_by_name||'?'}</span>`;
          if (slot.status === 'confirmed') return `<span style="font-size:11px;font-weight:700;padding:2px 8px;background:#e8f5e9;color:#1a5e34">✓ ${slot.claimed_by_name||'?'}</span>`;
          if (slot.status === 'complete')  return `<span style="font-size:11px;font-weight:700;padding:2px 8px;background:#e8f5e9;color:#1a5e34">✓ Done</span>`;
          return `<span style="font-size:11px;padding:2px 8px;background:var(--gray-1);color:var(--gray-4)">${slot.status}</span>`;
        };

        const needsShopper  = confirmedOrders.filter(o => { const s = slotMap[o.family_id]?.shopping;  return !s || s.status === 'open'; }).length;
        const needsDelivery = confirmedOrders.filter(o => { const s = slotMap[o.family_id]?.delivery; return !s || s.status === 'open'; }).length;

        const summaryParts = [];
        if (needsShopper)  summaryParts.push(`<span style="color:#c00;font-weight:700">${needsShopper}</span> need a shopper`);
        if (needsDelivery) summaryParts.push(`<span style="color:#c00;font-weight:700">${needsDelivery}</span> need a deliverer`);
        const summaryHtml = summaryParts.length
          ? summaryParts.join(' · ')
          : '<span style="color:#1a5e34;font-weight:700">All families have volunteers ✓</span>';

        const rows = confirmedOrders.map(o => {
          const shopSlot = slotMap[o.family_id]?.shopping;
          const delSlot  = slotMap[o.family_id]?.delivery;
          const needsAttn = (!shopSlot || shopSlot.status==='open') || (!delSlot || delSlot.status==='open');
          return `<tr style="${needsAttn ? 'background:#fffaf8' : ''}">
            <td><strong>${o.family_name}</strong><br><span style="font-size:11px;color:var(--gray-4);font-family:monospace">${o.family_code||''}</span></td>
            <td style="font-size:12px">${{S:'Small',M:'Medium',L:'Large'}[o.bundle_size]||o.bundle_size}</td>
            <td>${slotBadge(shopSlot)}</td>
            <td>${slotBadge(delSlot)}</td>
          </tr>`;
        }).join('');

        return `
        <div class="table-card" style="margin-top:16px">
          <div class="table-header">
            <span class="table-title">Volunteer Coverage</span>
            <span style="font-size:12px">${summaryHtml}</span>
          </div>
          <table>
            <thead><tr>
              <th>Family</th><th>Bundle</th><th>Shopper</th><th>Deliverer</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
      })()}`;
  } catch(e) {
    document.getElementById('content').innerHTML = `<p style="color:#c00">${e.message}</p>`;
  }
}

async function overrideFoodRequest(requestId, newStatus, cycleId, fromFamilyId) {
  try {
    await PUT('/food-requests/' + requestId, { status: newStatus });
    if (fromFamilyId) viewFamily(fromFamilyId);
    else viewCycleDetail(cycleId);
  } catch(e) { alert('Failed to update: ' + e.message); }
}

async function manualConfirmFamily(familyId, familyName) {
  if (!confirm(`Manually add ${familyName} to the current cycle as Confirmed?\n\nAll bundle items will be selected by default. You can adjust in the cycle detail view.`)) return;
  try {
    const data = await POST('/families/' + familyId + '/manual-confirm', {});
    alert(`Done — ${familyName} confirmed for "${data.cycle_title}" (${data.bundle_size} bundle).`);
    viewFamily(familyId);
  } catch(e) { alert('Could not add to cycle: ' + e.message); }
}

async function resetFamilyOrder(familyId, familyName) {
  if (!confirm(`Reset ${familyName}'s current order?\n\nFor confirmed orders: clears items and resets back to pending.\nFor cancelled/skipped orders: deletes the record so the family can re-order.\n\nNo notification will be sent to the family.`)) return;
  try {
    await POST('/families/' + familyId + '/reset-order', {});
    viewFamily(familyId);
  } catch(e) { alert('Could not reset order: ' + e.message); }
}

async function adminCancelOrder(familyId, cycleId, familyName) {
  const reason = prompt(`Cancel ${familyName}'s order?\n\nOptional: enter a reason (shown in admin logs). Leave blank to cancel without a reason.`);
  if (reason === null) return; // user hit Cancel on the prompt
  try {
    await POST('/families/' + familyId + '/cancel-order', { cycle_id: cycleId, reason: reason.trim() });
    alert(`Order cancelled. ${familyName} can now place a fresh order for this delivery.`);
    viewFamily(familyId);
  } catch(e) { alert('Could not cancel order: ' + e.message); }
}

async function approveBundleChange(familyId, action, familyName) {
  const label = action === 'approve' ? 'approve' : 'deny';
  if (!confirm(`${label.charAt(0).toUpperCase()+label.slice(1)} bundle size change for ${familyName}?`)) return;
  try {
    const res = await POST('/families/' + familyId + '/approve-bundle-change', { action });
    alert(res.message || (action === 'approve' ? 'Bundle size updated.' : 'Request denied.'));
    viewFamily(familyId);
  } catch(e) { alert('Error: ' + e.message); }
}

// ── Change Requests Inbox ─────────────────────────────────────────────────────
async function renderRequests() {
  document.getElementById('content').innerHTML = '<p style="color:var(--gray-4);padding:20px">Loading…</p>';
  try {
    const [pending, recent] = await Promise.all([
      GET('/admin/change-requests?status=pending'),
      GET('/admin/change-requests?status=all').catch(() => [])
    ]);
    const resolved = recent.filter(r => r.status !== 'pending' && r.status !== 'retracted').slice(0, 20);

    const fmtTs = ts => ts ? new Date(ts + (ts.endsWith('Z')?'':'Z')).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
    const statusBadge = s => ({
      pending:   '<span style="background:#fff8e6;color:#7a4a00;font-size:10px;font-weight:700;padding:2px 7px;">PENDING</span>',
      approved:  '<span style="background:#e8f5ee;color:#1a5e34;font-size:10px;font-weight:700;padding:2px 7px;">APPROVED</span>',
      rejected:  '<span style="background:#fdecea;color:#b00;font-size:10px;font-weight:700;padding:2px 7px;">REJECTED</span>',
      retracted: '<span style="background:#f5f5f5;color:#888;font-size:10px;font-weight:700;padding:2px 7px;">RETRACTED</span>',
    })[s] || s;

    const renderRow = (cr, showActions) => {
      const itemList = (cr.selected_items||[]).map(i => `<span style="display:inline-block;background:#f5f5f5;border-radius:3px;padding:1px 6px;margin:2px;font-size:11px;">${i.name}</span>`).join('');
      return `
        <div style="background:#fff;border:1px solid #eee;border-left:3px solid ${cr.status==='pending'?'#f0c040':cr.status==='approved'?'#1a8754':'#ccc'};padding:14px 16px;margin-bottom:10px;">
          <div style="display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px;">
            <div style="flex:1;min-width:200px;">
              <div style="font-weight:700;font-size:14px;">${cr.family_name} <span style="font-weight:400;font-size:12px;color:#888;font-family:monospace;">${cr.family_code||''}</span></div>
              <div style="font-size:12px;color:#555;margin-top:2px;">${cr.cycle_title} · ${fmtDate(cr.delivery_date_start)}</div>
              <div style="font-size:12px;color:#888;margin-top:2px;">Submitted ${fmtTs(cr.created_at)}</div>
            </div>
            <div>${statusBadge(cr.status)}</div>
          </div>
          ${cr.family_notes ? `<div style="background:#f9f9f9;border-left:2px solid #ddd;padding:6px 10px;font-size:13px;margin-bottom:8px;color:#333;">💬 "${cr.family_notes}"</div>` : ''}
          ${itemList ? `<div style="margin-bottom:8px;"><div style="font-size:11px;color:#888;margin-bottom:4px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;">Requested items:</div>${itemList}</div>` : ''}
          ${cr.admin_notes ? `<div style="background:#f0faf5;border-left:2px solid #1a8754;padding:6px 10px;font-size:12px;color:#1a5e34;margin-bottom:8px;">📝 Admin note: "${cr.admin_notes}"</div>` : ''}
          ${showActions && cr.status === 'pending' ? `
            <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center;">
              <input type="text" id="note-${cr.id}" placeholder="Admin note (optional)" style="flex:1;min-width:200px;border:1px solid #ddd;padding:5px 8px;font-size:12px;font-family:inherit;">
              <button onclick="approveRequest('${cr.id}')" style="background:#1a8754;color:#fff;border:none;padding:6px 16px;font-size:12px;cursor:pointer;font-family:inherit;">✓ Approve</button>
              <button onclick="rejectRequest('${cr.id}')" style="background:#c00;color:#fff;border:none;padding:6px 16px;font-size:12px;cursor:pointer;font-family:inherit;">✕ Reject</button>
              <button onclick="viewFamily('${cr.family_id}')" style="background:none;border:1px solid #ccc;color:#555;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;">View Family →</button>
            </div>` : ''}
        </div>`;
    };

    document.getElementById('content').innerHTML = `
      <div style="max-width:780px;">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">
          <h2 style="font-size:18px;font-weight:800;">Change Requests</h2>
          ${pending.length > 0 ? `<span style="background:#f0c040;color:#7a4a00;font-size:12px;font-weight:700;padding:3px 10px;">${pending.length} pending</span>` : '<span style="background:#e8f5ee;color:#1a8754;font-size:12px;padding:3px 10px;">All clear</span>'}
        </div>

        ${pending.length === 0 ? `
          <div style="background:#f9f9f9;border:1px solid #eee;padding:24px;text-align:center;color:#888;margin-bottom:20px;">
            No pending change requests
          </div>` : pending.map(cr => renderRow(cr, true)).join('')}

        ${resolved.length > 0 ? `
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#aaa;margin:24px 0 10px;">Recent — Resolved</div>
          ${resolved.map(cr => renderRow(cr, false)).join('')}
        ` : ''}
      </div>`;
  } catch(e) {
    document.getElementById('content').innerHTML = `<p style="color:#c00;padding:20px">${e.message}</p>`;
  }
}

async function approveRequest(crId) {
  const note = (document.getElementById('note-' + crId)?.value || '').trim();
  if (!confirm('Approve this change request? The family\'s item selection will be applied automatically.')) return;
  try {
    await POST('/admin/change-requests/' + crId + '/approve', { admin_notes: note });
    renderRequests();
  } catch(e) { alert('Error: ' + e.message); }
}

async function rejectRequest(crId) {
  const note = (document.getElementById('note-' + crId)?.value || '').trim();
  if (!note && !confirm('Reject without adding a note? The family will be notified via WhatsApp.')) return;
  if (!confirm('Reject this change request?')) return;
  try {
    await POST('/admin/change-requests/' + crId + '/reject', { admin_notes: note });
    renderRequests();
  } catch(e) { alert('Error: ' + e.message); }
}

          <div class="table-header">
            <span class="table-title">Shopping Slots</span>

            <span style="font-size:12px;color:var(--gray-4)">${delivery.filter(s=>s.status==='open').length} open · ${delivery.filter(s=>s.status==='claimed').length} claimed</span>

async function loadBundleQtysIntoTable() {
  try {
    const bqs = await GET('/bundle-quantities');
    const map = {};
    bqs.forEach(bq => { map[bq.food_item_id + '_' + bq.bundle_size] = bq.quantity; });
    document.querySelectorAll('td[data-bq]').forEach(td => {
      const val = map[td.getAttribute('data-bq')];
      td.textContent = (val !== undefined && val !== null && val !== '') ? val : '—';
    });
  } catch(e) {}
}
