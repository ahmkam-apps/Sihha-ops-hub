<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sihha — Ops Hub</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  @font-face {
    font-family: 'AreaExtrabold';
    src: url('https://static.wixstatic.com/ufonts/2e5170_b7dd1a41ae7e481ca8d80cdf3858d08b/woff2/file.woff2') format('woff2');
    font-weight: 800; font-style: normal;
  }
  @font-face {
    font-family: 'AreaNormal';
    src: url('https://static.wixstatic.com/ufonts/2e5170_6263df7a2b874b8c9a621cc0eefc5ab8/woff2/file.woff2') format('woff2');
    font-weight: 400; font-style: normal;
  }

  :root {
    --black:   #111111;
    --white:   #ffffff;
    --gray-1:  #f6f6f6;
    --gray-2:  #e8e8e8;
    --gray-3:  #cccccc;
    --gray-4:  #888888;
    --gray-5:  #444444;
    --sidebar-w: 220px;
    --font: 'AreaNormal', Helvetica, Arial, sans-serif;
    --font-head: 'AreaExtrabold', Helvetica, Arial, sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--white);
    color: var(--black);
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── Login ─────────────────────────────────────────────── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--white);
  }
  .login-box {
    width: 360px;
    padding: 48px 40px;
    border: 1.5px solid var(--black);
  }
  .login-logo {
    font-family: var(--font-head);
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.04em;
    margin-bottom: 8px;
  }
  .login-sub {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--gray-4);
    margin-bottom: 36px;
  }
  .login-box label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gray-5);
    margin-bottom: 6px;
  }
  .login-box input {
    width: 100%;
    border: 1.5px solid var(--black);
    padding: 10px 12px;
    font-size: 14px;
    font-family: var(--font);
    outline: none;
    margin-bottom: 20px;
    background: var(--white);
  }
  .login-box input:focus { background: var(--gray-1); }
  .btn-primary {
    width: 100%;
    background: var(--black);
    color: var(--white);
    border: none;
    padding: 12px;
    font-size: 13px;
    font-family: var(--font);
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
  }
  .btn-primary:hover { background: var(--gray-5); }
  .btn-primary:disabled { background: var(--gray-3); cursor: not-allowed; }
  .login-error {
    color: #c00;
    font-size: 12px;
    margin-top: 12px;
    display: none;
  }

  /* ── App Shell ─────────────────────────────────────────── */
  #app { display: none; height: 100vh; }

  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: var(--sidebar-w);
    background: var(--white);
    border-right: 1.5px solid var(--black);
    display: flex;
    flex-direction: column;
    z-index: 100;
    overflow: hidden;
  }
  .sidebar-nav {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .sidebar-nav::-webkit-scrollbar { width: 4px; }
  .sidebar-nav::-webkit-scrollbar-thumb { background: var(--gray-2); }
  .sidebar-logo {
    padding: 24px 20px 20px;
    border-bottom: 1px solid var(--gray-2);
    flex-shrink: 0;
  }
  .sidebar-logo .wordmark {
    font-family: var(--font-head);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.04em;
  }
  .sidebar-logo .tagline {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--gray-4);
    margin-top: 2px;
  }
  .nav-section {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--gray-4);
    padding: 16px 20px 6px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    font-size: 13px;
    cursor: pointer;
    color: var(--gray-5);
    border-left: 3px solid transparent;
    transition: all 0.1s;
  }
  .nav-item:hover { background: var(--gray-1); color: var(--black); }
  .nav-item.active {
    color: var(--black);
    font-weight: 600;
    border-left-color: var(--black);
    background: var(--gray-1);
  }
  .nav-item .icon { font-size: 14px; width: 18px; text-align: center; }
  .sidebar-footer {
    flex-shrink: 0;
    padding: 16px 20px;
    border-top: 1px solid var(--gray-2);
    font-size: 12px;
    color: var(--gray-4);
  }
  .sidebar-user { font-weight: 600; color: var(--black); margin-bottom: 2px; }
  .sidebar-role { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .logout-btn {
    margin-top: 10px;
    font-size: 11px;
    color: var(--gray-4);
    cursor: pointer;
    text-decoration: underline;
  }
  .logout-btn:hover { color: var(--black); }

  .main {
    margin-left: var(--sidebar-w);
    min-height: 100vh;
    background: var(--gray-1);
  }
  .topbar {
    background: var(--white);
    border-bottom: 1px solid var(--gray-2);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar h1 { font-family: var(--font-head); font-size: 18px; font-weight: 800; letter-spacing: -0.04em; }
  .topbar-actions { display: flex; gap: 10px; align-items: center; }

  .content { padding: 28px 32px; }

  /* ── Buttons ────────────────────────────────────────────── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    font-size: 12px;
    font-family: var(--font);
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    border: 1.5px solid var(--black);
    background: var(--black);
    color: var(--white);
  }
  .btn:hover { background: var(--gray-5); border-color: var(--gray-5); }
  .btn-outline {
    background: var(--white);
    color: var(--black);
  }
  .btn-outline:hover { background: var(--gray-1); }
  .btn-sm { padding: 5px 12px; font-size: 11px; }

  /* ── Stats Cards ────────────────────────────────────────── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--white);
    border: 1.5px solid var(--black);
    padding: 20px;
    cursor: pointer;
  }
  .stat-card:hover { background: var(--gray-1); }
  .stat-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--gray-4);
    margin-bottom: 8px;
  }
  .stat-value {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1;
  }
  .stat-sub {
    font-size: 11px;
    color: var(--gray-4);
    margin-top: 4px;
  }

  /* ── Tables ─────────────────────────────────────────────── */
  .table-card {
    background: var(--white);
    border: 1.5px solid var(--black);
  }
  .table-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--gray-2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .table-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .search-input {
    border: 1.5px solid var(--gray-2);
    padding: 7px 12px;
    font-size: 12px;
    font-family: var(--font);
    outline: none;
    width: 220px;
  }
  .search-input:focus { border-color: var(--black); }
  .filter-tabs { display: flex; gap: 0; }
  .filter-tab {
    padding: 6px 14px;
    font-size: 11px;
    font-family: var(--font);
    cursor: pointer;
    border: 1px solid var(--gray-2);
    background: var(--white);
    margin-right: -1px;
    color: var(--gray-5);
  }
  .filter-tab.active {
    background: var(--black);
    color: var(--white);
    border-color: var(--black);
    z-index: 1;
    position: relative;
  }
  .filter-tab:hover:not(.active) { background: var(--gray-1); }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gray-4);
    padding: 10px 16px;
    border-bottom: 1px solid var(--gray-2);
    font-weight: 600;
    background: var(--gray-1);
  }
  td { padding: 12px 16px; border-bottom: 1px solid var(--gray-2); font-size: 13px; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--gray-1); }
  .empty-row td { text-align: center; color: var(--gray-4); padding: 40px; font-size: 13px; }

  /* ── Status Badges ──────────────────────────────────────── */
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 8px;
  }
  .badge-pending  { background: var(--gray-2); color: var(--gray-5); }
  .badge-active   { background: var(--black);  color: var(--white); }
  .badge-inactive { background: var(--gray-1); color: var(--gray-4); border: 1px solid var(--gray-3); }
  .badge-paused   { background: var(--gray-3); color: var(--gray-5); }
  .badge-approved { background: var(--black);  color: var(--white); }
  .badge-rejected { background: #c00;          color: var(--white); }
  .badge-completed{ background: var(--black);  color: var(--white); }

  /* ── Drawer / Slide-in panel ────────────────────────────── */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 200;
  }
  .overlay.open { display: block; }
  .drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 480px;
    background: var(--white);
    border-left: 1.5px solid var(--black);
    z-index: 201;
    transform: translateX(100%);
    transition: transform 0.2s ease;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--gray-2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .drawer-title { font-size: 15px; font-weight: 700; }
  .drawer-close {
    font-size: 20px;
    cursor: pointer;
    color: var(--gray-4);
    line-height: 1;
    padding: 4px;
  }
  .drawer-close:hover { color: var(--black); }
  .drawer-body {
    padding: 24px;
    overflow-y: auto;
    flex: 1;
  }
  .drawer-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--gray-2);
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }

  /* ── Forms ──────────────────────────────────────────────── */
  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gray-5);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    border: 1.5px solid var(--gray-3);
    padding: 10px 12px;
    font-size: 13px;
    font-family: var(--font);
    outline: none;
    background: var(--white);
    color: var(--black);
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { border-color: var(--black); }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-section {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--gray-4);
    margin-bottom: 14px;
    margin-top: 20px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--gray-2);
  }
  .form-section:first-child { margin-top: 0; }

  /* ── Drawer Tabs ─────────────────────────────────────────── */
  .drawer-tabs { display: flex; border-bottom: 2px solid var(--gray-2); margin-bottom: 20px; }
  .drawer-tab {
    padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -2px;
    color: var(--gray-4); text-transform: uppercase; letter-spacing: 0.05em;
  }
  .drawer-tab.active { color: var(--black); border-bottom-color: var(--black); }
  .drawer-pane { display: none; }
  .drawer-pane.active { display: block; }

  /* History rows in drawer */
  .hist-row {
    border: 1px solid var(--gray-2); margin-bottom: 8px; background: var(--white);
  }
  .hist-row-head {
    padding: 10px 14px; display: flex; justify-content: space-between;
    align-items: center; cursor: pointer; gap: 8px;
  }
  .hist-row-head:hover { background: var(--gray-1); }
  .hist-row-body { padding: 0 14px 12px; font-size: 12px; display: none; }
  .hist-row-body.open { display: block; }
  .hist-items { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .hist-item-chip {
    background: var(--gray-1); border: 1px solid var(--gray-2);
    padding: 2px 8px; font-size: 11px; border-radius: 2px;
  }
  .hist-stat-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px;
  }
  .hist-stat-cell {
    border: 1px solid var(--gray-2); padding: 10px; text-align: center; background: var(--white);
  }
  .hist-stat-num { font-family: var(--font-head); font-size: 22px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; }
  .hist-stat-lbl { font-size: 10px; color: var(--gray-4); text-transform: uppercase;
                   letter-spacing: 0.05em; margin-top: 3px; }

  /* ── Detail Panel ───────────────────────────────────────── */
  .detail-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    align-items: flex-start;
  }
  .detail-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gray-4);
    width: 130px;
    flex-shrink: 0;
    padding-top: 2px;
    font-weight: 600;
  }
  .detail-value { font-size: 13px; flex: 1; }

  /* ── Alert ───────────────────────────────────────────────── */
  .alert {
    padding: 10px 16px;
    font-size: 12px;
    margin-bottom: 16px;
    display: none;
  }
  .alert-error { background: #fff0f0; border: 1px solid #fcc; color: #c00; }
  .alert-success { background: #f0fff4; border: 1px solid #9f9; color: #060; }

  /* ── Responsive ─────────────────────────────────────────── */
  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .main { margin-left: 0; }
    .drawer { width: 100%; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<!-- ── Login Screen ────────────────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">sihha</div>
    <div class="login-sub">Operations Hub</div>
    <label>Username</label>
    <input type="text" id="login-user" autocomplete="username" placeholder="username">
    <label>Password</label>
    <input type="password" id="login-pass" autocomplete="current-password" placeholder="••••••••">
    <button class="btn-primary" id="login-btn" onclick="doLogin()">Sign In</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ── App Shell ───────────────────────────────────────────────────────────── -->
<div id="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="wordmark">sihha</div>
      <div class="tagline">Operations Hub</div>
    </div>

    <div class="sidebar-nav">
      <div class="nav-section">Operations</div>
      <div class="nav-item active" onclick="nav('dashboard')" id="nav-dashboard">
        <span class="icon">◈</span> Dashboard
      </div>
      <div class="nav-item" onclick="nav('deliveries')" id="nav-deliveries">
        <span class="icon">↻</span> Deliveries
      </div>
      <div class="nav-item" onclick="nav('families')" id="nav-families">
        <span class="icon">⌂</span> Families
      </div>
      <div class="nav-item" onclick="nav('volunteers')" id="nav-volunteers">
        <span class="icon">◎</span> Volunteers
      </div>

      <div class="nav-section">Finance</div>
      <div class="nav-item" onclick="nav('payments')" id="nav-payments">
        <span class="icon">◫</span> Payments
      </div>
      <div class="nav-item" onclick="nav('donations')" id="nav-donations">
        <span class="icon">♦</span> Donations
      </div>

      <div class="nav-section" id="nav-section-admin" style="display:none">Settings</div>
      <div class="nav-item" onclick="nav('catalog')" id="nav-catalog" style="display:none">
        <span class="icon">☰</span> Food Catalog
      </div>
      <div class="nav-item" onclick="nav('users')" id="nav-users" style="display:none">
        <span class="icon">◉</span> Users
      </div>

      <div class="nav-section">Public Links</div>
      <div class="nav-item" onclick="window.open('/order','_blank')" style="font-size:12px;">
        <span class="icon">⇗</span> Family Order Form
      </div>
      <div class="nav-item" onclick="window.open('/intake','_blank')" style="font-size:12px;">
        <span class="icon">⇗</span> Family Registration
      </div>
      <div class="nav-item" onclick="window.open('/portal','_blank')" style="font-size:12px;">
        <span class="icon">⇗</span> Volunteer Portal
      </div>
    </div><!-- /sidebar-nav -->

    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebar-username"></div>
      <div class="sidebar-role" id="sidebar-role"></div>
      <div class="logout-btn" onclick="doLogout()">Sign out</div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <h1 id="page-title">Dashboard</h1>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- ── Drawer ──────────────────────────────────────────────────────────────── -->
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="drawer-title" id="drawer-title">—</div>
    <div class="drawer-close" onclick="closeDrawer()">✕</div>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-footer" id="drawer-footer"></div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let STATE = { token: null, user: null, page: 'dashboard', filter: 'all', editId: null };

// ── API ───────────────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json' }
  };
  if (STATE.token) opts.headers['Authorization'] = 'Bearer ' + STATE.token;
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch('/api' + path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}
const GET  = (p)    => api('GET', p);
const POST = (p, b) => api('POST', p, b);
const PUT  = (p, b) => api('PUT', p, b);
const DEL  = (p)    => api('DELETE', p);

// ── Auth ──────────────────────────────────────────────────────────────────────
async function doLogin() {
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  const err  = document.getElementById('login-error');
  const btn  = document.getElementById('login-btn');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const res = await POST('/auth/login', { username: user, password: pass });
    STATE.token = res.token;
    STATE.user  = res.user;
    localStorage.setItem('sihaa_token', res.token);
    showApp();
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}

async function doLogout() {
  try { await POST('/auth/logout', {}); } catch(e) {}
  STATE.token = null; STATE.user = null;
  localStorage.removeItem('sihaa_token');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

async function checkSession() {
  const token = localStorage.getItem('sihaa_token');
  if (!token) return;
  try {
    STATE.token = token;
    STATE.user  = await GET('/auth/me');
    showApp();
  } catch(e) {
    localStorage.removeItem('sihaa_token');
    STATE.token = null;
  }
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('sidebar-username').textContent = STATE.user.name || STATE.user.username;
  document.getElementById('sidebar-role').textContent = STATE.user.role;
  if (STATE.user.role === 'admin') {
    document.getElementById('nav-section-admin').style.display = '';
    document.getElementById('nav-catalog').style.display = '';
    document.getElementById('nav-users').style.display = '';
  }
  // Treasurer: show only Finance section
  if (STATE.user.role === 'treasurer') {
    ['nav-dashboard','nav-deliveries','nav-volunteers',
     'nav-families'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });
    nav('payments');
    return;
  }
  nav('dashboard');
}

// ── Navigation ────────────────────────────────────────────────────────────────
function nav(page) {
  STATE.page = page; STATE.filter = 'all'; STATE.editId = null;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-' + page);
  if (navEl) navEl.classList.add('active');
  const titles = {
    dashboard: 'Dashboard', families: 'Families', volunteers: 'Volunteers',
    payments: 'Payments', donations: 'Donations', users: 'Users',
    deliveries: 'Deliveries', catalog: 'Food Catalog',
    cycle_detail: 'Delivery Detail', orders: 'Food Orders'
  };
  document.getElementById('page-title').textContent = titles[page] || page;
  closeDrawer();
  const renders = {
    dashboard: renderDashboard, families: renderFamilies,
    volunteers: renderVolunteers,
    payments: renderPayments, donations: renderDonations,
    users: renderUsers, deliveries: renderDeliveries, catalog: renderCatalog,
    orders: renderOrders
  };
  if (renders[page]) renders[page]();
}

// ── Drawer ────────────────────────────────────────────────────────────────────
function openDrawer(title, bodyHTML, footerHTML) {
  document.getElementById('drawer-title').textContent = title;
  document.getElementById('drawer-body').innerHTML = bodyHTML;
  document.getElementById('drawer-footer').innerHTML = footerHTML || '';
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
  STATE.editId = null;
}

// ── Badge ─────────────────────────────────────────────────────────────────────
function badge(status) {
  return `<span class="badge badge-${status}">${status}</span>`;
}
function fmtDate(s) {
  if (!s) return '—';
  return s.slice(0,10);
}
function fmtMoney(n) {
  if (n === null || n === undefined) return '—';
  const num = Number(n);
  if (num === 0) return '$0';
  // Drop cents if the value is a whole number
  return num % 1 === 0
    ? '$' + num.toLocaleString('en-US')
    : '$' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function downloadPDF(path) {
  // Open PDF in a new tab — browser will show it inline or prompt download
  const url = '/api' + path;
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  // Add auth token as query param since we can't set headers on a direct link
  a.href = url + (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(STATE.token);
  a.click();
}

    const donationsHTML = `

            <span style="font-size:11px;color:#888;display:flex;align-items:center;gap:5px;"><span style="display:inline-block;width:14px;height:2px;background:#1a8754;"></span>Actual</span>
            <span style="font-size:11px;color:#888;display:flex;align-items:center;gap:5px;"><span style="display:inline-block;width:14px;height:2px;border-top:2px dashed #2e86c1;"></span>Projected</span>

        <!-- Projection calculator (always visible below charts) -->
        <div style="margin-top:20px;padding-top:16px;border-top:1.5px solid #f0f0f0;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;">
            <div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.6px;">Projection calculator</div>
            <div style="font-size:11px;color:#888;" id="proj-basis-label"></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;">
            <div style="display:flex;flex-direction:column;gap:12px;">
              <div>
                <div style="display:flex;justify-content:space-between;margin-bottom:4px;">

            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;" id="proj-results"></div>
          </div>

    // ── Projection model: avg new donors/month × avg gift (last 3 months) ───
    const histLabels  = dm.map(m => mLabel(m.month));
    const histRecur   = dm.map(m => m.recurring || 0);
    const histOneTime = dm.map(m => m.one_time   || 0);
    const histTotals  = dm.map(m => m.total      || 0);
    const lastTotal   = histTotals.length ? histTotals[histTotals.length - 1] : 0;

    const avgNewDonorsPerMonth = s.proj_avg_donors_per_month || 0;
    const avgDonationPerDonor  = s.proj_avg_gift             || 0;
    const avgMonthly           = s.proj_avg_monthly          || 0;
    const monthlyTrend         = s.proj_monthly_trend        || 0; // $ change per month
    const currentRecurBase     = lastTotal;

    document.getElementById('content').innerHTML = cycleHTML + attentionHTML + statsHTML + donationsHTML;

    // ── Draw charts ──────────────────────────────────────────────────────────
    if (typeof Chart !== 'undefined') {
      const isDark  = window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches;
      const gridCol = isDark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.05)';
      const tickCol = isDark ? '#999' : '#888';

      const maxY = Math.max(DONATION_GOAL * 1.25, ...histTotals);
      const yMax = Math.ceil(maxY / 200) * 200;

      const goalLinePlugin = {
        id: 'goalLine',
        afterDraw(chart) {
          const {ctx, chartArea:{left,right}, scales:{y}} = chart;
          const yPos = y.getPixelForValue(DONATION_GOAL);
          ctx.save();
          ctx.beginPath(); ctx.setLineDash([6,4]);
          ctx.strokeStyle='#e0a800'; ctx.lineWidth=2;
          ctx.moveTo(left,yPos); ctx.lineTo(right,yPos); ctx.stroke();
          ctx.setLineDash([]);
          const lbl = 'Goal ' + fmtMoney(DONATION_GOAL);
          const lw  = ctx.measureText(lbl).width + 12;
          ctx.fillStyle = isDark ? '#2a2200' : '#fffbec';
          ctx.fillRect(right - lw, yPos - 10, lw, 18);
          ctx.fillStyle = '#b8860b'; ctx.font = 'bold 10px sans-serif';
          ctx.textAlign = 'right';
          ctx.fillText(lbl, right - 4, yPos + 4);
          ctx.restore();
        }
      };

      const yScaleOpts = {
        min: 0, max: yMax,
        grid: { color: gridCol },
        border: { display: false },
        ticks: { color: tickCol, font: { size: 11 }, stepSize: 200, callback: v => '$' + v.toLocaleString() }
      };

      // ── Bar chart (tab 1) ─────────────────────────────────────────────────
      if (window._dashBarChart) { window._dashBarChart.destroy(); }
      const barCanvas = document.getElementById('dash-bar-chart');
      if (barCanvas) {
        window._dashBarChart = new Chart(barCanvas.getContext('2d'), {
          type: 'bar',
          data: {
            labels: histLabels,
            datasets: [
              { label:'Recurring', data:histRecur,   backgroundColor:'#1a8754', stack:'don', barThickness:28, borderRadius:{topLeft:3,topRight:3} },
              { label:'One-time',  data:histOneTime, backgroundColor:'#b2dfdb', stack:'don', barThickness:28, borderRadius:{topLeft:3,topRight:3} }
            ]
          },
          options: {
            responsive:true, maintainAspectRatio:false,
            interaction:{ mode:'index', intersect:false },
            plugins:{ legend:{display:false}, tooltip:{ callbacks:{ footer: items => 'Total: '+fmtMoney(items.reduce((s,i)=>s+i.parsed.y,0)) } } },
            scales:{ x:{ stacked:true, grid:{display:false}, ticks:{color:tickCol,font:{size:11}} }, y:{ stacked:true, ...yScaleOpts } }
          },
          plugins: [goalLinePlugin]
        });
      }

      // ── Line chart (tab 2) ────────────────────────────────────────────────
      // Only use months that have actual donation data (skip empty months)
      const activeDm      = dm.filter(m => (m.total || 0) > 0);
      const lineHistLabels = activeDm.map(m => mLabel(m.month));
      const lineHistTotals = activeDm.map(m => m.total || 0);
      const lineLastTotal  = lineHistTotals.length ? lineHistTotals[lineHistTotals.length - 1] : 0;

      // Projection: last actual total + observed monthly trend × months ahead
      // Monthly trend = avg month-over-month $ change from last 3 months
      // This follows actual momentum rather than compounding donor counts
      const projLabels = [];
      const projVals   = [];
      if (activeDm.length) {
        const lastDate = new Date(activeDm[activeDm.length-1].month + '-01');
        for (let i = 1; i <= 6; i++) {
          const d = new Date(lastDate.getFullYear(), lastDate.getMonth() + i, 1);
          projLabels.push(d.toLocaleDateString('en-US', {month:'short'}));
          // Floor at 0, cap projection growth to be reasonable
          const projected = Math.max(0, Math.round(lineLastTotal + monthlyTrend * i));
          projVals.push(projected);
        }
      }

      // Build parallel arrays: actual has nulls where proj is, and vice versa
      // Bridge: both share the last actual point so lines connect
      const allLineLabels = [...lineHistLabels, ...projLabels];
      const actualData    = [
        ...lineHistTotals,
        ...Array(projLabels.length).fill(null)
      ];
      const projData = [
        ...Array(lineHistLabels.length - 1).fill(null),
        lineLastTotal,          // bridge — same as last actual point
        ...projVals
      ];

      // Average line across actual months only
      const avgVal = lineHistTotals.length
        ? Math.round(lineHistTotals.reduce((a,b) => a+b, 0) / lineHistTotals.length)
        : 0;

      const avgLinePlugin = {
        id: 'avgLine',
        afterDraw(chart) {
          if (!avgVal) return;
          const {ctx, chartArea:{left, right}, scales:{y}} = chart;
          const yPos = y.getPixelForValue(avgVal);
          ctx.save();
          ctx.beginPath(); ctx.setLineDash([3, 3]);
          ctx.strokeStyle = '#9b59b6'; ctx.lineWidth = 1.5;
          ctx.moveTo(left, yPos); ctx.lineTo(right, yPos); ctx.stroke();
          ctx.setLineDash([]);
          const lbl = 'Avg ' + fmtMoney(avgVal);
          const lw  = ctx.measureText(lbl).width + 10;
          ctx.fillStyle = isDark ? '#2d1a3a' : '#f5eeff';
          ctx.fillRect(left, yPos - 10, lw, 18);
          ctx.fillStyle = '#7d3c98'; ctx.font = 'bold 10px sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(lbl, left + 4, yPos + 4);
          ctx.restore();
        }
      };

      if (window._dashLineChart) { window._dashLineChart.destroy(); }
      const lineCanvas = document.getElementById('dash-line-chart');
      if (lineCanvas) {
        window._dashLineChart = new Chart(lineCanvas.getContext('2d'), {
          type: 'line',
          data: {
            labels: allLineLabels,
            datasets: [
              {
                label: 'Actual',
                data: actualData,
                borderColor: '#1a8754', borderWidth: 2.5,
                backgroundColor: 'rgba(26,135,84,0.07)',
                fill: true,
                pointBackgroundColor: '#1a8754',
                pointRadius: 5, pointHoverRadius: 7,
                tension: 0.3,
                spanGaps: false,
              },
              {
                label: 'Projected',
                data: projData,
                borderColor: '#2e86c1', borderDash: [6, 4], borderWidth: 2,
                backgroundColor: 'rgba(46,134,193,0.05)',
                fill: true,
                pointBackgroundColor: '#2e86c1',
                pointRadius: ctx => projData[ctx.dataIndex] !== null && ctx.dataIndex >= lineHistLabels.length ? 4 : 0,
                pointHoverRadius: 6,
                tension: 0.3,
                spanGaps: false,
              }
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: ctx => ctx.raw === null ? null : ctx.dataset.label + ': ' + fmtMoney(ctx.raw)
                }
              }
            },
            scales: {
              x: { grid: { display: false }, ticks: { color: tickCol, font: { size: 11 } } },
              y: { ...yScaleOpts }
            }
          },
          plugins: [goalLinePlugin, avgLinePlugin]
        });
      }
    }

    // ── Projection calculator ────────────────────────────────────────────────
    window._dashDonationsCurrent  = s.donations_month || 0;
    window._dashAvgDonorGift      = Math.round(avgDonationPerDonor);
    window._dashAvgNewDonors      = avgNewDonorsPerMonth;
    window._dashMonthlyTrend      = monthlyTrend;
    window._dashAvgMonthly        = Math.round(avgMonthly);
    updateDashProjection();

  } catch(e) {
    document.getElementById('content').innerHTML = `<p style="color:#c00">${e.message}</p>`;
  }
}

function updateDashProjection() {
  const families = parseInt(document.getElementById('proj-fam')?.value  || 5);
  const cost     = parseInt(document.getElementById('proj-cost')?.value || 100);
  const cycles   = parseInt(document.getElementById('proj-cyc')?.value  || 2);
  const current      = window._dashDonationsCurrent || 0;
  const avgGift      = window._dashAvgDonorGift     || 0;
  const avgNew       = window._dashAvgNewDonors     || 0;
  const monthlyTrend = window._dashMonthlyTrend     || 0;
  const avgMonthly   = window._dashAvgMonthly       || 0;

  const fv = document.getElementById('proj-fam-val');
  const cv = document.getElementById('proj-cost-val');
  const yv = document.getElementById('proj-cyc-val');
  if (fv) fv.textContent = families;
  if (cv) cv.textContent = '$' + cost;
  if (yv) yv.textContent = cycles;

  // Show projection basis
  const basisEl = document.getElementById('proj-basis-label');
  if (basisEl) {
    const trendStr = monthlyTrend >= 0
      ? `+${fmtMoney(monthlyTrend)}/mo trend`
      : `${fmtMoney(monthlyTrend)}/mo trend`;
    basisEl.textContent = avgNew > 0
      ? `3-mo avg: ${avgNew} donors · ${fmtMoney(avgGift)} avg gift · ${trendStr}`
      : 'Based on last 3 months of donations';
  }

  const monthlyNeed = families * cost * cycles;
  const annualNeed  = monthlyNeed * 12;
  const gap         = Math.max(0, monthlyNeed - current);
  const coverPct    = Math.min(100, Math.round(current / monthlyNeed * 100));

  // Months to close gap at current trend rate
  let monthsToClose = '—';
  if (gap === 0) {
    monthsToClose = 'Now';
  } else if (monthlyTrend > 0) {
    monthsToClose = Math.ceil(gap / monthlyTrend) + ' mo';
  }

  // New donors needed to close gap at avg gift
  const donorsNeeded = (gap > 0 && avgGift > 0) ? Math.ceil(gap / avgGift) : 0;

  const gapClass   = gap === 0 ? '#f0faf5' : coverPct >= 60 ? '#fffbec' : '#fff5f5';
  const gapTextCol = gap === 0 ? '#1a8754' : coverPct >= 60 ? '#b8860b' : '#c0392b';

  const el = document.getElementById('proj-results');
  if (!el) return;
  el.innerHTML = `
    <div style="background:#f7f7f7;border-radius:8px;padding:10px 12px;">
      <div style="font-size:10px;color:#888;margin-bottom:3px;">Monthly need</div>
      <div style="font-size:18px;font-weight:700;color:#111;">${fmtMoney(monthlyNeed)}</div>
      <div style="font-size:10px;color:#888;margin-top:2px;">${families} fam × $${cost} × ${cycles} cycles</div>
    </div>
    <div style="background:#f7f7f7;border-radius:8px;padding:10px 12px;">
      <div style="font-size:10px;color:#888;margin-bottom:3px;">Annual need</div>
      <div style="font-size:18px;font-weight:700;color:#111;">${fmtMoney(annualNeed)}</div>
      <div style="font-size:10px;color:#888;margin-top:2px;">across 12 months</div>
    </div>
    <div style="background:${gapClass};border-radius:8px;padding:10px 12px;">
      <div style="font-size:10px;color:${gapTextCol};margin-bottom:3px;">Funding gap</div>
      <div style="font-size:18px;font-weight:700;color:${gapTextCol};">${gap===0?'✓ Covered':fmtMoney(gap)+'/mo'}</div>
      <div style="font-size:10px;color:#888;margin-top:2px;">${coverPct}% funded · closes in ${monthsToClose}</div>
    </div>
    <div style="background:#f7f7f7;border-radius:8px;padding:10px 12px;">
      <div style="font-size:10px;color:#888;margin-bottom:3px;">Recurring donors needed</div>
      <div style="font-size:18px;font-weight:700;color:#111;">${gap===0?'0':donorsNeeded}</div>
      <div style="font-size:10px;color:#888;margin-top:2px;">${gap===0?'fully funded':'at '+fmtMoney(avgGift||50)+'/mo avg to close gap'}</div>
    </div>`;
}

function fmtDateShort(iso) {
  if (!iso) return '—';
  const d = new Date(iso.includes('T') ? iso : iso + 'T12:00:00');
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
}

        ${row('Address',       inp('address',       r.address),       true)}
        ${row('Dietary Notes', inp('dietary_notes', r.dietary_notes), true)}
        ${row('Notes',
          `<textarea style="width:100%;border:none;border-bottom:1px solid var(--gray-2);padding:4px 0;font-size:13px;font-family:var(--font-body);background:transparent;outline:none;resize:vertical;min-height:56px;"
             onfocus="this.style.borderBottomColor='var(--black)'"
             onblur="this.style.borderBottomColor='var(--gray-2)';famSaveField('${fid}','notes',this.value)"
           >${r.notes||''}</textarea>`, true)}
      </div>`;

    // ── Delivery history ──────────────────────────────────────────────────────
    const deliverySection = `
      <div style="font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--gray-4);font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--gray-2);">
        Delivery History (${orders.length})
      </div>
      ${orders.length === 0
        ? '<p style="color:var(--gray-4);font-size:13px;padding:8px 0;">No deliveries yet.</p>'
        : orders.map(o => {
            const delivered   = !!o.delivered_at;
            const statusColor = delivered ? '#1a7a3c' : '#888';
            const statusText  = delivered
              ? `✓ Delivered ${fmtDate(o.delivered_at)}`
              : (o.status || 'pending');
            const activeTT = taskTypes.filter(t => t.is_active);
            const cols     = Math.min(activeTT.length, 3);
            return `
              <div style="border:1px solid var(--gray-2);margin-bottom:10px;padding:14px;">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
                  <div style="font-size:13px;font-weight:700;">${o.cycle_title}</div>
                  <div style="font-size:12px;font-weight:600;color:${statusColor};">${statusText}</div>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:12px;color:var(--gray-5);margin-bottom:8px;">
                  <div><span style="color:var(--gray-4);">Bundle:</span> ${o.bundle_size||'—'}</div>
                  <div><span style="color:var(--gray-4);">Items:</span> ${o.selected_items?.length||0}</div>
                </div>
                <div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:6px;font-size:12px;">
                  ${activeTT.map(tt => slotBox(o.slots||[], tt.slug, tt.label, vols, id, o.cycle_id)).join('')}
                </div>
                ${o.selected_items?.length ? `
                <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:5px;">
                  ${o.selected_items.map(i => `<span class="hist-item-chip">${i.name}</span>`).join('')}
                </div>` : ''}
              </div>`;
          }).join('')
      }`;

    openDrawer(r.name,
      infoBar + deliverySection,
      `<button class="btn btn-outline" onclick="closeDrawer()">Close</button>`
    );
  } catch(e) { console.error(e); }
}

function toggleHistRow(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

function switchDrawerTab(tab, context) {
  // Toggle tab active state
  document.querySelectorAll('.drawer-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('dtab-' + tab)?.classList.add('active');
  // Toggle pane visibility
  document.querySelectorAll('.drawer-pane').forEach(p => p.classList.remove('active'));
  document.getElementById('dpane-' + tab)?.classList.add('active');
}

// ── Volunteers ────────────────────────────────────────────────────────────────
async function renderVolunteers(filter, search) {
  filter = filter || STATE.filter || 'all';
  STATE.filter = filter;
  document.getElementById('topbar-actions').innerHTML = `
    <button class="btn btn-outline" onclick="renderTaskTypes()" style="margin-right:8px;">⚙ Task Types</button>
    <button class="btn" onclick="openVolunteerForm()">+ Add Volunteer</button>`;

  let url = '/volunteers';
  const params = [];
  if (filter !== 'all') params.push('status=' + filter);
  if (search) params.push('search=' + encodeURIComponent(search));
  if (params.length) url += '?' + params.join('&');

  document.getElementById('content').innerHTML = '<p style="color:var(--gray-4)">Loading…</p>';
  try {
    const rows = await GET(url);
    document.getElementById('content').innerHTML = `
      <div class="table-card">
        <div class="table-header">
          <span class="table-title">All Volunteers</span>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <input class="search-input" placeholder="Search name, phone, email…"
              id="vol-search" value="${search||''}"
              oninput="renderVolunteers('${filter}', this.value)">
            <div class="filter-tabs">
              ${['all','pending','active','inactive'].map(f =>
                `<div class="filter-tab ${filter===f?'active':''}"
                  onclick="renderVolunteers('${f}', document.getElementById('vol-search').value)">${f}</div>`
              ).join('')}
            </div>
          </div>
        </div>
        <table>
          <thead><tr>
            <th>Name</th><th>Phone</th><th>Email</th><th>Role</th>
            <th>Status</th><th>Added</th><th></th>
          </tr></thead>
          <tbody>
            ${rows.length ? rows.map(r => `
              <tr id="vrow-${r.id}">
                <td><strong>${r.name}</strong></td>
                <td>${r.phone||'—'}</td>
                <td>${r.email||'—'}</td>
                <td><span style="font-size:11px;text-transform:capitalize">${r.role||'—'}</span></td>
                <td>${badge(r.status)}</td>
                <td style="font-size:11px;color:var(--gray-4)">${fmtDate(r.created_at)}</td>
                <td style="white-space:nowrap">
                  ${r.status==='pending' ? `
                    <button class="btn btn-sm" style="background:#1a8754;color:#fff" onclick="quickStatusVolunteer('${r.id}','active')">✓ Approve</button>
                    <button class="btn btn-sm btn-outline" style="color:#c00;border-color:#c00;margin-left:4px" onclick="quickStatusVolunteer('${r.id}','inactive')">✗</button>
                  ` : `
                    <button class="btn btn-outline btn-sm" onclick="viewVolunteer('${r.id}')">View</button>
                    <button class="btn btn-sm" onclick="openVolunteerForm('${r.id}')" style="margin-left:4px">Edit</button>
                  `}
                </td>
              </tr>`).join('') :
              '<tr class="empty-row"><td colspan="7">No volunteers found</td></tr>'}
          </tbody>
        </table>
      </div>`;
  } catch(e) {
    document.getElementById('content').innerHTML = `<p style="color:#c00">${e.message}</p>`;
  }
}

async function renderTaskTypes() {

    const types = await GET('/task-types');

        <table>
          <thead><tr><th>Label</th><th>Slug</th><th>Order</th><th>Status</th><th></th></tr></thead>

              <tr id="tt-${t.slug}">

                    style="border:none;border-bottom:1px solid var(--gray-2);font-size:13px;font-family:var(--font-body);background:transparent;width:120px;outline:none;"
                    onfocus="this.style.borderBottomColor='var(--black)'"
                    onblur="this.style.borderBottomColor='var(--gray-2)'">
                </td>

                <td>

async function addTaskType() {
  const inp = document.getElementById('new-tt-label');
  const label = inp.value.trim();
  if (!label) return;
  try {
    await POST('/task-types', { label });
    inp.value = '';
    renderTaskTypes();
  } catch(e) { alert(e.message); }
}

async function saveTaskType(slug) {
  const label = document.getElementById('tt-label-' + slug)?.value.trim();
  const order = parseInt(document.getElementById('tt-order-' + slug)?.value) || 0;
  if (!label) return;
  try {
    await PUT('/task-types/' + slug, { label, display_order: order });
    renderTaskTypes();
  } catch(e) { alert(e.message); }
}

async function toggleTaskType(slug, newActive) {
  try {
    await PUT('/task-types/' + slug, { is_active: newActive });
    renderTaskTypes();
  } catch(e) { alert(e.message); }
}

async function quickStatusVolunteer(id, status) {
  const row = document.getElementById('vrow-' + id);
  if (row) row.style.opacity = '0.4';
  try {
    await PUT('/volunteers/' + id, { status });
    renderVolunteers(STATE.filter, document.getElementById('vol-search')?.value);
  } catch(e) {
    if (row) row.style.opacity = '1';
    alert(e.message);
  }
}

async function openVolunteerForm(id) {
  STATE.editId = id || null;
  let r = {};
  if (id) {
    try { r = await GET('/volunteers/' + id); } catch(e) {}
  }
  openDrawer(
    id ? 'Edit Volunteer' : 'Add Volunteer',
    volunteerFormHTML(r),
    `<button class="btn" onclick="saveVolunteer()">Save</button>
     <button class="btn btn-outline" onclick="closeDrawer()">Cancel</button>`
  );
}

async function saveVolunteer() {
  const showErr = msg => {
    const el = document.getElementById('vol-form-err');
    el.textContent = msg; el.style.display = 'block';
  };
  const name = document.getElementById('v-name').value.trim();
  if (!name) return showErr('Name is required');
  const payload = {
    name, phone: document.getElementById('v-phone').value.trim(),
    email: document.getElementById('v-email').value.trim(),
    role: document.getElementById('v-role').value,
    status: document.getElementById('v-status').value,
    notes: document.getElementById('v-notes').value.trim(),
    wa_phone: document.getElementById('v-wa-phone').value.trim(),
    wa_apikey: document.getElementById('v-wa-apikey').value.trim()
  };
  try {
    if (STATE.editId) await PUT('/volunteers/' + STATE.editId, payload);
    else await POST('/volunteers', payload);
    closeDrawer();
    renderVolunteers(STATE.filter);
  } catch(e) { showErr(e.message); }
}

async function setVolunteerRole(id, role) {
  try {
    await PUT('/volunteers/' + id, { role });
    // Update button styles in place
    ['shopper','delivery','both'].forEach(v => {
      const btn = document.querySelector(`#role-btns-${id} button:nth-child(${['shopper','delivery','both'].indexOf(v)+1})`);
      if (!btn) return;
      const active = v === role;
      btn.style.background    = active ? 'var(--black)' : 'var(--white)';
      btn.style.color         = active ? 'var(--white)' : 'var(--black)';
      btn.style.borderColor   = active ? 'var(--black)' : 'var(--gray-3)';
    });
    const msg = document.getElementById('role-msg-' + id);
    if (msg) { msg.textContent = '✓ Saved'; setTimeout(() => msg.textContent = '', 2000); }
  } catch(e) {
    alert('Failed to update role: ' + e.message);
  }
}

async function viewVolunteer(id) {
  try {
    const [r, hist] = await Promise.all([
      GET('/volunteers/' + id),
      GET('/volunteers/' + id + '/history')
    ]);

    const roleBtns = ['shopper','delivery','both'].map(v => `
      <button onclick="setVolunteerRole('${r.id}','${v}')"
        style="flex:1;padding:8px 4px;font-size:12px;font-weight:600;
               border:1.5px solid ${r.role===v?'var(--black)':'var(--gray-3)'};
               background:${r.role===v?'var(--black)':'var(--white)'};
               color:${r.role===v?'var(--white)':'var(--black)'};
               cursor:pointer;text-transform:capitalize;">
        ${v}
      </button>`).join('');

    const detailsHTML = `
      <div class="detail-row"><div class="detail-label">Status</div><div class="detail-value">${badge(r.status)}</div></div>
      <div class="detail-row"><div class="detail-label">Phone</div><div class="detail-value">${r.phone||'—'}</div></div>
      <div class="detail-row"><div class="detail-label">Email</div><div class="detail-value">${r.email||'—'}</div></div>
      <div class="detail-row">
        <div class="detail-label">Role</div>
        <div class="detail-value">
          <div style="display:flex;gap:6px;" id="role-btns-${r.id}">${roleBtns}</div>
          <div style="font-size:11px;color:var(--gray-4);margin-top:4px;min-height:16px;" id="role-msg-${r.id}"></div>
        </div>
      </div>
      <div class="detail-row"><div class="detail-label">Added</div><div class="detail-value">${fmtDate(r.created_at)}</div></div>
      ${r.notes?`<div class="detail-row"><div class="detail-label">Notes</div><div class="detail-value">${r.notes}</div></div>`:''}`;

    const s = hist.stats || {};
    const tasks = hist.tasks || [];

    const statsHTML = `
      <div class="hist-stat-grid">
        <div class="hist-stat-cell"><div class="hist-stat-num">${s.completed||0}</div><div class="hist-stat-lbl">Completed</div></div>
        <div class="hist-stat-cell"><div class="hist-stat-num">${s.shopping||0}</div><div class="hist-stat-lbl">Shopping</div></div>
        <div class="hist-stat-cell"><div class="hist-stat-num">${s.delivery||0}</div><div class="hist-stat-lbl">Deliveries</div></div>
        <div class="hist-stat-cell"><div class="hist-stat-num">${s.cycles_served||0}</div><div class="hist-stat-lbl">Deliveries</div></div>
        <div class="hist-stat-cell"><div class="hist-stat-num">${s.families_served||0}</div><div class="hist-stat-lbl">Families</div></div>
        <div class="hist-stat-cell"><div class="hist-stat-num">${s.total_tasks||0}</div><div class="hist-stat-lbl">Total Tasks</div></div>
      </div>`;

    const taskRows = tasks.length === 0
      ? '<p style="color:var(--gray-4);font-size:13px">No tasks yet.</p>'
      : tasks.map(t => {
          const isDone = t.status === 'complete';
          return `
            <div class="hist-row">
              <div class="hist-row-head" style="cursor:default">
                <div>
                  <div style="font-size:13px;font-weight:600">${t.cycle_title}</div>
                  <div style="font-size:11px;color:var(--gray-4);margin-top:2px">
                    <span style="text-transform:capitalize">${t.task_type}</span>
                    ${t.claimed_at ? '· Claimed ' + fmtDate(t.claimed_at) : ''}
                    ${t.completed_at ? '· Done ' + fmtDate(t.completed_at) : ''}
                  </div>
                </div>
                <div style="display:flex;gap:6px;align-items:center">
                  <span class="badge badge-${t.task_type}" style="font-size:10px">${t.task_type}</span>
                  ${isDone
                    ? '<span style="font-size:12px;color:#1a7a3c;font-weight:600">✓ Done</span>'
                    : `<span style="font-size:12px;color:var(--gray-4);text-transform:capitalize">${t.status}</span>`}
                </div>
              </div>
            </div>`;
        }).join('');

    openDrawer(r.name,
      `<div class="drawer-tabs">
         <div class="drawer-tab active" id="dtab-details" onclick="switchDrawerTab('details','vol')">Details</div>
         <div class="drawer-tab" id="dtab-history" onclick="switchDrawerTab('history','vol')">Task History (${s.total_tasks||0})</div>

      `<button class="btn" onclick="openVolunteerForm('${id}')">Edit</button>
       <button class="btn btn-outline" onclick="closeDrawer()">Close</button>`
    );
  } catch(e) { console.error(e); }
}

async function renderDonations(filter) {
  filter = filter || STATE.filter || 'all';
  STATE.filter = filter;

    `<button class="btn btn-outline" onclick="syncWixDonations()" id="wix-sync-btn">🔄 Sync Wix</button>

  document.getElementById('content').innerHTML = '<p style="color:var(--gray-4)">Loading…</p>';
  try {
    const rows = await GET('/donations');
    const total = rows.reduce((s, r) => s + (r.amount || 0), 0);

    // ── Monthly summary ───────────────────────────────────────────────────────
    const byMonth = {};
    rows.forEach(r => {
      const m = (r.date || '').slice(0, 7);
      if (!m) return;
      if (!byMonth[m]) byMonth[m] = { total: 0, count: 0, recurring: 0, oneTime: 0 };
      byMonth[m].total    += r.amount || 0;
      byMonth[m].count++;
      if (r.frequency === 'monthly') byMonth[m].recurring += r.amount || 0;
      else                           byMonth[m].oneTime   += r.amount || 0;
    });
    const months = Object.keys(byMonth).sort().reverse();
    const monthLabel = iso => {
      const [y, m] = iso.split('-');
      return new Date(+y, +m - 1, 1).toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
    };
    const monthlyCardsHTML = months.length ? `
      <div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;">
        ${months.map(m => {
          const d = byMonth[m];
          const pillsHTML = [
            d.recurring > 0 ? `<span style="display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#e8f5e9;color:#1a5e34;margin-right:4px;margin-top:4px;">Monthly ${fmtMoney(d.recurring)}</span>` : '',
            d.oneTime   > 0 ? `<span style="display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#e0f2f1;color:#00695c;margin-top:4px;">One-time ${fmtMoney(d.oneTime)}</span>` : ''
          ].filter(Boolean).join('');
          return `
          <div style="min-width:150px;background:#fff;border:1.5px solid #e8e8e8;border-radius:10px;padding:12px 14px;flex-shrink:0;">
            <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#888;margin-bottom:4px;">${monthLabel(m)}</div>
            <div style="font-size:20px;font-weight:800;color:#1a8754;">${fmtMoney(d.total)}</div>
            <div style="font-size:11px;color:#aaa;margin-top:2px;margin-bottom:2px;">${d.count} donation${d.count !== 1 ? 's' : ''}</div>
            ${pillsHTML}
          </div>`;
        }).join('')}
      </div>` : '';

    document.getElementById('content').innerHTML = monthlyCardsHTML + `
      <div class="table-card">
        <div class="table-header">
          <span class="table-title">All Donations <span style="font-size:13px;font-weight:400;color:var(--gray-4)">${fmtMoney(total)} total</span></span>
        </div>
        <table>
          <thead><tr>
            <th>Donor</th><th>Amount</th><th>Type</th><th>Date</th><th>Campaign</th>
          </tr></thead>
          <tbody>
            ${rows.length ? rows.map(r => `
              <tr>
                <td>
                  <strong>${r.donor_name||'Anonymous'}</strong>
                  ${r.donor_email ? `<br><span style="font-size:11px;color:var(--gray-4)">${r.donor_email}</span>` : ''}
                </td>
                <td><strong>${fmtMoney(r.amount)}</strong></td>
                <td>
                  <span style="font-size:12px;padding:2px 8px;border-radius:10px;background:${r.frequency==='monthly'?'#e8f5e9':'#fff3e0'};color:${r.frequency==='monthly'?'#1a8754':'#e67e22'}">
                    ${r.frequency||'one-time'}
                  </span>
                </td>
                <td style="white-space:nowrap">${fmtDate(r.date)}</td>
                <td style="font-size:12px;color:var(--gray-4)">${r.notes||r.source||'—'}</td>
              </tr>`).join('') :
              '<tr class="empty-row"><td colspan="5">No donations yet — click Sync Wix to import</td></tr>'}
          </tbody>
        </table>
      </div>`;
  } catch(e) {
    document.getElementById('content').innerHTML = `<p style="color:#c00">${e.message}</p>`;
  }
}

async function syncWixDonations() {
  const btn = document.getElementById('wix-sync-btn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Syncing…'; }
  try {
    const res = await POST('/donations/sync-wix', {});
    renderDonations();
    if (btn) { btn.disabled = false; btn.textContent = '🔄 Sync Wix'; }
    if (res.imported > 0) {
      alert(`✅ Synced ${res.imported} new donation${res.imported>1?'s':''} from Wix.${res.skipped_duplicates>0?' ('+res.skipped_duplicates+' already imported)':''}`);
    } else {
      alert(`✓ Already up to date — no new donations found.`);
    }
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = '🔄 Sync Wix'; }
    if (e.message.includes('WIX_API_KEY')) {
      alert('Wix API key not configured.\n\nTo set it up:\n1. Go to wix.com → Account Settings → API Keys\n2. Create a key with eCommerce read permissions\n3. Add WIX_API_KEY=<your key> in Railway Variables\n4. Redeploy');
    } else {
      alert('Sync failed: ' + e.message);
    }
  }
}

function exportDonations() {
  const token = STATE.token;
  const url = '/api/donations/export';
  const a = document.createElement('a');
  a.href = url;
  a.style.display = 'none';
  // Pass auth token via a temporary fetch → blob download
  fetch(url, { headers: { 'Authorization': 'Bearer ' + token } })
    .then(res => {
      if (!res.ok) throw new Error('Export failed');
      return res.blob();
    })
    .then(blob => {
      const blobUrl = URL.createObjectURL(blob);
      a.href = blobUrl;
      const today = new Date().toISOString().slice(0,10).replace(/-/g,'');
      a.download = `sihaa_donations_${today}.xlsx`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(blobUrl);
    })
    .catch(e => alert('Export failed: ' + e.message));
}

         <label>Active</label>

     <div class="form-group">
       <label>Email</label>
       <input type="email" id="u-email" value="${r.email||''}" placeholder="treasurer@example.com">
     </div>
     <div class="form-group">
       <label>WhatsApp Phone <span style="font-weight:400;color:var(--gray-4)">(+1XXXXXXXXXX)</span></label>
       <input type="text" id="u-wa-phone" value="${r.wa_phone||''}" placeholder="+15851234567">
     </div>
     <div class="form-group">
       <label>CallMeBot API Key</label>
       <input type="text" id="u-wa-apikey" value="${r.wa_apikey||''}" placeholder="From CallMeBot opt-in">
     </div>
     <div class="alert alert-error" id="user-err" style="display:none"></div>`,
    `<button class="btn" onclick="saveUser()">Save</button>
     <button class="btn btn-outline" onclick="closeDrawer()">Cancel</button>`
  );
}

async function saveUser() {
  const showErr = msg => {
    const el = document.getElementById('user-err');
    el.textContent = msg; el.style.display = 'block';
  };
  const username = document.getElementById('u-username').value.trim();
  const password = document.getElementById('u-password').value;
  if (!username) return showErr('Username is required');
  if (!STATE.editId && !password) return showErr('Password is required');
  const payload = {
    name:     document.getElementById('u-name').value.trim(),
    username,
    role:     document.getElementById('u-role').value,
    email:    document.getElementById('u-email').value.trim() || null,
    wa_phone: document.getElementById('u-wa-phone').value.trim() || null,
    wa_apikey:document.getElementById('u-wa-apikey').value.trim() || null,
  };
  if (password) payload.password = password;
  if (STATE.editId) payload.active = parseInt(document.getElementById('u-active').value);
  try {
    if (STATE.editId) await PUT('/users/' + STATE.editId, payload);
    else await POST('/users', payload);
    closeDrawer();
    renderUsers();
  } catch(e) { showErr(e.message); }
}

async function renderOrders() {
  document.getElementById('content').innerHTML = '<p style="color:var(--gray-4)">Loading…</p>';

  try {
    const cycles = await GET('/delivery-cycles');
    const defaultCycle = cycles.find(c => c.status === 'shopping')
                      || cycles.find(c => c.status === 'upcoming') || cycles[0];
    const defaultCycleId = defaultCycle ? defaultCycle.id : null;

    const cycleOptions = cycles.length
      ? cycles.map(c =>
          `<option value="${c.id}" ${c.id === defaultCycleId ? 'selected' : ''}>${c.title} (${c.status})</option>`
        ).join('')
      : '<option value="">No deliveries yet</option>';

    document.getElementById('topbar-actions').innerHTML =
      `<button class="btn" onclick="window.open('/order','_blank')">⇗ Family Order Form</button>`;

    document.getElementById('content').innerHTML = `
      <div class="table-card">
        <div class="table-header">
          <span class="table-title">Food Orders</span>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
            <select id="orders-cycle-select" class="search-input" style="min-width:240px;"
                    onchange="loadOrdersForCycle(this.value)">
              <option value="">— Select a delivery —</option>
              ${cycleOptions}
            </select>
            <button class="btn" id="gen-slots-btn" onclick="generateSlotsForSelected()" style="display:none;">
              Generate Slots
            </button>
          </div>
        </div>
        <div id="orders-table-wrap">
          <p style="padding:24px;color:var(--gray-4);">Select a delivery above to view orders.</p>
        </div>
      </div>`;

    if (defaultCycleId) loadOrdersForCycle(defaultCycleId);
  } catch(e) {
    document.getElementById('content').innerHTML = `<p style="color:#c00">${e.message}</p>`;
  }
}

async function loadOrdersForCycle(cycleId) {
  const wrap = document.getElementById('orders-table-wrap');
  const genBtn = document.getElementById('gen-slots-btn');
  if (!cycleId) { wrap.innerHTML = ''; if(genBtn) genBtn.style.display='none'; return; }

  wrap.innerHTML = '<p style="padding:16px;color:var(--gray-4);">Loading…</p>';

  const [orders, slots] = await Promise.all([
    GET('/delivery-cycles/' + cycleId + '/orders'),
    GET('/volunteer-slots?cycle_id=' + cycleId)
  ]);

  // Show Generate Slots button when slots haven't been made yet
  if (genBtn) genBtn.style.display = slots.length === 0 && orders.length > 0 ? '' : 'none';

  const slotMap = {};
  slots.forEach(s => {
    if (!slotMap[s.family_id]) slotMap[s.family_id] = {};
    slotMap[s.family_id][s.task_type] = s;
  });

  const statusBadge = s => {
    const map = { submitted:'#2e86c1', assigned:'#1a8754', delivered:'#155724', cancelled:'#c0392b' };
    return `<span class="badge" style="background:${map[s]||'#888'};color:#fff;border:none;">${s}</span>`;
  };

  const slotBadge = slot => {
    if (!slot) return `<span style="color:#bbb;font-size:12px;">no slot</span>`;
    const colors = { open:'#e0a800', claimed:'#1a8754', complete:'#155724', cancelled:'#c0392b' };
    const label = (slot.status === 'claimed' || slot.status === 'complete')
      ? `${slot.claimed_by_name || '?'}`
      : slot.status;
    return `<span class="badge" style="background:${colors[slot.status]||'#888'};color:#fff;border:none;font-size:11px;" title="${slot.status}">${label}</span>`;
  };

  if (orders.length === 0) {
    wrap.innerHTML = `
      <div style="padding:32px;text-align:center;color:var(--gray-4);">
        No orders for this delivery yet.<br>
        <a href="/order" target="_blank" style="color:#1a3a2a;font-weight:600;">Open the family order form →</a>
      </div>`;
    return;
  }

  const rows = orders.map(o => {
    const shop = slotMap[o.family_id]?.shopping;
    const del  = slotMap[o.family_id]?.delivery;
    return `<tr>
      <td><span style="font-family:monospace;font-weight:700;font-size:13px">${o.family_code||'—'}</span></td>
      <td style="color:var(--gray-4);">${o.family_size || '—'}</td>
      <td><span class="badge">${o.bundle_size}</span></td>
      <td>${statusBadge(o.status)}</td>
      <td>${slotBadge(shop)}</td>
      <td>${slotBadge(del)}</td>
    </tr>`;
  }).join('');

  wrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Family ID</th><th>Size</th><th>Bundle</th>
          <th>Status</th><th>Shopper</th><th>Delivery</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="padding:12px 16px;font-size:12px;color:var(--gray-4);border-top:1px solid var(--gray-2);">
      ${orders.length} order${orders.length !== 1 ? 's' : ''} · ${slots.length} slots generated
    </div>`;
}

async function generateSlotsForSelected() {
  const cycleId = document.getElementById('orders-cycle-select').value;
  if (!cycleId) return;
  try {
    const res = await POST('/delivery-cycles/' + cycleId + '/generate-slots', {});
    alert(`${res.slots_created} slots created (${res.total_requests} orders).`);
    loadOrdersForCycle(cycleId);
  } catch(e) { alert('Error: ' + e.message); }
}

// ── Delivery Cycles ───────────────────────────────────────────────────────────

let _cyclesCache = [];

async function renderDeliveries(filterStatus) {
  filterStatus = filterStatus || STATE.filter || 'all';

  document.getElementById('topbar-actions').innerHTML =

    const statusLabels = { upcoming:'Upcoming', shopping:'Shopping', delivered:'Delivered' };
    document.getElementById('content').innerHTML = `
      <div style="margin-bottom:16px">
        <div class="filter-tabs">
          ${['all','upcoming','shopping','delivered'].map(s =>
            `<div class="filter-tab ${filterStatus===s?'active':''}" onclick="renderDeliveries('${s}')">${s === 'all' ? 'All' : statusLabels[s]}</div>`
          ).join('')}
        </div>
      </div>
      <div class="table-card">
        <div class="table-header"><span class="table-title">All Deliveries</span></div>
        <table>
          <thead><tr>
            <th>Title</th><th>Delivery Dates</th><th>Status</th><th>Families</th><th></th>
          </tr></thead>
          <tbody>
            ${_cyclesCache.length ? _cyclesCache.map(c => `
              <tr style="cursor:pointer" onclick="viewCycleDetail('${c.id}')">
                <td><strong>${c.title}</strong></td>
                <td style="font-size:12px;white-space:nowrap">${fmtDate(c.delivery_date_start)} – ${fmtDate(c.delivery_date_end)}</td>
                <td><span class="badge ${statusColors[c.status]||'badge-pending'}">${statusLabels[c.status]||c.status}</span></td>
                <td id="conf-${c.id}" style="font-size:12px;color:var(--gray-4)">—</td>
                <td style="white-space:nowrap" onclick="event.stopPropagation()">
                  <button class="btn btn-outline btn-sm" onclick="openCycleForm('${c.id}')">Edit</button>
                  ${c.status === 'upcoming' ? `<button class="btn btn-sm" style="margin-left:4px;background:#2e86c1;color:#fff" onclick="advanceCycleStatus('${c.id}','upcoming')">→ Shopping</button>` : ''}
                  ${c.status === 'shopping' ? `<button class="btn btn-sm" style="margin-left:4px;background:#1a8754;color:#fff" onclick="advanceCycleStatus('${c.id}','shopping')">→ Delivered</button>` : ''}
                </td>
              </tr>`).join('') :
              '<tr class="empty-row"><td colspan="5">No deliveries found</td></tr>'}
          </tbody>
        </table>
      </div>`;
    // Load confirmation counts async
    _cyclesCache.forEach(c => loadConfirmationCount(c.id));

    document.getElementById('content').innerHTML = `<p style="color:#c00">${e.message}</p>`;
  }
}

async function loadConfirmationCount(cycleId) {
  try {
    const orders = await GET('/delivery-cycles/' + cycleId + '/orders');
    const total     = orders.length;
    const confirmed = orders.filter(o => ['confirmed','auto_confirmed'].includes(o.status)).length;
    const skipped   = orders.filter(o => o.status === 'skipped').length;
    const pending   = orders.filter(o => o.status === 'pending_confirmation').length;
    const el = document.getElementById('conf-' + cycleId);
    if (el) el.innerHTML = total
      ? `<span style="color:#1a8754">${confirmed} confirmed</span> · ${pending} pending · ${skipped} skip`
      : `<span style="color:#aaa">0 enrolled</span>`;
  } catch(e) {}
}

async function advanceCycleStatus(id, current) {
  const next = { upcoming:'shopping', shopping:'delivered' };
  if (!next[current]) return;
  const label = { upcoming:'Shopping', shopping:'Delivered' };
  if (!confirm(`Mark this delivery as "${label[next[current]]}"?`)) return;
  try {
    await PUT('/delivery-cycles/' + id, { status: next[current] });
    renderDeliveries();
  } catch(e) { alert(e.message); }
}

function openCycleForm(id) {
  STATE.editId = id || null;
  const c = id ? _cyclesCache.find(x => x.id === id) : null;
  openDrawer(id ? 'Edit Delivery' : 'New Delivery', `
    <div class="form-group">
      <label>Delivery Title *</label>
      <input type="text" id="cy-title" placeholder="e.g. May 9–10, 2026" value="${c?.title||''}">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Delivery Start *</label>
        <input type="date" id="cy-del-start" value="${c?.delivery_date_start?.slice(0,10)||''}">
      </div>
      <div class="form-group">
        <label>Delivery End *</label>
        <input type="date" id="cy-del-end" value="${c?.delivery_date_end?.slice(0,10)||''}">
      </div>
    </div>
    ${id ? `<div class="form-group">
      <label>Status</label>
      <select id="cy-status">
        ${['upcoming','shopping','delivered'].map(s => `<option value="${s}" ${c?.status===s?'selected':''}>${s.charAt(0).toUpperCase()+s.slice(1)}</option>`).join('')}
      </select>
    </div>` : `<p style="font-size:13px;color:#1a8754;background:#f0faf5;padding:10px 12px;border-radius:8px;margin-top:4px;">
      ✓ All active families will be automatically enrolled when the delivery is created.
    </p>`}
    <div class="form-group">
      <label>Notes</label>
      <textarea id="cy-notes">${c?.notes||''}</textarea>
    </div>
    <div class="alert alert-error" id="cy-err"></div>`,
    `<button class="btn" onclick="saveCycle()">Save</button>
     <button class="btn btn-outline" onclick="closeDrawer()">Cancel</button>`
  );
}

async function saveCycle() {
  const showErr = msg => { const el = document.getElementById('cy-err'); el.textContent=msg; el.style.display='block'; };
  const title    = document.getElementById('cy-title').value.trim();
  const delStart = document.getElementById('cy-del-start').value;
  const delEnd   = document.getElementById('cy-del-end').value;
  if (!title || !delStart || !delEnd) return showErr('Title and delivery dates are required');
  const payload  = { title, delivery_date_start: delStart, delivery_date_end: delEnd,
                     notes: document.getElementById('cy-notes').value.trim() };
  const statusEl = document.getElementById('cy-status');
  if (statusEl) payload.status = statusEl.value;
  try {
    const res = STATE.editId
      ? await PUT('/delivery-cycles/' + STATE.editId, payload)
      : await POST('/delivery-cycles', payload);
    if (!STATE.editId && res.enrolled > 0)
      alert(`✅ Delivery created! ${res.enrolled} families auto-enrolled.`);
    closeDrawer(); renderDeliveries();
  } catch(e) { showErr(e.message); }
}

async function viewCycleDetail(cycleId) {
  const cycle = _cyclesCache.find(c => c.id === cycleId);
  document.getElementById('page-title').textContent = cycle ? cycle.title : 'Delivery Detail';
  document.getElementById('topbar-actions').innerHTML =

      <div style="margin-bottom:16px;font-size:13px;color:var(--gray-4)">
        ${orders.length} order${orders.length!==1?'s':''} submitted

async function viewShoppingList(cycleId) {

      byCategory[item.category].push(item);
    });

    document.getElementById('content').innerHTML = `
      <div style="margin-bottom:20px">
        <div style="font-size:13px;font-weight:700;margin-bottom:4px">${cycle.title||''}</div>
        <div style="font-size:12px;color:var(--gray-4)">
          Delivery: ${fmtDate(cycle.delivery_date_start)} – ${fmtDate(cycle.delivery_date_end)}
          · ${data.total_orders} order${data.total_orders!==1?'s':''}
        </div>
      </div>
      ${list.length === 0 ? '<p style="color:var(--gray-4)">No orders yet — shopping list will appear once families submit requests.</p>' :

async function generateSlots(cycleId) {
  if (!confirm('Generate shopping + delivery slots for all families that submitted orders in this cycle? Existing slots are preserved.')) return;
  try {
    const res = await POST('/delivery-cycles/' + cycleId + '/generate-slots', {});
    alert(`Done — ${res.slots_created} new slot(s) created from ${res.total_requests} order(s).`);
    viewSlotBoard(cycleId);
  } catch(e) { alert(e.message); }
}

async function viewSlotBoard(cycleId) {
  const cycle = _cyclesCache.find(c => c.id === cycleId);
  document.getElementById('page-title').textContent = (cycle ? cycle.title : 'Delivery') + ' — Slot Board';
  document.getElementById('topbar-actions').innerHTML =
    `<button class="btn btn-outline" onclick="renderDeliveries()">← Back to Deliveries</button>
     <button class="btn btn-outline" onclick="viewCycleDetail('${cycleId}')">Orders</button>
     <button class="btn btn-outline" onclick="viewShoppingList('${cycleId}')">Shopping List</button>
     <button class="btn" onclick="generateSlots('${cycleId}')">Generate Slots</button>`;
  document.getElementById('content').innerHTML = '<p style="color:var(--gray-4)">Loading slots…</p>';
  try {
    const slots = await GET('/volunteer-slots?cycle_id=' + cycleId);
    const shopping = slots.filter(s => s.task_type === 'shopping');
    const delivery = slots.filter(s => s.task_type === 'delivery');
    const slotTable = (rows, type) => {
      if (!rows.length) return `<p style="color:var(--gray-4);padding:12px">No ${type} slots generated yet — click "Generate Slots" above.</p>`;
      return `<table>
        <thead><tr><th>Family ID</th><th>Size</th><th>Status</th><th>Assigned To</th><th>Task Date</th></tr></thead>
        <tbody>
          ${rows.map(s => `<tr>
            <td><span style="font-family:monospace;font-weight:700;font-size:12px">${s.family_code||'—'}</span></td>
            <td style="font-size:12px;color:var(--gray-4)">${s.family_size || '?'} people</td>
            <td><span class="badge ${s.status==='open'?'badge-pending':s.status==='claimed'?'badge-active':'badge-inactive'}">${s.status}</span></td>

            <td style="font-size:12px">${s.task_date ? fmtDate(s.task_date) : '—'}</td>
