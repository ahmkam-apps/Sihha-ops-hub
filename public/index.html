<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sihha — Ops Hub</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  @font-face {
    font-family: 'AreaExtrabold';
    src: url('https://static.wixstatic.com/ufonts/2e5170_b7dd1a41ae7e481ca8d80cdf3858d08b/woff2/file.woff2') format('woff2');
    font-weight: 800; font-style: normal;
  }
  @font-face {
    font-family: 'AreaNormal';
    src: url('https://static.wixstatic.com/ufonts/2e5170_6263df7a2b874b8c9a621cc0eefc5ab8/woff2/file.woff2') format('woff2');
    font-weight: 400; font-style: normal;
  }

  :root {
    --black:   #111111;
    --white:   #ffffff;
    --gray-1:  #f6f6f6;
    --gray-2:  #e8e8e8;
    --gray-3:  #cccccc;
    --gray-4:  #888888;
    --gray-5:  #444444;
    --sidebar-w: 220px;
    --font: 'AreaNormal', Helvetica, Arial, sans-serif;
    --font-head: 'AreaExtrabold', Helvetica, Arial, sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--white);
    color: var(--black);
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── Login ─────────────────────────────────────────────── */
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--white);
  }
  .login-box {
    width: 360px;
    padding: 48px 40px;
    border: 1.5px solid var(--black);
  }
  .login-logo {
    font-family: var(--font-head);
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.04em;
    margin-bottom: 8px;
  }
  .login-sub {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--gray-4);
    margin-bottom: 36px;
  }
  .login-box label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gray-5);
    margin-bottom: 6px;
  }
  .login-box input {
    width: 100%;
    border: 1.5px solid var(--black);
    padding: 10px 12px;
    font-size: 14px;
    font-family: var(--font);
    outline: none;
    margin-bottom: 20px;
    background: var(--white);
  }
  .login-box input:focus { background: var(--gray-1); }
  .btn-primary {
    width: 100%;
    background: var(--black);
    color: var(--white);
    border: none;
    padding: 12px;
    font-size: 13px;
    font-family: var(--font);
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
  }
  .btn-primary:hover { background: var(--gray-5); }
  .btn-primary:disabled { background: var(--gray-3); cursor: not-allowed; }
  .login-error {
    color: #c00;
    font-size: 12px;
    margin-top: 12px;
    display: none;
  }

  /* ── App Shell ─────────────────────────────────────────── */
  #app { display: none; height: 100vh; }

  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: var(--sidebar-w);
    background: var(--white);
    border-right: 1.5px solid var(--black);
    display: flex;
    flex-direction: column;
    z-index: 100;
    overflow: hidden;
  }
  .sidebar-nav {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
  }
  .sidebar-nav::-webkit-scrollbar { width: 4px; }
  .sidebar-nav::-webkit-scrollbar-thumb { background: var(--gray-2); }
  .sidebar-logo {
    padding: 24px 20px 20px;
    border-bottom: 1px solid var(--gray-2);
    flex-shrink: 0;
  }
  .sidebar-logo .wordmark {
    font-family: var(--font-head);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.04em;
  }
  .sidebar-logo .tagline {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--gray-4);
    margin-top: 2px;
  }
  .nav-section {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--gray-4);
    padding: 16px 20px 6px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    font-size: 13px;
    cursor: pointer;
    color: var(--gray-5);
    border-left: 3px solid transparent;
    transition: all 0.1s;
  }
  .nav-item:hover { background: var(--gray-1); color: var(--black); }
  .nav-item.active {
    color: var(--black);
    font-weight: 600;
    border-left-color: var(--black);
    background: var(--gray-1);
  }
  .nav-item .icon { font-size: 14px; width: 18px; text-align: center; }
  .sidebar-footer {
    flex-shrink: 0;
    padding: 16px 20px;
    border-top: 1px solid var(--gray-2);
    font-size: 12px;
    color: var(--gray-4);
  }
  .sidebar-user { font-weight: 600; color: var(--black); margin-bottom: 2px; }
  .sidebar-role { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .logout-btn {
    margin-top: 10px;
    font-size: 11px;
    color: var(--gray-4);
    cursor: pointer;
    text-decoration: underline;
  }
  .logout-btn:hover { color: var(--black); }

  .main {
    margin-left: var(--sidebar-w);
    min-height: 100vh;
    background: var(--gray-1);
  }
  .topbar {
    background: var(--white);
    border-bottom: 1px solid var(--gray-2);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar h1 { font-family: var(--font-head); font-size: 18px; font-weight: 800; letter-spacing: -0.04em; }
  .topbar-actions { display: flex; gap: 10px; align-items: center; }

  .content { padding: 28px 32px; }

  /* ── Buttons ────────────────────────────────────────────── */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    font-size: 12px;
    font-family: var(--font);
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    border: 1.5px solid var(--black);
    background: var(--black);
    color: var(--white);
  }
  .btn:hover { background: var(--gray-5); border-color: var(--gray-5); }
  .btn-outline {
    background: var(--white);
    color: var(--black);
  }
  .btn-outline:hover { background: var(--gray-1); }
  .btn-sm { padding: 5px 12px; font-size: 11px; }

  /* ── Stats Cards ────────────────────────────────────────── */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--white);
    border: 1.5px solid var(--black);
    padding: 20px;
    cursor: pointer;
  }
  .stat-card:hover { background: var(--gray-1); }
  .stat-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--gray-4);
    margin-bottom: 8px;
  }
  .stat-value {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1;
  }
  .stat-sub {
    font-size: 11px;
    color: var(--gray-4);
    margin-top: 4px;
  }

  /* ── Tables ─────────────────────────────────────────────── */
  .table-card {
    background: var(--white);
    border: 1.5px solid var(--black);
  }
  .table-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--gray-2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .table-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
  .search-input {
    border: 1.5px solid var(--gray-2);
    padding: 7px 12px;
    font-size: 12px;
    font-family: var(--font);
    outline: none;
    width: 220px;
  }
  .search-input:focus { border-color: var(--black); }
  .filter-tabs { display: flex; gap: 0; }
  .filter-tab {
    padding: 6px 14px;
    font-size: 11px;
    font-family: var(--font);
    cursor: pointer;
    border: 1px solid var(--gray-2);
    background: var(--white);
    margin-right: -1px;
    color: var(--gray-5);
  }
  .filter-tab.active {
    background: var(--black);
    color: var(--white);
    border-color: var(--black);
    z-index: 1;
    position: relative;
  }
  .filter-tab:hover:not(.active) { background: var(--gray-1); }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gray-4);
    padding: 10px 16px;
    border-bottom: 1px solid var(--gray-2);
    font-weight: 600;
    background: var(--gray-1);
  }
  td { padding: 12px 16px; border-bottom: 1px solid var(--gray-2); font-size: 13px; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--gray-1); }
  .empty-row td { text-align: center; color: var(--gray-4); padding: 40px; font-size: 13px; }

  /* ── Status Badges ──────────────────────────────────────── */
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 8px;
  }
  .badge-pending  { background: var(--gray-2); color: var(--gray-5); }
  .badge-active   { background: var(--black);  color: var(--white); }
  .badge-inactive { background: var(--gray-1); color: var(--gray-4); border: 1px solid var(--gray-3); }
  .badge-paused   { background: var(--gray-3); color: var(--gray-5); }
  .badge-approved { background: var(--black);  color: var(--white); }
  .badge-rejected { background: #c00;          color: var(--white); }
  .badge-completed{ background: var(--black);  color: var(--white); }

  /* ── Drawer / Slide-in panel ────────────────────────────── */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 200;
  }
  .overlay.open { display: block; }
  .drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 480px;
    background: var(--white);
    border-left: 1.5px solid var(--black);
    z-index: 201;
    transform: translateX(100%);
    transition: transform 0.2s ease;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--gray-2);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .drawer-title { font-size: 15px; font-weight: 700; }
  .drawer-close {
    font-size: 20px;
    cursor: pointer;
    color: var(--gray-4);
    line-height: 1;
    padding: 4px;
  }
  .drawer-close:hover { color: var(--black); }
  .drawer-body {
    padding: 24px;
    overflow-y: auto;
    flex: 1;
  }
  .drawer-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--gray-2);
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }

  /* ── Forms ──────────────────────────────────────────────── */
  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gray-5);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    border: 1.5px solid var(--gray-3);
    padding: 10px 12px;
    font-size: 13px;
    font-family: var(--font);
    outline: none;
    background: var(--white);
    color: var(--black);
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { border-color: var(--black); }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-section {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--gray-4);
    margin-bottom: 14px;
    margin-top: 20px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--gray-2);
  }
  .form-section:first-child { margin-top: 0; }

  /* ── Drawer Tabs ─────────────────────────────────────────── */
  .drawer-tabs { display: flex; border-bottom: 2px solid var(--gray-2); margin-bottom: 20px; }
  .drawer-tab {
    padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -2px;
    color: var(--gray-4); text-transform: uppercase; letter-spacing: 0.05em;
  }
  .drawer-tab.active { color: var(--black); border-bottom-color: var(--black); }
  .drawer-pane { display: none; }
  .drawer-pane.active { display: block; }

  /* History rows in drawer */
  .hist-row {
    border: 1px solid var(--gray-2); margin-bottom: 8px; background: var(--white);
  }
  .hist-row-head {
    padding: 10px 14px; display: flex; justify-content: space-between;
    align-items: center; cursor: pointer; gap: 8px;
  }
  .hist-row-head:hover { background: var(--gray-1); }
  .hist-row-body { padding: 0 14px 12px; font-size: 12px; display: none; }
  .hist-row-body.open { display: block; }
  .hist-items { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .hist-item-chip {
    background: var(--gray-1); border: 1px solid var(--gray-2);
    padding: 2px 8px; font-size: 11px; border-radius: 2px;
  }
  .items-badge { position: relative; display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 600; color: var(--gray-5);
    padding: 2px 8px; background: var(--gray-1); border-radius: 20px;
    cursor: default; user-select: none; }
  .items-badge .items-tooltip {
    display: none; position: absolute; left: 0; top: calc(100% + 6px); z-index: 100;
    background: #1a1a1a; color: #fff; border-radius: 8px; padding: 10px 14px;
    min-width: 160px; max-width: 260px; font-size: 12px; font-weight: 400;
    line-height: 1.8; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,.2);
    pointer-events: none; }
  .items-badge:hover .items-tooltip { display: block; }
  .hist-stat-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px;
  }
  .hist-stat-cell {
    border: 1px solid var(--gray-2); padding: 10px; text-align: center; background: var(--white);
  }
  .hist-stat-num { font-family: var(--font-head); font-size: 22px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; }
  .hist-stat-lbl { font-size: 10px; color: var(--gray-4); text-transform: uppercase;
                   letter-spacing: 0.05em; margin-top: 3px; }

  /* ── Detail Panel ───────────────────────────────────────── */
  .detail-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    align-items: flex-start;
  }
  .detail-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--gray-4);
    width: 130px;
    flex-shrink: 0;
    padding-top: 2px;
    font-weight: 600;
  }
  .detail-value { font-size: 13px; flex: 1; }

  /* ── Alert ───────────────────────────────────────────────── */
  .alert {
    padding: 10px 16px;
    font-size: 12px;
    margin-bottom: 16px;
    display: none;
  }
  .alert-error { background: #fff0f0; border: 1px solid #fcc; color: #c00; }
  .alert-success { background: #f0fff4; border: 1px solid #9f9; color: #060; }

  /* ── Responsive ─────────────────────────────────────────── */
  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .main { margin-left: 0; }
    .drawer { width: 100%; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<!-- ── Login Screen ────────────────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">sihha</div>
    <div class="login-sub">Operations Hub</div>
    <label>Username</label>
    <input type="text" id="login-user" autocomplete="username" placeholder="username">
    <label>Password</label>
    <input type="password" id="login-pass" autocomplete="current-password" placeholder="••••••••">
    <button class="btn-primary" id="login-btn" onclick="doLogin()">Sign In</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ── App Shell ───────────────────────────────────────────────────────────── -->
<div id="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="wordmark">sihha</div>
      <div class="tagline">Operations Hub</div>
    </div>

    <div class="sidebar-nav">
      <div class="nav-section">Operations</div>
      <div class="nav-item active" onclick="nav('dashboard')" id="nav-dashboard">
        <span class="icon">◈</span> Dashboard
      </div>
      <div class="nav-item" onclick="nav('deliveries')" id="nav-deliveries">
        <span class="icon">↻</span> Deliveries
      </div>
      <div class="nav-item" onclick="nav('families')" id="nav-families">
        <span class="icon">⌂</span> Families
      </div>
      <div class="nav-item" onclick="nav('volunteers')" id="nav-volunteers">
        <span class="icon">◎</span> Volunteers
      </div>

      <div class="nav-section">Finance</div>
      <div class="nav-item" onclick="nav('payments')" id="nav-payments">
        <span class="icon">◫</span> Payments
      </div>
      <div class="nav-item" onclick="nav('donations')" id="nav-donations">
        <span class="icon">♦</span> Donations
      </div>

      <div class="nav-section" id="nav-section-admin" style="display:none">Settings</div>
      <div class="nav-item" onclick="nav('catalog')" id="nav-catalog" style="display:none">
        <span class="icon">☰</span> Food Catalog
      </div>
      <div class="nav-item" onclick="nav('users')" id="nav-users" style="display:none">
        <span class="icon">◉</span> Users
      </div>

      <div class="nav-section">Public Links</div>
      <div class="nav-item" onclick="window.open('/family','_blank')" style="font-size:12px;">
        <span class="icon">⇗</span> My Order (Families)
      </div>
      <div class="nav-item" onclick="window.open('/intake','_blank')" style="font-size:12px;">
        <span class="icon">⇗</span> Family Registration
      </div>
      <div class="nav-item" onclick="window.open('/portal','_blank')" style="font-size:12px;">
        <span class="icon">⇗</span> Volunteer Portal
      </div>
      <div class="nav-item" onclick="window.open('/volunteer-signup','_blank')" style="font-size:12px;">
        <span class="icon">⇗</span> Volunteer Sign Up
      </div>
    </div><!-- /sidebar-nav -->

    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebar-username"></div>
      <div class="sidebar-role" id="sidebar-role"></div>
      <div class="logout-btn" onclick="doLogout()">Sign out</div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <h1 id="page-title">Dashboard</h1>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- ── Drawer ──────────────────────────────────────────────────────────────── -->
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="drawer-title" id="drawer-title">—</div>
    <div class="drawer-close" onclick="closeDrawer()">✕</div>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-footer" id="drawer-footer"></div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let STATE = { token: null, user: null, page: 'dashboard', filter: 'all', editId: null };

// ── API ───────────────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json' }
  };
  if (STATE.token) opts.headers['Authorization'] = 'Bearer ' + STATE.token;
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch('/api' + path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}
const GET  = (p)    => api('GET', p);
const POST = (p, b) => api('POST', p, b);
const PUT  = (p, b) => api('PUT', p, b);
const DEL  = (p)    => api('DELETE', p);

// ── Auth ──────────────────────────────────────────────────────────────────────
async function doLogin() {
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  const err  = document.getElementById('login-error');
  const btn  = document.getElementById('login-btn');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const res = await POST('/auth/login', { username: user, password: pass });
    STATE.token = res.token;
    STATE.user  = res.user;
    localStorage.setItem('sihaa_token', res.token);
    showApp();
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}

async function doLogout() {
  try { await POST('/auth/logout', {}); } catch(e) {}
  STATE.token = null; STATE.user = null;
  localStorage.removeItem('sihaa_token');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

async function checkSession() {
  const token = localStorage.getItem('sihaa_token');
  if (!token) return;
  try {
    STATE.token = token;
    STATE.user  = await GET('/auth/me');
    showApp();
  } catch(e) {
    localStorage.removeItem('sihaa_token');
    STATE.token = null;
  }
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('sidebar-username').textContent = STATE.user.name || STATE.user.username;
  document.getElementById('sidebar-role').textContent = STATE.user.role;
  if (STATE.user.role === 'admin') {
    document.getElementById('nav-section-admin').style.display = '';
    document.getElementById('nav-catalog').style.display = '';
    document.getElementById('nav-users').style.display = '';
  }
  // Treasurer: show only Finance section
  if (STATE.user.role === 'treasurer') {
    ['nav-dashboard','nav-deliveries','nav-volunteers',
     'nav-families'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });
    nav('payments');
    return;
  }
  nav('dashboard');
}

// Allow Enter key on login
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('login-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
  checkSession();
});

// ── Navigation ────────────────────────────────────────────────────────────────
function nav(page) {
  STATE.page = page; STATE.filter = 'all'; STATE.editId = null;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const navEl = document.getElementById('nav-' + page);
  if (navEl) navEl.classList.add('active');
  const titles = {
    dashboard: 'Dashboard', families: 'Families', volunteers: 'Volunteers',
    payments: 'Payments', donations: 'Donations', users: 'Users',
    deliveries: 'Deliveries', catalog: 'Food Catalog',
    cycle_detail: 'Delivery Detail', orders: 'Food Orders',
    requests: '📋 Change Requests'
  };
  document.getElementById('page-title').textContent = titles[page] || page;
  closeDrawer();
  const renders = {
    dashboard: renderDashboard, families: renderFamilies,
    volunteers: renderVolunteers,
    payments: renderPayments, donations: renderDonations,
    users: renderUsers, deliveries: renderDeliveries, catalog: renderCatalog,
    orders: renderOrders, requests: renderRequests
  };
  if (renders[page]) renders[page]();
}

// ── Drawer ────────────────────────────────────────────────────────────────────
function openDrawer(title, bodyHTML, footerHTML) {
  document.getElementById('drawer-title').textContent = title;
  document.getElementById('drawer-body').innerHTML = bodyHTML;
  document.getElementById('drawer-footer').innerHTML = footerHTML || '';
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
  STATE.editId = null;
}

// ── Badge ─────────────────────────────────────────────────────────────────────
function badge(status) {
  return `<span class="badge badge-${status}">${status}</span>`;
}
function fmtDate(s) {
  if (!s) return '—';
  return s.slice(0,10);
}
function fmtMoney(n) {
  if (n === null || n === undefined) return '—';
  const num = Number(n);
  if (num === 0) return '$0';
  // Drop cents if the value is a whole number
  return num % 1 === 0
    ? '$' + num.toLocaleString('en-US')
    : '$' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function downloadPDF(path) {
  // Open PDF in a new tab — browser will show it inline or prompt download
  const url = '/api' + path;
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  // Add auth token as query param since we can't set headers on a direct link
  a.href = url + (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(STATE.token);
  a.click();
}

        </div>

        <!-- Bar chart tab -->
        <div id="dpane-bar">

          </div>
          <div style="display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;">

            <span style="font-size:11px;color:#888;display:flex;align-items:center;gap:5px;"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#b2dfdb;"></span>One-time</span>
            <span style="font-size:11px;color:#888;display:flex;align-items:center;gap:5px;"><span style="display:inline-block;width:14px;height:2px;background:#e0a800;"></span>Goal (${fmtMoney(DONATION_GOAL)})</span>
          </div>
        </div>

        <!-- Line chart tab -->
        <div id="dpane-line" style="display:none;">
          <div style="position:relative;height:260px;">
            <canvas id="dash-line-chart"></canvas>
          </div>
          <div style="display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;">
            <span style="font-size:11px;color:#888;display:flex;align-items:center;gap:5px;"><span style="display:inline-block;width:14px;height:2px;background:#1a8754;"></span>Actual</span>
            <span style="font-size:11px;color:#888;display:flex;align-items:center;gap:5px;"><span style="display:inline-block;width:14px;height:2px;border-top:2px dashed #2e86c1;"></span>Projected</span>
            <span style="font-size:11px;color:#888;display:flex;align-items:center;gap:5px;"><span style="display:inline-block;width:14px;height:2px;background:#e0a800;"></span>Goal (${fmtMoney(DONATION_GOAL)})</span>
            <span style="font-size:11px;color:#888;display:flex;align-items:center;gap:5px;"><span style="display:inline-block;width:14px;height:2px;border-top:2px dashed #9b59b6;"></span>Average</span>
          </div>
        </div>

        <!-- Projection calculator (always visible below charts) -->
        <div style="margin-top:20px;padding-top:16px;border-top:1.5px solid #f0f0f0;">
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;">
            <div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.6px;">Projection calculator</div>
            <div style="font-size:11px;color:#888;" id="proj-basis-label"></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;">
            <div style="display:flex;flex-direction:column;gap:12px;">
              <div>
                <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
                  <label style="font-size:12px;color:#666;">Families to support</label>
                  <span style="font-size:13px;font-weight:700;color:#111;" id="proj-fam-val">5</span>
                </div>
                <input type="range" min="1" max="30" value="5" step="1" id="proj-fam"
                  style="width:100%;accent-color:#1a3a2a;" oninput="updateDashProjection()">
              </div>
              <div>
                <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
                  <label style="font-size:12px;color:#666;">Cost per family per cycle</label>
                  <span style="font-size:13px;font-weight:700;color:#111;" id="proj-cost-val">$100</span>
                </div>
                <input type="range" min="25" max="300" value="100" step="25" id="proj-cost"
                  style="width:100%;accent-color:#1a3a2a;" oninput="updateDashProjection()">
              </div>
              <div>
                <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
                  <label style="font-size:12px;color:#666;">Cycles per month</label>
                  <span style="font-size:13px;font-weight:700;color:#111;" id="proj-cyc-val">2</span>
                </div>
                <input type="range" min="1" max="4" value="2" step="1" id="proj-cyc"
                  style="width:100%;accent-color:#1a3a2a;" oninput="updateDashProjection()">
              </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;" id="proj-results"></div>
          </div>
        </div>
      </div>`;

    // ── Projection model: avg new donors/month × avg gift (last 3 months) ───
    const histLabels  = dm.map(m => mLabel(m.month));
    const histRecur   = dm.map(m => m.recurring || 0);
    const histOneTime = dm.map(m => m.one_time   || 0);
    const histTotals  = dm.map(m => m.total      || 0);
    const lastTotal   = histTotals.length ? histTotals[histTotals.length - 1] : 0;

    const avgNewDonorsPerMonth = s.proj_avg_donors_per_month || 0;
    const avgDonationPerDonor  = s.proj_avg_gift             || 0;
    const avgMonthly           = s.proj_avg_monthly          || 0;
    const monthlyTrend         = s.proj_monthly_trend        || 0; // $ change per month
    const currentRecurBase     = lastTotal;

    document.getElementById('content').innerHTML = cycleHTML + attentionHTML + quickActionsHTML + upcomingHTML + statsHTML + monthProgressBar + donationsHTML;

    // ── Draw charts ──────────────────────────────────────────────────────────
    if (typeof Chart !== 'undefined') {
      const isDark  = window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches;
      const gridCol = isDark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.05)';
      const tickCol = isDark ? '#999' : '#888';

      const maxY = Math.max(DONATION_GOAL * 1.25, ...histTotals);
      const yMax = Math.ceil(maxY / 200) * 200;

      const goalLinePlugin = {
        id: 'goalLine',
        afterDraw(chart) {
          const {ctx, chartArea:{left,right}, scales:{y}} = chart;
          const yPos = y.getPixelForValue(DONATION_GOAL);
          ctx.save();
          ctx.beginPath(); ctx.setLineDash([6,4]);
          ctx.strokeStyle='#e0a800'; ctx.lineWidth=2;
          ctx.moveTo(left,yPos); ctx.lineTo(right,yPos); ctx.stroke();
          ctx.setLineDash([]);
          const lbl = 'Goal ' + fmtMoney(DONATION_GOAL);
          const lw  = ctx.measureText(lbl).width + 12;
          ctx.fillStyle = isDark ? '#2a2200' : '#fffbec';
          ctx.fillRect(right - lw, yPos - 10, lw, 18);
          ctx.fillStyle = '#b8860b'; ctx.font = 'bold 10px sans-serif';
          ctx.textAlign = 'right';
          ctx.fillText(lbl, right - 4, yPos + 4);
          ctx.restore();
        }
      };

      const yScaleOpts = {
        min: 0, max: yMax,
        grid: { color: gridCol },
        border: { display: false },
        ticks: { color: tickCol, font: { size: 11 }, stepSize: 200, callback: v => '$' + v.toLocaleString() }
      };

      // ── Bar chart (tab 1) ─────────────────────────────────────────────────
      if (window._dashBarChart) { window._dashBarChart.destroy(); }
      const barCanvas = document.getElementById('dash-bar-chart');
      if (barCanvas) {
        window._dashBarChart = new Chart(barCanvas.getContext('2d'), {
          type: 'bar',
          data: {
            labels: histLabels,
            datasets: [
              { label:'Recurring', data:histRecur,   backgroundColor:'#1a8754', stack:'don', barThickness:28, borderRadius:{topLeft:3,topRight:3} },
              { label:'One-time',  data:histOneTime, backgroundColor:'#b2dfdb', stack:'don', barThickness:28, borderRadius:{topLeft:3,topRight:3} }
            ]
          },
          options: {
            responsive:true, maintainAspectRatio:false,
            interaction:{ mode:'index', intersect:false },
            plugins:{ legend:{display:false}, tooltip:{ callbacks:{ footer: items => 'Total: '+fmtMoney(items.reduce((s,i)=>s+i.parsed.y,0)) } } },
            scales:{ x:{ stacked:true, grid:{display:false}, ticks:{color:tickCol,font:{size:11}} }, y:{ stacked:true, ...yScaleOpts } }
          },
          plugins: [goalLinePlugin]
        });
      }

      // ── Line chart (tab 2) ────────────────────────────────────────────────
      // Only use months that have actual donation data (skip empty months)
      const activeDm      = dm.filter(m => (m.total || 0) > 0);
      const lineHistLabels = activeDm.map(m => mLabel(m.month));
      const lineHistTotals = activeDm.map(m => m.total || 0);
      const lineLastTotal  = lineHistTotals.length ? lineHistTotals[lineHistTotals.length - 1] : 0;

      // Projection: last actual total + observed monthly trend × months ahead
      // Monthly trend = avg month-over-month $ change from last 3 months
      // This follows actual momentum rather than compounding donor counts
      const projLabels = [];
      const projVals   = [];
      if (activeDm.length) {
        const lastDate = new Date(activeDm[activeDm.length-1].month + '-01');
        // Use 3-month server average as projection base (smoother than last month's volatile value)
        // Dampen negative trend: cap downside at -5% of avg base per month to avoid cliff-diving
        const projBase = avgMonthly || lineLastTotal;
        const maxDrop  = projBase * 0.05;
        const trendDampened = monthlyTrend >= 0 ? monthlyTrend : Math.max(monthlyTrend, -maxDrop);
        for (let i = 1; i <= 6; i++) {
          const d = new Date(lastDate.getFullYear(), lastDate.getMonth() + i, 1);
          projLabels.push(d.toLocaleDateString('en-US', {month:'short'}));
          const projected = Math.max(0, Math.round(projBase + trendDampened * i));
          projVals.push(projected);
        }
      }

      // Build parallel arrays: actual has nulls where proj is, and vice versa
      // Bridge: both share the last actual point so lines connect
      const allLineLabels = [...lineHistLabels, ...projLabels];
      const actualData    = [
        ...lineHistTotals,
        ...Array(projLabels.length).fill(null)
      ];
      const projData = [
        ...Array(lineHistLabels.length - 1).fill(null),
        lineLastTotal,          // bridge — same as last actual point
        ...projVals
      ];

      // Average line across actual months only
      const avgVal = lineHistTotals.length
        ? Math.round(lineHistTotals.reduce((a,b) => a+b, 0) / lineHistTotals.length)
        : 0;

      const avgLinePlugin = {
        id: 'avgLine',
        afterDraw(chart) {
          if (!avgVal) return;
          const {ctx, chartArea:{left, right}, scales:{y}} = chart;
          const yPos = y.getPixelForValue(avgVal);
          ctx.save();
          ctx.beginPath(); ctx.setLineDash([3, 3]);
          ctx.strokeStyle = '#9b59b6'; ctx.lineWidth = 1.5;
          ctx.moveTo(left, yPos); ctx.lineTo(right, yPos); ctx.stroke();
          ctx.setLineDash([]);
          const lbl = 'Avg ' + fmtMoney(avgVal);
          const lw  = ctx.measureText(lbl).width + 10;
          ctx.fillStyle = isDark ? '#2d1a3a' : '#f5eeff';
          ctx.fillRect(left, yPos - 10, lw, 18);
          ctx.fillStyle = '#7d3c98'; ctx.font = 'bold 10px sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(lbl, left + 4, yPos + 4);
          ctx.restore();
        }
      };

      if (window._dashLineChart) { window._dashLineChart.destroy(); }
      const lineCanvas = document.getElementById('dash-line-chart');
      if (lineCanvas) {
        window._dashLineChart = new Chart(lineCanvas.getContext('2d'), {
          type: 'line',
          data: {
            labels: allLineLabels,
            datasets: [
              {
                label: 'Actual',
                data: actualData,
                borderColor: '#1a8754', borderWidth: 2.5,
                backgroundColor: 'rgba(26,135,84,0.07)',
                fill: true,
                pointBackgroundColor: '#1a8754',
                pointRadius: 5, pointHoverRadius: 7,
                tension: 0.3,
                spanGaps: false,
              },
              {
                label: 'Projected',
                data: projData,
                borderColor: '#2e86c1', borderDash: [6, 4], borderWidth: 2,
                backgroundColor: 'rgba(46,134,193,0.05)',
                fill: true,
                pointBackgroundColor: '#2e86c1',
                pointRadius: ctx => projData[ctx.dataIndex] !== null && ctx.dataIndex >= lineHistLabels.length ? 4 : 0,
                pointHoverRadius: 6,
                tension: 0.3,
                spanGaps: false,
              }
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: ctx => ctx.raw === null ? null : ctx.dataset.label + ': ' + fmtMoney(ctx.raw)
                }
              }
            },
            scales: {
              x: { grid: { display: false }, ticks: { color: tickCol, font: { size: 11 } } },
              y: { ...yScaleOpts }
            }
          },
          plugins: [goalLinePlugin, avgLinePlugin]
        });
      }
    }

    // ── Projection calculator ────────────────────────────────────────────────
    window._dashDonationsCurrent  = s.donations_month || 0;
    window._dashAvgDonorGift      = Math.round(avgDonationPerDonor);
    window._dashAvgNewDonors      = avgNewDonorsPerMonth;
    window._dashMonthlyTrend      = monthlyTrend;
    window._dashAvgMonthly        = Math.round(avgMonthly);
    updateDashProjection();

  } catch(e) {
    document.getElementById('content').innerHTML = `<p style="color:#c00">${e.message}</p>`;
  }
}

function updateDashProjection() {
  const families = parseInt(document.getElementById('proj-fam')?.value  || 5);
  const cost     = parseInt(document.getElementById('proj-cost')?.value || 100);
  const cycles   = parseInt(document.getElementById('proj-cyc')?.value  || 2);
  const current      = window._dashDonationsCurrent || 0;
  const avgGift      = window._dashAvgDonorGift     || 0;
  const avgNew       = window._dashAvgNewDonors     || 0;
  const monthlyTrend = window._dashMonthlyTrend     || 0;
  const avgMonthly   = window._dashAvgMonthly       || 0;

  const fv = document.getElementById('proj-fam-val');
  const cv = document.getElementById('proj-cost-val');
  const yv = document.getElementById('proj-cyc-val');
  if (fv) fv.textContent = families;
  if (cv) cv.textContent = '$' + cost;
  if (yv) yv.textContent = cycles;

  // Show projection basis
  const basisEl = document.getElementById('proj-basis-label');
  if (basisEl) {
    const trendStr = monthlyTrend >= 0
      ? `+${fmtMoney(monthlyTrend)}/mo trend`
      : `${fmtMoney(monthlyTrend)}/mo trend`;
    basisEl.textContent = avgNew > 0
      ? `3-mo avg: ${avgNew} donors · ${fmtMoney(avgGift)} avg gift · ${trendStr}`
      : 'Based on last 3 months of donations';
  }

  const monthlyNeed = families * cost * cycles;
  const annualNeed  = monthlyNeed * 12;
  const gap         = Math.max(0, monthlyNeed - current);
  const coverPct    = Math.min(100, Math.round(current / monthlyNeed * 100));

  // Months to close gap at current trend rate
  let monthsToClose = '—';
  if (gap === 0) {
    monthsToClose = 'Now';
  } else if (monthlyTrend > 0) {
    monthsToClose = Math.ceil(gap / monthlyTrend) + ' mo';
  }

  // New donors needed to close gap at avg gift
  const donorsNeeded = (gap > 0 && avgGift > 0) ? Math.ceil(gap / avgGift) : 0;

  const gapClass   = gap === 0 ? '#f0faf5' : coverPct >= 60 ? '#fffbec' : '#fff5f5';
  const gapTextCol = gap === 0 ? '#1a8754' : coverPct >= 60 ? '#b8860b' : '#c0392b';

  const el = document.getElementById('proj-results');
  if (!el) return;
  el.innerHTML = `
    <div style="background:#f7f7f7;border-radius:8px;padding:10px 12px;">
      <div style="font-size:10px;color:#888;margin-bottom:3px;">Monthly need</div>
      <div style="font-size:18px;font-weight:700;color:#111;">${fmtMoney(monthlyNeed)}</div>
      <div style="font-size:10px;color:#888;margin-top:2px;">${families} fam × $${cost} × ${cycles} cycles</div>
    </div>
    <div style="background:#f7f7f7;border-radius:8px;padding:10px 12px;">
      <div style="font-size:10px;color:#888;margin-bottom:3px;">Annual need</div>
      <div style="font-size:18px;font-weight:700;color:#111;">${fmtMoney(annualNeed)}</div>
      <div style="font-size:10px;color:#888;margin-top:2px;">across 12 months</div>
    </div>
    <div style="background:${gapClass};border-radius:8px;padding:10px 12px;">
      <div style="font-size:10px;color:${gapTextCol};margin-bottom:3px;">Funding gap</div>
      <div style="font-size:18px;font-weight:700;color:${gapTextCol};">${gap===0?'✓ Covered':fmtMoney(gap)+'/mo'}</div>
      <div style="font-size:10px;color:#888;margin-top:2px;">${coverPct}% funded · closes in ${monthsToClose}</div>
    </div>
    <div style="background:#f7f7f7;border-radius:8px;padding:10px 12px;">
      <div style="font-size:10px;color:#888;margin-bottom:3px;">Recurring donors needed</div>
      <div style="font-size:18px;font-weight:700;color:#111;">${gap===0?'0':donorsNeeded}</div>
      <div style="font-size:10px;color:#888;margin-top:2px;">${gap===0?'fully funded':'at '+fmtMoney(avgGift||50)+'/mo avg to close gap'}</div>
    </div>`;
}

function fmtDateShort(iso) {
  if (!iso) return '—';
  const d = new Date(iso.includes('T') ? iso : iso + 'T12:00:00');
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
}

async function seedCycles2026() {
  // Build all 17 bi-weekly Sat-Sun cycles for 2026 (May 9 → Dec 19-20)
  const cycles = [];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let sat = new Date('2026-05-09');
  while (sat <= new Date('2026-12-31')) {
    const sun = new Date(sat); sun.setDate(sat.getDate() + 1);
    const close = new Date(sat); close.setDate(sat.getDate() - 7);
    const open  = new Date(sat); open.setDate(sat.getDate() - 13);
    const fmt = d => d.toISOString().slice(0,10);
    cycles.push({
      title: `${months[sat.getMonth()]} ${sat.getDate()}–${sun.getDate()}, 2026`,
      delivery_date_start: fmt(sat),
      delivery_date_end:   fmt(sun),
      request_open_at:     fmt(open)  + 'T08:00:00',
      request_close_at:    fmt(close) + 'T23:59:00',
      status: 'upcoming',
      notes: 'Auto-seeded'
    });
    sat.setDate(sat.getDate() + 14);
  }

  // First try the bulk endpoint
  try {
    const res = await fetch('/api/admin/seed-cycles-2026', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + STATE.token }
    });
    if (res.ok) {
      const data = await res.json();
      alert(`Done! Created ${data.created} delivery cycles for 2026.${data.deleted > 0 ? ` (Replaced ${data.deleted} old entries.)` : ''}`);
      renderDashboard();
      return;
    }
    const txt = await res.text();
    console.warn('Bulk seed failed (' + res.status + '):', txt);
  } catch(e) { console.warn('Bulk seed threw:', e); }

  // Fallback: create each cycle via the standard endpoint
  if (!confirm(`Creating ${cycles.length} delivery cycles one by one. Continue?`)) return;
  let created = 0, skipped = 0;
  for (const c of cycles) {
    try {
      await POST('/delivery-cycles', c);
      created++;
    } catch(e) {
      if (e.message && e.message.toLowerCase().includes('exist')) skipped++;
      else console.warn('Skipped', c.title, e.message);
      skipped++;
    }
  }
  alert(`Done! Created: ${created} · Skipped: ${skipped}`);
  renderDashboard();
}

  if (search) params.push('search=' + encodeURIComponent(search));
  if (params.length) url += '?' + params.join('&');

  document.getElementById('content').innerHTML = '<p style="color:var(--gray-4)">Loading…</p>';
  try {
    // Fetch families + active cycle orders in parallel
    const [rows, openCycles, shoppingCycles] = await Promise.all([
      GET(url),
      GET('/delivery-cycles?status=open').catch(() => []),
      GET('/delivery-cycles?status=shopping').catch(() => [])
    ]);

    // Pick the most relevant active cycle: open first, then shopping
    const activeCycle = openCycles[0] || shoppingCycles[0] || null;

    // Build family_id → order map for the active cycle
    let orderMap = {};
    if (activeCycle) {
      try {
        const orders = await GET('/delivery-cycles/' + activeCycle.id + '/orders');
        orders.forEach(o => { orderMap[o.family_id] = o; });
      } catch(_) {}
    }

    const hasActiveCycle = !!activeCycle;
    const cycleLabel = hasActiveCycle
      ? `${activeCycle.title} <span style="font-size:11px;font-weight:400;color:var(--gray-4)">(${activeCycle.status})</span>`
      : '';

    function orderBadge(familyId) {
      const o = orderMap[familyId];
      if (!o) return `<span style="font-size:11px;color:var(--gray-3)">—</span>`;
      const s = o.status;
      if (s === 'confirmed')
        return `<span style="display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#1a8754;background:#f0faf5;padding:2px 7px;border-radius:10px;border:1px solid #b7e0ca">✓ Confirmed</span>`;
      if (s === 'submitted')
        return `<span style="display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#b45309;background:#fffbeb;padding:2px 7px;border-radius:10px;border:1px solid #f6d58a">● Submitted</span>`;
      if (s === 'skipped')
        return `<span style="font-size:11px;color:var(--gray-3);font-style:italic">Skipped</span>`;
      if (s === 'delivered')
        return `<span style="display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:#2e86c1;background:#eaf4fb;padding:2px 7px;border-radius:10px;border:1px solid #aad4f0">✓ Delivered</span>`;
      return `<span style="font-size:11px;color:var(--gray-4)">${s}</span>`;
    }

    const colCount = hasActiveCycle ? 11 : 10;

    document.getElementById('content').innerHTML = `
      <div class="table-card">
        <div class="table-header">
          <span class="table-title">All Families</span>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <input class="search-input" placeholder="Search name, phone…"
              id="family-search" value="${search||''}"
              oninput="renderFamilies('${filter}', this.value)">
            <div class="filter-tabs">
              ${['all','pending','active','inactive','paused'].map(f =>
                `<div class="filter-tab ${filter===f?'active':''}"
                  onclick="renderFamilies('${f}', document.getElementById('family-search').value)"
                  >${f}</div>`
              ).join('')}
            </div>
          </div>
        </div>
        ${hasActiveCycle ? `<div style="padding:8px 16px 4px;font-size:12px;color:var(--gray-4)">Showing order status for: <strong>${cycleLabel}</strong></div>` : ''}
        <table>
          <thead><tr>
            <th>ID</th><th>Name</th><th>Phone</th><th>City</th>
            <th>Size</th><th>Status</th>
            ${hasActiveCycle ? '<th>Order</th>' : ''}
            <th>Delivered By</th><th>Shopped By</th><th>Added</th><th></th>
          </tr></thead>
          <tbody>
            ${rows.length ? rows.map(r => `
              <tr id="frow-${r.id}" style="cursor:pointer" onclick="viewFamily('${r.id}')">
                <td><span style="font-family:monospace;font-size:12px;font-weight:700;color:var(--black)">${r.family_code||'—'}</span></td>
                <td><strong>${r.name}</strong></td>
                <td>${r.phone||'—'}</td>
                <td>${r.city||'—'}</td>
                <td>${r.family_size||'—'}</td>
                <td>${badge(r.status)}${r.pending_bundle_size ? ` <span title="Bundle size change pending" style="display:inline-block;font-size:10px;background:#fff3cd;color:#7a4f00;border:1px solid #f0c060;padding:1px 5px;border-radius:3px;font-weight:700;cursor:default">⚠ Bundle</span>` : ''}</td>
                ${hasActiveCycle ? `<td onclick="event.stopPropagation()">${orderBadge(r.id)}</td>` : ''}
                <td style="font-size:12px;color:${r.last_delivery_volunteer?'var(--black)':'var(--gray-3)'};font-weight:${r.last_delivery_volunteer?'600':'400'}">
                  ${r.last_delivery_volunteer||'—'}
                  ${r.last_delivery_date?`<div style="font-size:10px;color:var(--gray-4);font-weight:400">${fmtDateShort(r.last_delivery_date)}</div>`:''}
                </td>
                <td style="font-size:12px;color:${r.last_shopping_volunteer?'var(--black)':'var(--gray-3)'};font-weight:${r.last_shopping_volunteer?'600':'400'}">
                  ${r.last_shopping_volunteer||'—'}
                  ${r.last_shopping_date?`<div style="font-size:10px;color:var(--gray-4);font-weight:400">${fmtDateShort(r.last_shopping_date)}</div>`:''}
                </td>
                <td style="font-size:11px;color:var(--gray-4)">${fmtDate(r.created_at)}</td>
                <td style="white-space:nowrap" onclick="event.stopPropagation()">
                  ${r.status==='pending' ? `
                    <button class="btn btn-sm" style="background:#1a8754;color:#fff" onclick="quickStatusFamily('${r.id}','active')">✓ Approve</button>
                    <button class="btn btn-sm btn-outline" style="color:#c00;border-color:#c00;margin-left:4px" onclick="quickStatusFamily('${r.id}','inactive')">✗</button>
                  ` : ''}
                </td>
              </tr>`).join('') :
              `<tr class="empty-row"><td colspan="${colCount}">No families found</td></tr>`}
          </tbody>
        </table>
      </div>`;
  } catch(e) {
    document.getElementById('content').innerHTML = `<p style="color:#c00">${e.message}</p>`;
  }
}

async function quickStatusFamily(id, status) {
  const row = document.getElementById('frow-' + id);
  if (row) row.style.opacity = '0.4';
  try {
    await PUT('/families/' + id, { status });
    if (status === 'active') {
      viewFamily(id);
    } else {
      renderFamilies(STATE.filter, document.getElementById('family-search')?.value);
    }
  } catch(e) {
    if (row) row.style.opacity = '1';
    alert(e.message);
  }
}

async function openFamilyForm(id) {
  STATE.editId = id || null;
  let r = {};
  if (id) {
    try { r = await GET('/families/' + id); } catch(e) {}
  }
  openDrawer(
    id ? 'Edit Family' : 'Add Family',
    familyFormHTML(r),
    `<button class="btn" onclick="saveFamily()">Save</button>
     <button class="btn btn-outline" onclick="closeDrawer()">Cancel</button>`
  );
}

async function saveFamily() {
  const showErr = msg => {
    const el = document.getElementById('family-form-err');
    el.textContent = msg; el.style.display = 'block';
  };
  const name = document.getElementById('f-name').value.trim();
  if (!name) return showErr('Name is required');
  const payload = {
    name, phone: document.getElementById('f-phone').value.trim(),
    city: document.getElementById('f-city').value.trim(),
    address: document.getElementById('f-address').value.trim(),
    family_size: parseInt(document.getElementById('f-size').value)||null,
    children_count: parseInt(document.getElementById('f-children').value)||null,
    dietary_notes: document.getElementById('f-dietary').value.trim(),
    frequency: document.getElementById('f-frequency').value,
    income_range: document.getElementById('f-income').value,
    status: document.getElementById('f-status').value,
    bundle_size: document.getElementById('f-bundle')?.value || null,
    notes: document.getElementById('f-notes').value.trim()
  };
  try {
    if (STATE.editId) await PUT('/families/' + STATE.editId, payload);
    else await POST('/families', payload);
    closeDrawer();
    renderFamilies(STATE.filter);
  } catch(e) { showErr(e.message); }
}

async function saveFamilyAll(famId) {
  const v = id => document.getElementById('fam-f-' + id)?.value ?? null;
  const payload = {
    name:           v('name'),
    phone:          v('phone'),
    city:           v('city'),
    family_size:    parseInt(v('family_size'))  || null,
    children_count: parseInt(v('children_count')) || null,
    status:         v('status'),
    bundle_size:    v('bundle_size'),
    frequency:      v('frequency'),
    income_range:   v('income_range'),
    address:        v('address'),
    dietary_notes:  v('dietary_notes'),
    notes:          v('notes'),
  };
  // remove nulls for fields that weren't rendered
  Object.keys(payload).forEach(k => { if (payload[k] === null && !document.getElementById('fam-f-' + k)) delete payload[k]; });
  const btn = document.getElementById('fam-save-btn');
  const saved = document.getElementById('fam-saved-' + famId);
  try {
    if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
    await PUT('/families/' + famId, payload);
    if (btn) { btn.disabled = false; btn.textContent = 'Save Changes'; btn.style.display = 'inline-flex'; }
    if (saved) {
      saved.innerHTML = '✓ Saved';
      saved.style.cssText = 'font-size:13px;font-weight:600;color:#1a8754;transition:opacity .3s;';
      clearTimeout(saved._t);
      saved._t = setTimeout(() => { saved.style.opacity='0'; setTimeout(()=>{saved.innerHTML='';saved.style.opacity='1';},300); }, 2500);
    }
  } catch(e) {
    if (btn) { btn.disabled = false; btn.textContent = 'Save Changes'; }
    alert('Failed to save: ' + e.message);
  }
}

async function famSaveField(famId, field, value) {
  try {

}

// slotBox — shows all volunteers assigned to a task type, with add/remove controls
// allSlots: full slots array for this order; taskType: slug; taskLabel: display label
function slotBox(allSlots, taskType, taskLabel, vols, familyId, cycleId) {
  const assigned = (allSlots || []).filter(s => s.task_type === taskType && s.volunteer_name);
  const addSelId = `add-${taskType}-${familyId}`;
  const volOpts  = vols.map(v => `<option value="${v.id}">${v.name}</option>`).join('');

  const volRows = assigned.map(s =>
    `<div style="display:flex;align-items:center;justify-content:space-between;padding:1px 0;">
       <span style="font-size:12px;font-weight:600;color:var(--black);">${s.volunteer_name}</span>
       <button onclick="removeSlot('${s.id}','${familyId}',this)"
         style="border:none;background:none;cursor:pointer;color:var(--gray-3);font-size:18px;line-height:1;padding:0 2px;margin-left:6px;"
         title="Remove">×</button>
     </div>`
  ).join('');

  return `<div style="background:var(--gray-1);padding:8px 10px;">
    <div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--gray-4);margin-bottom:4px;">${taskLabel}</div>
    ${assigned.length ? volRows : '<div style="color:var(--gray-3);font-size:12px;margin-bottom:4px;">—</div>'}
    <div style="display:flex;gap:5px;margin-top:6px;">
      <select id="${addSelId}" style="flex:1;font-size:12px;border:1px solid var(--gray-3);padding:3px 5px;background:#fff;">
        <option value="">+ Add…</option>
        ${volOpts}
      </select>
      <button class="btn btn-sm" style="font-size:11px;padding:3px 8px;white-space:nowrap;"
        onclick="addSlot('${cycleId}','${familyId}','${taskType}','${addSelId}')">Add</button>
    </div>
  </div>`;
}

async function addSlot(cycleId, familyId, taskType, selectId) {
  const sel = document.getElementById(selectId);
  const volunteerId = sel?.value;
  if (!volunteerId) return;
  const volunteerName = sel.options[sel.selectedIndex].text;
  try {
    const slot = await POST('/volunteer-slots', { cycle_id: cycleId, family_id: familyId, task_type: taskType, claimed_by: volunteerId });
    // Surgically insert the new volunteer row before the select — no page reload
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:4px;margin-bottom:3px;';
    row.innerHTML = `<span style="font-size:12px;font-weight:600;">${volunteerName}</span>
      <button onclick="removeSlot('${slot.id}','${familyId}',this)"
        style="border:none;background:none;cursor:pointer;color:var(--gray-3);font-size:16px;line-height:1;padding:0 2px;" title="Remove">×</button>`;
    sel.parentNode.insertBefore(row, sel);
    sel.style.marginTop = '4px';
    sel.value = '';
  } catch(e) { alert('Failed to add: ' + e.message); }
}

async function removeSlot(slotId, familyId, btn) {
  if (!confirm('Remove this volunteer?')) return;
  try {
    await DEL('/volunteer-slots/' + slotId);
    // Surgically remove the volunteer row — no page reload
    if (btn) btn.closest('div')?.remove();
    else viewFamily(familyId); // fallback for any other callers
  } catch(e) { alert('Failed to remove: ' + e.message); }
}

    // ── Pending bundle change alert ────────────────────────────────────────────
    const bundleChangeAlert = r.pending_bundle_size ? `
