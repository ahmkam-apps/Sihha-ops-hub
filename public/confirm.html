<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm Your Bundle — SIHAA</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #f5f5f0; color: #1a1a1a; min-height: 100vh; }
  .header { background: #1a3a2a; color: #fff; padding: 16px 20px; }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header p  { font-size: 13px; opacity: .75; margin-top: 2px; }
  .container { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  .card { background: #fff; border-radius: 12px; padding: 18px 20px; margin-bottom: 14px;
          box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .card-title { font-size: 13px; font-weight: 700; text-transform: uppercase;
                letter-spacing: .8px; color: #888; margin-bottom: 12px; }
  .info-row { display: flex; justify-content: space-between; font-size: 14px;
              padding: 5px 0; border-bottom: 1px solid #f0f0f0; }
  .info-row:last-child { border-bottom: none; }
  .info-label { color: #666; }
  .info-value { font-weight: 600; }
  .category-label { font-size: 11px; font-weight: 700; text-transform: uppercase;
                    letter-spacing: .7px; color: #1a3a2a; margin: 14px 0 8px; }
  .item-row { display: flex; align-items: center; gap: 12px; padding: 9px 0;
              border-bottom: 1px solid #f5f5f5; cursor: pointer; }
  .item-row:last-child { border-bottom: none; }
  .item-row input[type=checkbox] { width: 18px; height: 18px; cursor: pointer;
                                    accent-color: #1a3a2a; flex-shrink: 0; }
  .item-name { flex: 1; font-size: 15px; }
  .item-qty  { font-size: 13px; color: #888; white-space: nowrap; }
  .item-row.unchecked .item-name { color: #aaa; text-decoration: line-through; }
  .note-field { width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px;
                font-size: 14px; font-family: inherit; resize: vertical; min-height: 80px;
                margin-top: 4px; }
  .note-field:focus { outline: none; border-color: #1a3a2a; }
  .btn { display: block; width: 100%; padding: 14px; border-radius: 10px;
         font-size: 16px; font-weight: 700; border: none; cursor: pointer;
         transition: opacity .15s; }
  .btn:active { opacity: .85; }
  .btn-confirm { background: #1a3a2a; color: #fff; margin-bottom: 10px; }
  .btn-skip    { background: #f5f5f0; color: #666; border: 1.5px solid #ddd; }
  .success { text-align: center; padding: 40px 20px; }
  .success .icon { font-size: 52px; margin-bottom: 12px; }
  .success h2 { font-size: 22px; font-weight: 700; color: #1a3a2a; margin-bottom: 8px; }
  .success p  { font-size: 15px; color: #666; line-height: 1.5; }
  .alert { padding: 12px 16px; border-radius: 8px; font-size: 14px; margin-bottom: 14px; }
  .alert-warn { background: #fffbec; border: 1px solid #f0c040; color: #7a6000; }
  .loading { text-align: center; padding: 60px 20px; color: #888; font-size: 15px; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px;
           font-weight: 700; margin-left: 6px; }
  .badge-green { background: #e8f5e9; color: #1a5e34; }
  .badge-amber { background: #fffbec; color: #7a6000; }
</style>
</head>
<body>

<div class="header">
  <h1>SIHAA Food Charity</h1>
  <p>Bundle Confirmation</p>
</div>

<div class="container" id="app">
  <div class="loading">Loading your bundle…</div>
</div>

<script>
const token = location.pathname.split('/').pop();
let reqData  = null;

async function load() {
  try {
    const res = await fetch(`/api/family/confirm/${token}`);
    if (!res.ok) { showError(await res.json()); return; }
    reqData = await res.json();
    render();
  } catch(e) {
    showError({ error: 'Could not load your bundle. Please try again.' });
  }
}

function render() {
  const r = reqData;
  const already = ['confirmed','auto_confirmed','skipped'].includes(r.status);

  // Group items by category
  const cats = {};
  (r.items || []).forEach(item => {
    if (!cats[item.category]) cats[item.category] = [];
    cats[item.category].push(item);
  });

  const statusBadge = r.status === 'confirmed' || r.status === 'auto_confirmed'
    ? `<span class="badge badge-green">${r.status === 'auto_confirmed' ? 'Auto-confirmed' : 'Confirmed'}</span>`
    : r.status === 'skipped'
    ? `<span class="badge badge-amber">Skipped</span>`
    : '';

  const alreadyMsg = already ? `
    <div class="alert alert-warn">
      ${r.status === 'skipped'
        ? '⚠️ You have already skipped this delivery.'
        : '✅ Your bundle has already been confirmed.'}
      You can still update your selections below.
    </div>` : '';

  const itemsHTML = Object.entries(cats).map(([cat, items]) => `
    <div class="category-label">${cat}</div>
    ${items.map(item => `
      <label class="item-row ${item.selected ? '' : 'unchecked'}" id="row-${item.id}">
        <input type="checkbox" id="chk-${item.id}" ${item.selected ? 'checked' : ''}
               onchange="toggleItem('${item.id}', this.checked)">
        <span class="item-name">${item.name}</span>
        <span class="item-qty">${item.quantity || ''} ${item.unit || ''}</span>
      </label>`).join('')}
  `).join('');

  document.getElementById('app').innerHTML = `
    ${alreadyMsg}
    <div class="card">
      <div class="card-title">Delivery Details</div>
      <div class="info-row">
        <span class="info-label">Family</span>
        <span class="info-value">${r.family_name} ${statusBadge}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Cycle</span>
        <span class="info-value">${r.cycle_title}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Delivery Date</span>
        <span class="info-value">${formatDate(r.delivery_date_start)}</span>
      </div>
      <div class="info-row">
        <span class="info-label">Bundle Size</span>
        <span class="info-value">${{S:'Small',M:'Medium',L:'Large'}[r.bundle_size] || r.bundle_size}</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Your Food Bundle</div>
      <p style="font-size:13px;color:#888;margin-bottom:12px;">
        Uncheck any items you don't need. Everything else will be included.
      </p>
      ${itemsHTML}
    </div>

    <div class="card">
      <div class="card-title">Notes (optional)</div>
      <textarea class="note-field" id="notes" placeholder="Dietary changes, special requests, or anything we should know…">${r.notes || ''}</textarea>
    </div>

    <button class="btn btn-confirm" onclick="confirm()">✓ Confirm My Bundle</button>
    <button class="btn btn-skip"    onclick="skip()">Skip This Delivery</button>
  `;

}

function formatDate(iso) {
  if (!iso) return '—';
  return new Date(iso + 'T12:00:00').toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
}

function toggleItem(id, checked) {
  const row = document.getElementById('row-' + id);
  if (checked) row.classList.remove('unchecked');
  else         row.classList.add('unchecked');
  // Update in reqData
  const item = reqData.items.find(i => i.id === id);
  if (item) item.selected = checked ? 1 : 0;
}

async function confirm() {
  const selectedItems = (reqData.items || []).filter(i => i.selected).map(i => i.id);
  const notes = document.getElementById('notes').value;
  await submit('confirm', selectedItems, notes);
}

async function skip() {
  if (!window.confirm('Skip this delivery? Your family will not receive a bundle this cycle.')) return;
  const notes = document.getElementById('notes').value;
  await submit('skip', [], notes);
}

async function submit(action, selectedItems, notes) {
  try {
    const res = await fetch(`/api/family/confirm/${token}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, selected_items: selectedItems, notes })
    });
    const data = await res.json();
    if (!res.ok) { alert(data.error || 'Something went wrong. Please try again.'); return; }
    showSuccess(action);
  } catch(e) {
    alert('Network error. Please try again.');
  }
}

function showSuccess(action) {
  document.getElementById('app').innerHTML = `
    <div class="success">
      <div class="icon">${action === 'skip' ? '🙏' : '✅'}</div>
      <h2>${action === 'skip' ? 'Got it!' : 'Bundle Confirmed!'}</h2>
      <p>${action === 'skip'
        ? 'We\'ve noted that you\'re skipping this delivery. We\'ll see you next time, inshAllah.'
        : 'JazakAllah Khair! Your bundle is confirmed. Our volunteer will deliver it on the scheduled date.'
      }</p>
    </div>`;
}

function showError(data) {
  document.getElementById('app').innerHTML = `
    <div class="card" style="text-align:center;padding:30px 20px;">
      <div style="font-size:32px;margin-bottom:10px;">⚠️</div>
      <p style="color:#c00;font-size:15px;">${data.error || 'Something went wrong.'}</p>
    </div>`;
}

load();
</script>
</body>
</html>
